// ═══════════════════════════════════════════════════════════
//  CONTATOS DE ENVIOS EXTRA — cadastro local (localStorage)
//  + helpers de vinculação com rotas (WhatsApp button)
// ═══════════════════════════════════════════════════════════
const _CT_KEY = 'contatos_envios_extra_v1';

// Normaliza nome pra comparação (remove acentos, lowercase, trim)
function _ctNorm(s) {
  return String(s||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase().trim();
}

// Limpa telefone (só dígitos) e formata pro WhatsApp
function _ctTelLimpo(t) { return String(t||'').replace(/\D/g, ''); }
function _ctWhatsLink(t) {
  const n = _ctTelLimpo(t);
  if (!n) return '';
  const fmt = (n.length === 11 || n.length === 10) ? '55' + n : n;
  return `https://wa.me/${fmt}`;
}

// Acha um contato pela rota — tenta motorista + placa
// Retorna o objeto contato ou null
function _ctAcharPorRota(r) {
  if (!r) return null;
  const lista = _contatosLer();
  if (!lista.length) return null;
  const motorista = _ctNorm(r.motorista || '');
  const placa = _ctNorm(r.placa || '');
  // 1) Match exato por placa
  if (placa) {
    const cPlaca = lista.find(c => _ctNorm(c.placa) === placa);
    if (cPlaca) return cPlaca;
  }
  // 2) Match exato por nome do motorista
  if (motorista) {
    const cNome = lista.find(c => _ctNorm(c.nome) === motorista);
    if (cNome) return cNome;
  }
  // 3) Match parcial por nome (todas as palavras do motorista aparecem no contato)
  if (motorista) {
    const palavras = motorista.split(/\s+/).filter(p => p.length >= 3);
    if (palavras.length) {
      const cParc = lista.find(c => {
        const n = _ctNorm(c.nome);
        return palavras.every(p => n.includes(p));
      });
      if (cParc) return cParc;
    }
  }
  return null;
}

// Renderiza um botão WhatsApp pequeno se houver contato pra rota
// (compacto, pra usar em tabelas de rotas)
function ctWhatsBtnHTML(r) {
  const c = _ctAcharPorRota(r);
  if (!c) return '';
  const url = _ctWhatsLink(c.tel);
  if (!url) return '';
  const nome = String(c.nome||'').replace(/"/g, '&quot;');
  return `<a href="${url}" target="_blank" rel="noopener noreferrer"
    class="whatsapp-btn"
    title="WhatsApp: ${nome} (${c.tel})"
    style="display:inline-flex;align-items:center;gap:3px;background:#22c55e;color:#fff;text-decoration:none;
           padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle">💬</a>`;
}

// Atualiza cookie do AdminML no bot sem precisar reiniciar
async function _atualizarCookieBot() {
  const instrucao = `Cole o cookie do AdminML abaixo:\n\n1. Abra envios.adminml.com no Chrome\n2. F12 → Network → clique em qualquer requisição → Headers\n3. Copie o valor do campo "cookie:" completo`;
  const cookie = prompt(instrucao);
  if (!cookie || cookie.trim().length < 50) return;
  const el = document.getElementById('contatos-sync-status');
  if (el) el.textContent = '🔑 Atualizando cookie...';
  try {
    const resp = await fetch('http://localhost:8080/api/update-cookie', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cookie: cookie.trim() }),
      signal: AbortSignal.timeout(5000)
    });
    const data = await resp.json();
    if (el) el.textContent = data.ok ? `✅ ${data.msg}` : `❌ ${data.msg}`;
    setTimeout(() => { if (el) el.textContent = ''; }, 5000);
    if (data.ok) alert('✅ Cookie atualizado! O bot vai usar o novo cookie no próximo ciclo de coleta.');
  } catch(e) {
    if (el) el.textContent = '❌ Bot offline ou erro';
    setTimeout(() => { if (el) el.textContent = ''; }, 4000);
    alert('❌ Não foi possível conectar ao bot. Verifique se está rodando.');
  }
}

// Sincroniza contatos automaticamente com o bot local (porta 8080)
// Só adiciona/atualiza drivers com prefixo ct_adminml_ ou ct_placa_ — nunca apaga manuais
async function _contatosSincronizarBot() {
  try {
    const resp = await fetch('http://localhost:8080/api/contatos-extra', { signal: AbortSignal.timeout(4000) });
    if (!resp.ok) return;
    const data = await resp.json();
    const novos = data.contatos || [];
    if (!novos.length) return;
    const lista = _contatosLer();
    let adicionados = 0, atualizados = 0;
    novos.forEach(c => {
      if (!c.id) return;
      const idx = lista.findIndex(x => x.id === c.id);
      if (idx >= 0) {
        // Só atualiza se dados do bot são mais novos
        const tsBot   = c.atualizado   || '';
        const tsLocal = lista[idx].atualizado || '';
        if (tsBot > tsLocal) { lista[idx] = c; atualizados++; }
      } else {
        lista.push(c);
        adicionados++;
      }
    });
    if (adicionados + atualizados > 0) {
      _contatosSalvarLista(lista);
      const el = document.getElementById('contatos-sync-status');
      if (el) el.textContent = `🔄 Sincronizado: +${adicionados} novos, ${atualizados} atualizados`;
      setTimeout(() => { if (el) el.textContent = ''; }, 4000);
    }
  } catch (_) { /* bot offline ou sem contatos novos — silencioso */ }
}

function _contatosLer() {
  try { return JSON.parse(localStorage.getItem(_CT_KEY) || '[]'); }
  catch (_) { return []; }
}

// Marca de quando este navegador sincronizou pela ultima vez com a copia
// compartilhada (dados/contatos_manual.json no bot) — evita que um fetch
// logo depois de salvar sobrescreva a propria edicao antes do bot processar.
const _CT_MANUAL_SYNCED_KEY = 'contatos_manual_synced_at_v1';

function _contatosSalvarLista(lista) {
  localStorage.setItem(_CT_KEY, JSON.stringify(lista));
  const agora = new Date().toISOString();
  localStorage.setItem(_CT_MANUAL_SYNCED_KEY, agora);
  // Envia pro bot local gravar em dados/contatos_manual.json (fire-and-forget).
  // Só funciona na mesma máquina onde o bot roda — no link público (GitHub
  // Pages) essa chamada falha silenciosamente, o que é esperado: editar
  // contatos só persiste de verdade a partir da máquina do bot; qualquer
  // outro dispositivo só consegue VER a lista (ela chega via publicação).
  fetch('http://localhost:8080/api/contatos-manual', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contatos: lista }),
    signal: AbortSignal.timeout(4000),
  }).catch(() => {});
}

// Traz a lista de contatos manuais direto do bot local (mesma máquina) —
// usado pelo dashboard LOCAL, em paralelo ao _contatosSincronizarBot()
// (que traz só os contatos auto-descobertos).
async function _contatosSincronizarManualBot() {
  try {
    const resp = await fetch('http://localhost:8080/api/contatos-manual', { signal: AbortSignal.timeout(4000) });
    if (!resp.ok) return;
    const data = await resp.json();
    _mergeContatosManualDoServidor(data.contatos, data.atualizado);
  } catch (_) { /* bot offline — silencioso */ }
}

// Traz a lista de contatos manuais que já veio junto do payload decriptado
// (usado pela página PÚBLICA — GitHub Pages — que não tem acesso a localhost).
function _contatosSincronizarManualDoServidor(latest) {
  if (!latest || !Array.isArray(latest.contatos_manual)) return;
  _mergeContatosManualDoServidor(latest.contatos_manual, latest.contatos_manual_atualizado);
}

// Lógica compartilhada: só adota a lista do servidor se ela for mais nova
// que a última vez que ESTE navegador sincronizou (evita sobrescrever uma
// edição feita há poucos segundos, antes do bot ter processado o POST).
function _mergeContatosManualDoServidor(listaServidor, tsServidor) {
  try {
    if (!Array.isArray(listaServidor)) return;
    const tsLocal = localStorage.getItem(_CT_MANUAL_SYNCED_KEY) || '';
    if ((tsServidor && tsServidor > tsLocal) || (!tsLocal && listaServidor.length)) {
      localStorage.setItem(_CT_KEY, JSON.stringify(listaServidor));
      localStorage.setItem(_CT_MANUAL_SYNCED_KEY, tsServidor || new Date().toISOString());
      if (typeof activeTab !== 'undefined' && activeTab === 'contatos') renderContatosTab();
    }
  } catch (_) { /* localStorage indisponível — ignora */ }
}

function _novatosListar() {
  const lista   = _contatosLer();
  const dias    = _novatosGetDias();
  const contat  = _novatosGetContatados();
  const limiteMs = dias * 24 * 60 * 60 * 1000;
  const agora   = Date.now();
  return lista.filter(c => {
    if (!c.tel) return false;
    if (contat[c.placa]) return false; // já contatado
    // Verifica primeira_data (campo vindo do bot) ou usa atualizado como fallback
    const dataRef = c.primeira_data || c.atualizado || '';
    if (!dataRef) return false;
    const diff = agora - new Date(dataRef).getTime();
    return diff >= 0 && diff <= limiteMs;
  });

// Importa contatos de arquivo CSV. Aceita ; ou , como separador.
// Cabeçalhos aceitos (case insensitive): nome, funcao/função, transportadora,
// tcp, telefone/tel/whatsapp, placa, observacao/obs.
function _contatosImportarCSV(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      let texto = String(e.target.result || '');
      // Remove BOM se houver
      if (texto.charCodeAt(0) === 0xFEFF) texto = texto.slice(1);
      const linhas = texto.split(/\r?\n/).filter(l => l.trim().length > 0);
      if (!linhas.length) { alert('Arquivo CSV vazio.'); return; }

      // Detecta separador (; ou ,) pela linha de cabeçalho
      const sep = (linhas[0].match(/;/g)||[]).length > (linhas[0].match(/,/g)||[]).length ? ';' : ',';

      // Parser de CSV simples (sem aspas escapadas internamente — suficiente
      // pro caso de exportar/importar do próprio bot)
      const parseLine = (line) => {
        const out = [];
        let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
          const ch = line[i];
          if (ch === '"') { inQ = !inQ; }
          else if (ch === sep && !inQ) { out.push(cur); cur = ''; }
          else cur += ch;
        }
        out.push(cur);
        return out.map(s => s.trim());
      };

      const headers = parseLine(linhas[0]).map(h => h.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''));
      // Mapeia coluna → campo do contato
      const mapaCol = {};
      headers.forEach((h, i) => {
        if (/^nome$/.test(h)) mapaCol.nome = i;
        else if (/^funcao$|^funç/.test(h)) mapaCol.funcao = i;
        else if (/^transportadora$|^tcp$/.test(h)) mapaCol.tcp = i;
        else if (/^telefone$|^tel$|whatsapp/.test(h)) mapaCol.tel = i;
        else if (/^placa$/.test(h)) mapaCol.placa = i;
        else if (/^obs|observ/.test(h)) mapaCol.obs = i;
      });
      if (mapaCol.nome == null && mapaCol.tel == null) {
        alert('CSV inválido: precisa de pelo menos colunas "Nome" e "Telefone".\n\nCabeçalhos detectados: ' + headers.join(', '));
        return;
      }

      const novos = [];
      for (let i = 1; i < linhas.length; i++) {
        const cols = parseLine(linhas[i]);
        const nome = (cols[mapaCol.nome] || '').trim();
        const tel  = (cols[mapaCol.tel]  || '').trim();
        if (!nome && !tel) continue;
        novos.push({
          id: 'ct_' + Date.now() + '_' + Math.random().toString(36).slice(2,7) + '_' + i,
          nome,
          funcao: ((cols[mapaCol.funcao]||'motorista').toLowerCase().trim()) || 'motorista',
          tcp:    (cols[mapaCol.tcp]||'').trim() || 'Envios Extra',
          tel,
          placa:  (cols[mapaCol.placa]||'').trim().toUpperCase(),
          obs:    (cols[mapaCol.obs]||'').trim(),
          atualizado: new Date().toISOString(),
        });
      }
      if (!novos.length) { alert('Nenhum contato válido encontrado no CSV.'); return; }
      if (!confirm(`Importar ${novos.length} contato(s) do CSV? Eles serão ADICIONADOS aos existentes.`)) return;
      const lista = _contatosLer();
      // Dedup por nome+telefone (não duplica se já existe igual)
      const existeChave = new Set(lista.map(c => _ctNorm(c.nome) + '|' + _ctTelLimpo(c.tel)));
      let novosCount = 0;
      novos.forEach(c => {
        const chv = _ctNorm(c.nome) + '|' + _ctTelLimpo(c.tel);
        if (existeChave.has(chv)) return;
        existeChave.add(chv);
        lista.push(c);
        novosCount++;
      });
      _contatosSalvarLista(lista);
      renderContatosTab();
      alert(`✓ ${novosCount} novo(s) contato(s) importado(s).\n${novos.length - novosCount} duplicado(s) ignorado(s).`);
    } catch (err) {
      alert('Erro ao ler CSV: ' + err.message);
    }
  };
  reader.readAsText(file);
}

function _contatosImportar(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      const novos = Array.isArray(data) ? data : (data.contatos || []);
      if (!Array.isArray(novos) || !novos.length) {
        alert('Arquivo inválido ou vazio.'); return;
      }
      if (!confirm(`Importar ${novos.length} contato(s)? Os existentes serão mesclados (mesmo ID = atualiza).`)) return;
      const lista = _contatosLer();
      novos.forEach(c => {
        if (!c.id) c.id = 'ct_' + Date.now() + '_' + Math.random().toString(36).slice(2,7);
        const idx = lista.findIndex(x => x.id === c.id);
        if (idx >= 0) lista[idx] = c;
        else lista.push(c);
      });
      _contatosSalvarLista(lista);
      renderContatosTab();
      alert(`✓ ${novos.length} contato(s) importado(s).`);
    } catch (err) {
      alert('Erro ao ler arquivo JSON: ' + err.message);
    }
  };
  reader.readAsText(file);
}

// ═══════════════════════════════════════════════════════════
//  COMPARATIVO SEMANAL — histórico do bot
// ═══════════════════════════════════════════════════════════
let _semanalCache = null;

// Atualiza threshold de Stem/ORH e re-renderiza a aba
function _semanalUpdateThr(id, val) {
  const key = id === 'semanal-stem-thr' ? 'semanal_stem_thr' : 'semanal_orh_thr';
  localStorage.setItem(key, val);
  _semanalCache = null;
  renderSemanalTab(true);
}

// Atualiza filtro de Origem (compartilhado pelas 3 tabelas) e re-renderiza
function _semanalUpdateOrigem(val) {
  localStorage.setItem('semanal_origem', val);
  _semanalCache = null;
  renderSemanalTab(true);
}

// Atualiza ordem (asc/desc) de uma das 3 tabelas e re-renderiza
function _semanalUpdateOrdem(id, val) {
  const mapKey = {
    'semanal-falhas-ordem': 'semanal_falhas_ordem',
    'semanal-stem-ordem':   'semanal_stem_ordem',
    'semanal-orh-ordem':    'semanal_orh_ordem',
  };
  const key = mapKey[id];
  if (!key) return;
  localStorage.setItem(key, val);
  _semanalCache = null;
  renderSemanalTab(true);
}

// Exporta as 3 tabelas em CSV
function _exportarSemanalCSV() {
  const dados = window._semanalOfensores || {};
  const linhas = ['categoria;ranking;motorista;transportadora;dias;rotas;total;media'];
  ['falhas', 'stem', 'orh'].forEach(cat => {
    (dados[cat] || []).forEach((m, i) => {
      linhas.push([
        cat, i+1,
        (m.motorista||'').replace(/;/g,','),
        (m.transportadora||'').replace(/;/g,','),
        m.dias, m.rotas, m.total, m.media.toFixed(2),
      ].join(';'));
    });
  });
  const csv = linhas.join('\n');
  const today = new Date().toISOString().slice(0,10);
  _downloadFile(`top_ofensores_semanal_${today}.csv`, csv, 'text/csv;charset=utf-8');
}

function _exportarSemanalJSON() {
  const dados = window._semanalOfensores || {};
  const out = {
    gerado_em: new Date().toISOString(),
    dias_analisados: 7,
    snapshots_brutos: window._semOfData || [],
    rankings: {
      falhas: dados.falhas || [],
      stem:   dados.stem   || [],
      orh:    dados.orh    || [],
    },
  };
  const today = new Date().toISOString().slice(0,10);
  _downloadFile(`top_ofensores_semanal_${today}.json`,
                JSON.stringify(out, null, 2), 'application/json');
}

// Filtra as 3 tabelas de Top Ofensores pelo nome do motorista
function _filtrarSemanal(termo) {
  const q = (termo||'').trim().toLowerCase();
  let totalVisiveis = 0;
  // Procura todas as tabelas dentro do panel-semanal
  const panel = document.getElementById('panel-semanal');
  if (!panel) return;
  panel.querySelectorAll('table tbody tr').forEach(tr => {
    // Pula linhas que NÃO são de ofensores (a tabela de evolução tem "Data" no header)
    const ths = tr.closest('table')?.querySelector('thead tr')?.cells || [];
    const ehOfensores = Array.from(ths).some(th => /motorista/i.test(th.textContent||''));
    if (!ehOfensores) return;
    const tds = tr.cells;
    if (!tds || tds.length < 3) return;
    const motorista = (tds[1]?.textContent || '').toLowerCase();
    const transp    = (tds[2]?.textContent || '').toLowerCase();
    if (!q || motorista.includes(q) || transp.includes(q)) {
      tr.style.display = '';
      totalVisiveis++;
    } else {
      tr.style.display = 'none';
    }
  });
  const cnt = document.getElementById('semanal-busca-count');
  if (cnt) cnt.textContent = q ? `${totalVisiveis} resultado(s)` : '';
}

async function renderSemanalTab(forceReload) {
  const el = document.getElementById('semanal-content');
  if (!el) return;
  if (_semanalCache && !forceReload) {
    el.innerHTML = _semanalCache;
    return;
  }
  el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text3)">Carregando histórico semanal...</div>';

  // Busca os últimos 14 dias de histórico (incluindo o de hoje, do payload atual)
  const fmtDate = (d) => d.toISOString().slice(0,10);
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dias = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(hoje); d.setDate(d.getDate() - i);
    dias.push(fmtDate(d));
  }
  // hoje vem de history.jsonl (sem sufixo); outros de history_YYYY-MM-DD.jsonl
  const hojeStr = fmtDate(hoje);
  const fetches = dias.map(async (d) => {
    const url = d === hojeStr
      ? `/dados/history.jsonl?_t=${Date.now()}`
      : `/dados/history_${d}.jsonl?_t=${Date.now()}`;
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) return { data: d, snaps: [] };
      const txt = await r.text();
      const snaps = txt.split('\n').filter(Boolean).map(line => {
        try { return JSON.parse(line); } catch (_) { return null; }
      }).filter(Boolean);
      return { data: d, snaps };
    } catch (_) {
      return { data: d, snaps: [] };
    }
  });
  const resultados = await Promise.all(fetches);

  // Pega o ÚLTIMO snapshot de cada dia (valor final consolidado)
  const diasFinais = resultados.map(({data, snaps}) => {
    if (!snaps.length) return { data, vazio: true };
    const last = snaps[snaps.length - 1];
    return {
      data, vazio: false,
      rotas:     last.rotas || 0,
      entregues: last.entregues || 0,
      falhas:    last.falhas || 0,
      pendentes: last.pendentes || 0,
      pacotes:   (last.entregues||0) + (last.falhas||0) + (last.pendentes||0),
      ds:        last.ds_pct || 0,
    };
  });
  // 7 últimos = semana atual; 7 anteriores = semana anterior
  const semAtual    = diasFinais.slice(7, 14);
  const semAnterior = diasFinais.slice(0, 7);
  const somar = (arr, campo) => arr.reduce((s,d) => s+(d[campo]||0), 0);
  const mediaDs = (arr) => {
    const valid = arr.filter(d => !d.vazio && d.pacotes > 0);
    if (!valid.length) return 0;
    const totEnt = valid.reduce((s,d) => s+d.entregues, 0);
    const totPkt = valid.reduce((s,d) => s+d.pacotes, 0);
    return totPkt > 0 ? (totEnt/totPkt*100) : 0;
  };

  const A = {
    rotas:     somar(semAtual, 'rotas'),
    pacotes:   somar(semAtual, 'pacotes'),
    entregues: somar(semAtual, 'entregues'),
    falhas:    somar(semAtual, 'falhas'),
    ds:        mediaDs(semAtual),
  };
  const P = {
    rotas:     somar(semAnterior, 'rotas'),
    pacotes:   somar(semAnterior, 'pacotes'),
    entregues: somar(semAnterior, 'entregues'),
    falhas:    somar(semAnterior, 'falhas'),
    ds:        mediaDs(semAnterior),
  };
  const variacao = (atual, anterior) => {
    if (!anterior) return atual > 0 ? '+∞%' : '—';
    const delta = ((atual - anterior) / anterior * 100);
    return (delta >= 0 ? '+' : '') + delta.toFixed(1) + '%';
  };
  const corVar = (v, melhor = 'positiva') => {
    if (v === '—' || v === '+∞%') return 'var(--text3)';
    const n = parseFloat(v);
    if (Math.abs(n) < 0.5) return 'var(--text3)';
    if (melhor === 'positiva') return n > 0 ? 'var(--green)' : 'var(--red)';
    return n < 0 ? 'var(--green)' : 'var(--red)';
  };
  const fmtBR = (n) => Number(n||0).toLocaleString('pt-BR');

  // KPI cards
  const kpis = [
    { label: 'Rotas',     A: A.rotas,     P: P.rotas,     melhor: 'positiva' },
    { label: 'Pacotes',   A: A.pacotes,   P: P.pacotes,   melhor: 'positiva' },
    { label: 'Entregues', A: A.entregues, P: P.entregues, melhor: 'positiva' },
    { label: 'Falhas',    A: A.falhas,    P: P.falhas,    melhor: 'negativa' },
  ];
  let html = `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:24px">`;
  // DS comparativo (destaque)
  const dsVar = variacao(A.ds, P.ds);
  html += `<div style="background:#1e3a8a;border:1px solid #1e40af;border-radius:10px;padding:16px;text-align:center;color:#fff">
    <div style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.8">DS Geral</div>
    <div style="font-size:32px;font-weight:800;margin-top:6px">${A.ds.toFixed(2).replace('.',',')}%</div>
    <div style="font-size:12px;opacity:.7;margin-top:4px">vs ${P.ds.toFixed(2).replace('.',',')}% (sem ant)</div>
    <div style="font-size:13px;font-weight:700;margin-top:6px;color:${A.ds>=P.ds?'#22c55e':'#ef4444'}">${dsVar}</div>
  </div>`;
  kpis.forEach(k => {
    const v = variacao(k.A, k.P);
    const cor = corVar(v, k.melhor);
    html += `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
      <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em">${k.label}</div>
      <div style="font-size:26px;font-weight:800;color:var(--text);margin-top:6px">${fmtBR(k.A)}</div>
      <div style="font-size:11px;color:var(--text3);margin-top:4px">vs ${fmtBR(k.P)} (sem ant)</div>
      <div style="font-size:13px;font-weight:700;margin-top:6px;color:${cor}">${v}</div>
    </div>`;
  });
  html += `</div>`;

  // Tabela dia-a-dia
  const fmtDateBR = (s) => {
    const [y,m,d] = s.split('-');
    const dt = new Date(s); dt.setHours(12);
    const dia = ['DOM','SEG','TER','QUA','QUI','SEX','SAB'][dt.getDay()];
    return `${dia} ${d}/${m}`;
  };
  html += `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
    <div style="background:#1e3a8a;color:#fff;padding:10px;font-weight:800;text-align:center">📊 EVOLUÇÃO DIA A DIA</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead style="background:#1e40af;color:#fff">
        <tr>
          <th style="padding:8px;border:1px solid #1e3a8a">Data</th>
          <th style="padding:8px;border:1px solid #1e3a8a;text-align:center">Rotas</th>
          <th style="padding:8px;border:1px solid #1e3a8a;text-align:center">Pacotes</th>
          <th style="padding:8px;border:1px solid #1e3a8a;text-align:center">Entregues</th>
          <th style="padding:8px;border:1px solid #1e3a8a;text-align:center">Falhas</th>
          <th style="padding:8px;border:1px solid #1e3a8a;text-align:center">Pendentes</th>
          <th style="padding:8px;border:1px solid #1e3a8a;text-align:center">DS %</th>
        </tr>
      </thead>
      <tbody>`;
  diasFinais.forEach((d, i) => {
    const isAtual = i >= 7;
    const labelSem = isAtual ? '🟢' : '⚪';
    const bg = i % 2 ? 'background:var(--bg3)' : '';
    if (d.vazio) {
      html += `<tr style="${bg};opacity:.4">
        <td style="padding:8px;border:1px solid var(--border)">${labelSem} ${fmtDateBR(d.data)}</td>
        <td colspan="6" style="padding:8px;border:1px solid var(--border);text-align:center;color:var(--text3);font-style:italic">— sem dados —</td>
      </tr>`;
      return;
    }
    const dsCor = d.ds >= 98.1 ? 'var(--green)' : d.ds >= 95 ? 'var(--yellow)' : 'var(--red)';
    html += `<tr style="${bg}">
      <td style="padding:8px;border:1px solid var(--border);font-weight:600">${labelSem} ${fmtDateBR(d.data)}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center">${fmtBR(d.rotas)}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center;color:var(--blue)">${fmtBR(d.pacotes)}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center;color:var(--green)">${fmtBR(d.entregues)}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center;color:${d.falhas>0?'var(--red)':'var(--text3)'}">${fmtBR(d.falhas)}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center;color:var(--yellow)">${fmtBR(d.pendentes)}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center;font-weight:800;color:${dsCor}">${d.ds.toFixed(2).replace('.',',')}%</td>
    </tr>`;
  });
  html += `</tbody></table>
    <div style="padding:10px;background:var(--bg3);font-size:11px;color:var(--text3);text-align:center;border-top:1px solid var(--border)">
      🟢 Semana atual (7 dias) • ⚪ Semana anterior (7 dias)
    </div>
  </div>`;

  // ── Top Ofensores Semanal ──
  // Busca ofensores_YYYY-MM-DD.json dos últimos 7 dias (semana atual)
  const diasAtual = dias.slice(7, 14);
  const fetOf = diasAtual.map(async (d) => {
    const url = `/dados/ofensores_${d}.json?_t=${Date.now()}`;
    try {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) return null;
      return await r.json();
    } catch (_) { return null; }
  });
  const ofData = (await Promise.all(fetOf)).filter(Boolean);

  // Filtra Envios Extra (transportadora contendo "envios extra" ou "envios e")
  const isExtraTcp = (tcp) => {
    const t = (tcp||'').toLowerCase();
    return t.includes('envios extra') || t.includes('envios e');
  };

  // Helper: agrega snapshots em ranking de motoristas
  // categoria: 'falhas', 'stem' ou 'orh'
  // limiar: valor mínimo do campo (em min) pra contar
  // ordem: 'desc' (maior primeiro, padrão) ou 'asc' (menor primeiro)
  // origemFiltro: '' (todas), 'EBA32', 'EES2', 'SD', '__SC__', etc.
  function agregarOfensores(categoria, limiar, ordem, origemFiltro) {
    const campoFonte = categoria === 'stem' ? 'top_stem'
                     : categoria === 'orh'  ? 'top_orh'
                     : 'top_falhas';
    const campoValor = categoria === 'stem' ? 'stem_out'
                     : categoria === 'orh'  ? 'orh_minutos'
                     : 'falhas';
    const lim = limiar != null ? limiar : 0;
    const ogF = (origemFiltro || '').trim();
    const acum = {};
    ofData.forEach(snap => {
      (snap[campoFonte] || []).forEach(r => {
        if (isExtraTcp(r.transportadora)) return;
        const v = r[campoValor] || 0;
        if (v < lim) return; // aplica threshold
        // Aplica filtro de origem (se houver)
        if (ogF) {
          const rOg = (r.origem || '').trim();
          if (ogF === '__SC__') {
            if (rOg) return; // SC = sem origem (direto SES3)
          } else if (rOg !== ogF) {
            return;
          }
        }
        const k = r.motorista_id || r.motorista || '?';
        if (!acum[k]) acum[k] = {
          motorista: r.motorista || '?',
          transportadora: r.transportadora || '',
          dias: new Set(),
          total: 0,
          max: 0,
          rotas: new Set(),
          origens: {},  // {EBA32: 3, EES2: 1, ...}  contagem por XPT
        };
        acum[k].dias.add(snap.data);
        acum[k].total += v;
        acum[k].max = Math.max(acum[k].max, v);
        acum[k].rotas.add(r.rota || r.id_rota || '');
        // Captura origem (XPT/NEx/SD ou vazio = SC direto)
        let og = (r.origem || '').trim() || 'SES3';
        acum[k].origens[og] = (acum[k].origens[og] || 0) + 1;
      });
    });
    return Object.values(acum)
      .map(m => ({
        motorista: m.motorista,
        transportadora: m.transportadora,
        dias: m.dias.size,
        total: m.total,
        media: m.dias.size > 0 ? (m.total / m.dias.size) : 0,
        max: m.max,
        rotas: m.rotas.size,
        origens: m.origens,  // {EBA32: 3, EES2: 1, ...}
      }))
      .filter(m => m.total > 0)
      .sort((a, b) => (ordem === 'asc') ? (a.total - b.total) : (b.total - a.total))
      .slice(0, 30);
  }

  // Helper que renderiza badges de origens (XPT/NEx/SD/SC)
  function origemBadges(origens) {
    if (!origens) return '—';
    // Cores por origem
    const cores = {
      EBA32:    '#9d7ef5', EES2: '#22d3a0', EES3: '#f5883b', EES6: '#f25757',
      BRNES124: '#06b6d4', BRNES73: '#8b5cf6', BRNES464: '#ef4444', BRDES73: '#8b5cf6', BRDES6818: '#10b981',
      SD:       '#a78bfa', SES3: '#94a3b8',
    };
    // Ordena por count desc
    const entries = Object.entries(origens).sort((a,b) => b[1] - a[1]);
    return entries.map(([og, n]) => {
      const cor = cores[og] || '#64748b';
      const label = og === 'SES3' ? 'SC' : og;
      return `<span style="background:${cor}22;color:${cor};border:1px solid ${cor}55;font-weight:700;font-size:10px;padding:2px 6px;border-radius:5px;margin:1px;display:inline-block">${label}${n>1?'·'+n:''}</span>`;
    }).join(' ');
  }

  // Lê thresholds, ordens e filtro de origem do localStorage
  const stemThr      = parseInt(localStorage.getItem('semanal_stem_thr') || '180', 10);
  const orhThr       = parseInt(localStorage.getItem('semanal_orh_thr')  || '540', 10);
  const falhasOrdem  = localStorage.getItem('semanal_falhas_ordem') || 'desc';
  const stemOrdem    = localStorage.getItem('semanal_stem_ordem')   || 'desc';
  const orhOrdem     = localStorage.getItem('semanal_orh_ordem')    || 'desc';
  const ogFiltro     = localStorage.getItem('semanal_origem')       || '';
  const topFalhas = agregarOfensores('falhas', 0,       falhasOrdem, ogFiltro);
  const topStem   = agregarOfensores('stem',   stemThr, stemOrdem,   ogFiltro);
  const topOrh    = agregarOfensores('orh',    orhThr,  orhOrdem,    ogFiltro);
  window._semOfData = ofData;  // pra função de exportar acessar

  // Guarda as listas completas no window pra a busca filtrar sem recalcular
  window._semanalOfensores = {
    falhas: topFalhas,
    stem:   topStem,
    orh:    topOrh,
  };

  // Barra de busca + filtro de origem + exportar
  html += `<div style="margin-top:24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;flex:1;min-width:240px">
      <span style="font-size:14px">🔍</span>
      <input id="semanal-busca" type="text"
        placeholder="Buscar motorista nas tabelas abaixo..."
        oninput="_filtrarSemanal(this.value)"
        style="flex:1;background:transparent;border:none;color:var(--text);font-size:14px;outline:none;font-weight:500">
      <button onclick="document.getElementById('semanal-busca').value=''; _filtrarSemanal('')"
        style="background:transparent;color:var(--text3);border:none;cursor:pointer;font-size:11px;padding:4px 8px;border-radius:4px">Limpar</button>
    </div>
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px">
      <span style="font-size:11px;color:var(--text3);font-weight:600">Origem:</span>
      <select id="semanal-origem-filtro" onchange="_semanalUpdateOrigem(this.value)"
        style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:12px;cursor:pointer;min-width:140px">
        <option value="" ${ogFiltro===''?'selected':''}>Todas</option>
        <optgroup label="XPT">
          <option value="EBA32"    ${ogFiltro==='EBA32'?'selected':''}>🟣 EBA32</option>
          <option value="EES2"     ${ogFiltro==='EES2'?'selected':''}>🟢 EES2</option>
          <option value="EES3"     ${ogFiltro==='EES3'?'selected':''}>🟠 EES3</option>
          <option value="EES6"     ${ogFiltro==='EES6'?'selected':''}>🔴 EES6</option>
        </optgroup>
        <optgroup label="NEx">
          <option value="BRNES124" ${ogFiltro==='BRNES124'?'selected':''}>🏪 BRNES124</option>
          <option value="BRNES73"  ${ogFiltro==='BRNES73'?'selected':''}>🏪 BRNES73</option>
          <option value="BRNES464" ${ogFiltro==='BRNES464'?'selected':''}>🏪 BRNES464</option>
          <option value="BRDES73"  ${ogFiltro==='BRDES73'?'selected':''}>🏪 BRDES73</option>
          <option value="BRDES6818" ${ogFiltro==='BRDES6818'?'selected':''}>🏪 BRDES6818</option>
        </optgroup>
        <optgroup label="Outros">
          <option value="__SC__" ${ogFiltro==='__SC__'?'selected':''}>🏭 SC (direto SES3)</option>
          <option value="SD"     ${ogFiltro==='SD'?'selected':''}>🔀 SD</option>
        </optgroup>
      </select>
    </div>
    <span id="semanal-busca-count" style="font-size:12px;color:var(--text3);font-weight:500"></span>
    <button onclick="_exportarSemanalCSV()"
      style="background:#16a34a;color:#fff;border:1px solid #15803d;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px">
      📥 Exportar CSV
    </button>

      style="background:#1e40af;color:#fff;border:1px solid #1e3a8a;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px">
      📥 JSON
    </button>
  </div>`;

  // Helpers de formatação
  const fmtMin = (m) => {
    if (!m) return '—';
    const h = Math.floor(m/60), min = m%60;
    return h > 0 ? `${h}h${String(min).padStart(2,'0')}` : `${min}min`;
  };
  const fmtH = (m) => (m/60).toFixed(1) + 'h';

  // Helper genérico que renderiza uma tabela de ofensores
  function renderTabela(titulo, cor, dados, valLabel, valFmt, mediaFmt) {
    let h = `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:20px">

      h += `<div style="padding:30px;text-align:center;color:var(--text3)">Sem dados de ofensores ainda. O bot precisa rodar pra gerar <code>ofensores_YYYY-MM-DD.json</code>.</div>`;
    } else if (!dados.length) {
      h += `<div style="padding:30px;text-align:center;color:var(--green)">✅ Sem ofensores nessa categoria.</div>`;
    } else {
      h += `<table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead style="background:${cor.head};color:#fff">
          <tr>
            <th style="padding:8px;border:1px solid ${cor.border}">#</th>

            <th style="padding:8px;border:1px solid ${cor.border};text-align:left">Transportadora</th>
            <th style="padding:8px;border:1px solid ${cor.border};text-align:center">Origem (XPT)</th>
            <th style="padding:8px;border:1px solid ${cor.border};text-align:center">Dias</th>
            <th style="padding:8px;border:1px solid ${cor.border};text-align:center">Rotas</th>
            <th style="padding:8px;border:1px solid ${cor.border};text-align:center">${valLabel} total</th>
            <th style="padding:8px;border:1px solid ${cor.border};text-align:center">Média por dia</th>
          </tr>
        </thead><tbody>`;
      dados.forEach((m, i) => {
        const bg = i%2 ? 'background:var(--bg3)' : '';
        const ranking = i+1;
        const medalha = ranking === 1 ? '🥇' : ranking === 2 ? '🥈' : ranking === 3 ? '🥉' : ranking;
        h += `<tr style="${bg}">
          <td style="padding:8px;border:1px solid var(--border);text-align:center;font-weight:700;font-size:14px">${medalha}</td>
          <td style="padding:8px;border:1px solid var(--border);font-weight:700;color:var(--text)">${m.motorista}</td>
          <td style="padding:8px;border:1px solid var(--border);color:var(--text2);font-size:11px">${m.transportadora}</td>
          <td style="padding:6px 8px;border:1px solid var(--border);text-align:center">${origemBadges(m.origens)}</td>
          <td style="padding:8px;border:1px solid var(--border);text-align:center;color:var(--yellow)">${m.dias}</td>
          <td style="padding:8px;border:1px solid var(--border);text-align:center;color:var(--blue)">${m.rotas}</td>
          <td style="padding:8px;border:1px solid var(--border);text-align:center;color:${cor.val};font-weight:800;font-size:14px">${valFmt(m.total)}</td>
          <td style="padding:8px;border:1px solid var(--border);text-align:center;color:var(--text);font-weight:600">${mediaFmt(m.media)}</td>

      });
      h += `</tbody></table>
        <div style="padding:10px;background:var(--bg3);font-size:11px;color:var(--text3);text-align:center;border-top:1px solid var(--border)">
          Agregado dos últimos 7 dias • Envios Extra excluídos • Top 15
        </div>`;
    }
    h += `</div>`;
    return h;
  }

  // Dropdown de ordem (compartilhado pelas 3 tabelas)
  const ddOrdem = (id, atual) => `<select id="${id}" onchange="_semanalUpdateOrdem('${id}', this.value)"
      style="background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:4px 8px;border-radius:5px;font-size:11px;cursor:pointer">
      <option value="desc" ${atual==='desc'?'selected':''}>⬇ Maior primeiro</option>
      <option value="asc"  ${atual==='asc'?'selected':''}>⬆ Menor primeiro</option>
    </select>`;

  // Dropdowns de threshold pra Stem e ORH (com options padrão)
  const stemOpts = [
    { v: 0,   l: '0 min (todas)' },
    { v: 10,  l: '10 min' },
    { v: 20,  l: '20 min' },
    { v: 35,  l: '35 min' },
    { v: 60,  l: '1h' },
    { v: 90,  l: '1h30' },
    { v: 120, l: '2h' },
    { v: 180, l: '3h (padrão)' },
    { v: 240, l: '4h' },
    { v: 360, l: '6h' },
  ];
  const orhOpts = [
    { v: 60,  l: '1h' },
    { v: 180, l: '3h' },
    { v: 300, l: '5h' },
    { v: 420, l: '7h' },
    { v: 540, l: '9h (padrão)' },

  const ddTpl = (id, opts, atual) => {
    return `<select id="${id}" onchange="_semanalUpdateThr('${id}', this.value)"

    </select>`;
  };

  // 3 tabelas: Falhas, Stem Out, ORH (com dropdowns de threshold e ordem)
  const fmtThr = (m) => m < 60 ? `${m} min` : (m % 60 === 0 ? `${m/60}h` : `${Math.floor(m/60)}h${String(m%60).padStart(2,'0')}`);
  html += renderTabela(
    `🏆 TOP OFENSORES — Motoristas com mais Falhas ${ddOrdem('semanal-falhas-ordem', falhasOrdem)}`,
    { bg: '#7c2d12', head: '#dc2626', border: '#991b1b', val: 'var(--red)' },
    topFalhas,
    'Falhas',
    (v) => v.toString(),
    (v) => v.toFixed(1)
  );
  html += renderTabela(
    `⏱ TOP OFENSORES — Stem Out (≥ ${fmtThr(stemThr)}) ${ddTpl('semanal-stem-thr', stemOpts, stemThr)} ${ddOrdem('semanal-stem-ordem', stemOrdem)}`,
    { bg: '#78350f', head: '#d97706', border: '#92400e', val: 'var(--yellow)' },
    topStem,
    'Stem Out',
    (v) => fmtMin(v),
    (v) => fmtMin(Math.round(v))
  );
  html += renderTabela(
    `🕓 TOP OFENSORES — ORH Alto (≥ ${fmtThr(orhThr)}) ${ddTpl('semanal-orh-thr', orhOpts, orhThr)} ${ddOrdem('semanal-orh-ordem', orhOrdem)}`,
    { bg: '#1e3a8a', head: '#2563eb', border: '#1d4ed8', val: 'var(--blue)' },
    topOrh,
    'ORH',
    (v) => fmtH(v),
    (v) => fmtH(v)
  );

  _semanalCache = html;
  el.innerHTML = html;
}

function renderReporteTab(data) {
  const raw = window._rawDados || {};
  const el = document.getElementById('rep-content');
  if (!el) return;
  _syncRepSubTabButtons(_repSubTab);

  const dsColor = (ds) => ds>=95?'var(--green)':ds>=85?'var(--yellow)':'var(--red)';
  const dash = '<span style="color:var(--text3)">—</span>';
  const fmtN = n => (n||0).toLocaleString('pt-BR');

  function tabela(linhas, titulo, primeiraColLabel) {

              <th style="padding:10px;text-align:right;border-bottom:1px solid var(--border)">%DS</th>
            </tr>
          </thead>
          <tbody>${linhas.map((l,i) => {
            const bg = i%2?'background:rgba(255,255,255,.015)':'';
            const ds = l.ds!=null?l.ds:(l.delivery_success||0);
            return `<tr style="${bg}">
              <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700">${l[primeiraColLabel.toLowerCase().replace(' ','_')] || l.transportadora || l.nome || l.codigo || '?'}</td>
              <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right">${fmtN(l.rotas||l.qtd_rotas)}</td>
              <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right">${fmtN(l.pacotes||l.expedidos)}</td>
              <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:var(--green)">${fmtN(l.entregues)}</td>
              <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:${(l.falhas||l.insucessos||0)>0?'var(--red)':'var(--text3)'}">${(l.falhas||l.insucessos||0)>0?(l.falhas||l.insucessos):dash}</td>
              <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:${(l.pendentes||0)>0?'var(--yellow)':'var(--text3)'}">${(l.pendentes||0)>0?fmtN(l.pendentes):dash}</td>
              <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:${dsColor(ds)};font-weight:700">${(ds||0).toFixed(1)}%</td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>
    </div>`;
  }

  function totaisCard(obj, label) {
    if (!obj) return '';
    const ds = obj.delivery_success || 0;
    return `<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px">
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase">Total Rotas</div>
        <div style="font-size:22px;font-weight:800;color:var(--text);margin-top:4px">${fmtN(obj.total_rotas||obj.linhas?.length)}</div>
      </div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase">Pacotes</div>
        <div style="font-size:22px;font-weight:800;color:var(--blue);margin-top:4px">${fmtN(obj.total_pacotes)}</div>
      </div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase">Entregues</div>
        <div style="font-size:22px;font-weight:800;color:var(--green);margin-top:4px">${fmtN(obj.total_entregues)}</div>
      </div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase">Falhas</div>
        <div style="font-size:22px;font-weight:800;color:${(obj.total_falhas||0)>0?'var(--red)':'var(--text)'};margin-top:4px">${fmtN(obj.total_falhas)}</div>
      </div>
      <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-size:11px;color:var(--text3);text-transform:uppercase">% DS</div>
        <div style="font-size:22px;font-weight:800;color:${dsColor(ds)};margin-top:4px">${ds.toFixed(1)}%</div>
      </div>
    </div>`;
  }

  // ─── Renderiza TUDO unificado — APENAS cards "Performance" donut ─
  let html = '';

  // Helper que gera 1 card no estilo PERFORMANCE
  let _cardId = 0;
  const _donutIds = []; // [{id, ds, ins}]
  function perfCard(titulo, exp, ent, dsPct, fal, rotas) {
    const ins = Math.max(0, 100 - dsPct);
    const cId = 'perf-card-donut-' + (_cardId++);
    _donutIds.push({ id: cId, ds: dsPct, ins });
    return `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
      <div style="background:#1e3a8a;color:#fff;text-align:center;padding:14px;font-weight:800;letter-spacing:.05em;font-size:18px">PERFORMANCE ${titulo}</div>
      <table style="width:100%;border-collapse:collapse;font-size:15px">
        <thead style="background:#1e40af;color:#fff">
          <tr>
            <th style="padding:12px 8px;text-align:center;border:1px solid #1e3a8a;font-weight:700;font-size:13px">Total Rotas</th>
            <th style="padding:12px 8px;text-align:center;border:1px solid #1e3a8a;font-weight:700;font-size:13px">Pctes Expedidos</th>
            <th style="padding:12px 8px;text-align:center;border:1px solid #1e3a8a;font-weight:700;font-size:13px">Pctes Entregues</th>
            <th style="padding:12px 8px;text-align:center;border:1px solid #1e3a8a;font-weight:700;font-size:13px">Delivery Success</th>
            <th style="padding:12px 8px;text-align:center;border:1px solid #1e3a8a;font-weight:700;font-size:13px">Insucessos</th>
          </tr>
        </thead>
        <tbody>
          <tr style="background:var(--bg3)">
            <td style="padding:14px;text-align:center;border:1px solid var(--border);font-weight:800;font-size:20px;color:var(--accent)">${rotas != null ? fmtN(rotas) : '—'}</td>
            <td style="padding:14px;text-align:center;border:1px solid var(--border);font-weight:800;font-size:20px;color:var(--text)">${fmtN(exp)}</td>
            <td style="padding:14px;text-align:center;border:1px solid var(--border);font-weight:800;font-size:20px;color:var(--green)">${fmtN(ent)}</td>
            <td style="padding:14px;text-align:center;border:1px solid var(--border);font-weight:800;font-size:20px;color:${dsColor(dsPct)}">${dsPct.toFixed(2)}%</td>
            <td style="padding:14px;text-align:center;border:1px solid var(--border);font-weight:800;font-size:20px;color:var(--red)">${fal}</td>
          </tr>
        </tbody>
      </table>
      <div style="padding:18px 14px;text-align:center;background:var(--bg2)">
        <div style="font-weight:800;letter-spacing:.05em;color:var(--text);margin-bottom:12px;font-size:17px">${titulo}</div>
        <div style="display:flex;justify-content:center;align-items:center;gap:28px">
          <div style="text-align:left">
            <div style="color:var(--text3);font-size:13px">Insucesso</div>
            <div style="font-weight:800;font-size:24px;color:var(--text)">${ins.toFixed(1).replace('.',',')}%</div>
          </div>
          <div style="width:140px;height:140px;position:relative">
            <canvas id="${cId}" width="140" height="140"></canvas>
          </div>
          <div style="text-align:right">
            <div style="color:var(--text3);font-size:13px">DS</div>
            <div style="font-weight:800;font-size:24px;color:var(--text)">${dsPct.toFixed(1).replace('.',',')}%</div>
          </div>
        </div>
      </div>
    </div>`;
  }

  function sectionHeader(titulo) {
    return `<div style="font-weight:800;font-size:14px;color:var(--text);margin:18px 0 10px;display:flex;align-items:center;gap:8px">${titulo}</div>`;
  }

  function gridCards(cards) {
    return '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:14px">' + cards.join('') + '</div>';
  }

  function buildKanguReportForStation() {
    const station = raw.service_center || raw._station_filter || _currentStation || 'SES3';
    const allowed = KANGU_ORIGENS[station] || new Set();
    const rows = [];
    const seen = new Set();
    const addRoute = (r, forcedOrigin) => {
      if (!r || r.e_de_amanha) return;
      const origem = _normalizeOrigemId(forcedOrigin || r.origem || r.xpt || r._nex_id);
      if (!allowed.has(origem)) return;
      const key = `${origem}|${_d1RouteKey(r)}`;
      if (seen.has(key)) return;
      seen.add(key);
      rows.push({ ...r, origem, xpt: origem, station });
    };
    (Array.isArray(raw.todas_dia) ? raw.todas_dia : []).forEach(r => addRoute(r));
    Object.entries(raw.xpts_expedicao || {}).forEach(([xid, xdata]) => {
      const origem = _normalizeOrigemId(xid);
      if (!allowed.has(origem)) return;
      (xdata.todas || []).forEach(r => addRoute(r, origem));
    });
    const grouped = {};
    rows
      .filter(r => _routeMatchesStation(r, station))
      .forEach(r => {
        const origem = _normalizeOrigemId(r.origem || r.xpt || r._nex_id);
        if (!grouped[origem]) grouped[origem] = { transportadora: _origemLabel(origem) || origem, origem, rotas: 0, pacotes: 0, entregues: 0, falhas: 0, pendentes: 0, ds: 0 };
        const slot = grouped[origem];
        const pac = Number(r.pacotes ?? r.total ?? ((r.entregues || 0) + (r.falhas || 0) + (r.pendentes || 0))) || 0;
        slot.rotas += 1;
        slot.pacotes += pac;
        slot.entregues += Number(r.entregues || 0);
        slot.falhas += Number(r.falhas || 0);
        slot.pendentes += Number(r.pendentes || 0);
      });
    const linhas = Object.values(grouped)
      .map(l => ({ ...l, ds: l.pacotes > 0 ? (l.entregues / l.pacotes * 100) : 0 }))
      .sort((a, b) => b.rotas - a.rotas || String(a.transportadora).localeCompare(String(b.transportadora)));
    if (!linhas.length) return null;
    const totalPacotes = linhas.reduce((s, l) => s + l.pacotes, 0);
    const totalEntregues = linhas.reduce((s, l) => s + l.entregues, 0);
    return {
      linhas,
      total_pacotes: totalPacotes,
      total_entregues: totalEntregues,
      total_falhas: linhas.reduce((s, l) => s + l.falhas, 0),
      total_rotas: linhas.reduce((s, l) => s + l.rotas, 0),
      delivery_success: totalPacotes > 0 ? (totalEntregues / totalPacotes * 100) : 0,
    };
  }

  // ── XPT ──
  const stationReporte = raw.service_center || raw._station_filter || _currentStation || 'SES3';
  const xptsReportePermitidos = new Set(_xptsForStation(stationReporte).map(_normalizeOrigemId));
  const rep = (raw.reporte || []).filter(x => {
    const xid = _normalizeOrigemId(x.codigo || x.xpt || x.origem || x.id);
    return xptsReportePermitidos.has(xid);
  });
  if (_repSubTab === 'xpt' && rep.length) {
    html += sectionHeader('📊 PERFORMANCE POR XPT');
    const cards = rep.map(x => perfCard(
      x.codigo, x.expedidos, x.entregues, x.delivery_success||0, x.insucessos||0,
      x.rotas || x.total_rotas || x.qtd_rotas || null
    ));
    html += gridCards(cards);
  }

  // ── SVC ── (tabela compacta + UM donut agregado)
  // Aparece na aba XPT (junto) e na aba SC (sozinho)
  // Usa reporte_svc PRIMEIRO (que inclui TODAS as rotas — SC direto + SD +
  // qualquer origem — igual ao filtro "SC" da admin que inclui SD).
  // reporte_sc filtraria só SC-direto sem SD — não bate com admin.
  const sc = raw.reporte_svc || raw.reporte_sc || null;
  if ((_repSubTab === 'sc' || _repSubTab === 'xpt') && sc && sc.linhas && sc.linhas.length) {
    html += sectionHeader('🏢 PERFORMANCE MLPS DO SVC');

    // ── Recomputa do todas_dia agrupando por transportadora,
    //    pra incluir TODAS as rotas de cada MLP (direto + SD + NEx + etc),
    //    igual a admin mostra quando filtra por transportadora. ──
    const _svcN = (v) => Number(v || 0);
    const _svcTotal = (l) => _svcN(l.pacotes) + _svcN(l.sacas);
    const _svcSucesso = (l) => {
      const total = _svcTotal(l);
      const ent = _svcN(l.entregues);
      const fal = _svcN(l.falhas);
      const pen = _svcN(l.pendentes);
      const derivado = Math.max(0, total - fal - pen);
      const tolerancia = Math.max(2, Math.round(total * 0.01));
      if (ent > 0 && Math.abs((ent + fal + pen) - total) <= tolerancia) return ent;
      return derivado;
    };
    let scLinhas = (sc.linhas || []).map(l => {
      const total = _svcTotal(l);
      const entregues = _svcSucesso(l);
      return {...l, entregues, ds: total > 0 ? entregues / total * 100 : (l.ds || 0)};
    });
    let scTotalRotas = scLinhas.reduce((s,l)=>s+(l.rotas||l.qtd_rotas||l.total_rotas||0),0);
    let scTotalPacotes = scLinhas.reduce((s,l)=>s+_svcN(l.pacotes),0);
    let scTotalSacas = scLinhas.reduce((s,l)=>s+_svcN(l.sacas),0);

    const fechTextoAttr = fechTexto.replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/\n/g, '&#10;');

    // Layout 2 colunas: tabela SVC à esquerda, fechamento à direita
    html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;max-width:1080px;margin:0 auto">`;

    html += `<div style="display:grid;grid-template-columns:1fr;gap:0;background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
      <!-- Tabela compacta -->
      <div style="background:#1e3a8a;color:#fff;text-align:center;padding:8px;font-weight:800;letter-spacing:.05em;border:1px solid #1e3a8a">PERFORMANCE MLPs do SVC</div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">

        </tbody>
      </table>
      <!-- Donut agregado embaixo -->
      <div style="padding:18px 14px;background:var(--bg2);text-align:center">

    // ── Cards "Fechamento da Operação" + "Reporte de Panela" empilhados ──
    // ── Card de panela: Noshow = rotas REALMENTE No XPT (driver nao apareceu).
    //
    // BUG anterior: filtrava `_todasDiaPanela` por `r.status === 'no_xpt'`. Mas o

    const _todasDiaPanela = (_rawF.todas_dia || _rawF.top_geral || []).filter(r => !r.e_de_amanha);
    const _noShow = Object.values(_rawF.xpts || {})
      .reduce((sum, xpt) => sum + ((xpt && xpt.no_xpt) || []).length, 0);
    const ffP = (_rawF.frotas_fixas) || {};
    const utilFF = (ffP.pct_uso || 0).toFixed(1).replace('.',',');
    const shareEx = (_rawF.share_extra_pct != null ? _rawF.share_extra_pct

                      const todasDia = (_rawF.todas_dia||_rawF.top_geral||[]).filter(r => !r.e_de_amanha);
                      const tot = todasDia.length;

    const _ok = (cond) => cond ? '✅' : '❌';

    // Layout coluna direita: 2 cards empilhados
    html += `<div style="display:flex;flex-direction:column;gap:14px">

            <span>%</span>

    // Fecha o grid 2 colunas (SVC + cards à direita)
    html += `</div>`;

    // Atualiza o ícone ao lado do input de OOT Onda em tempo real

          ta.value = txt; ta.style.position='fixed'; ta.style.left='-9999px';

          navigator.clipboard.writeText(txt).then(after).catch(() => { fallback(); after(); });

          fallback(); after();

  }

  // ── NEx ── (modelo compacto: tabela única + donut agregado por NEx)
  // Exclui linhas Envios Extra (vão pra aba 'extra')
  const nexes = raw.reporte_nex || [];
  function isExtraTcp(tcp) {
    const t = (tcp||'').toLowerCase();
    return t.includes('envios extra') || t.includes('envios e');
  }

  function buildEnviosExtraRows() {
    const rows = [];
    const seen = new Set();
    const station = raw.service_center || raw._station_filter || _currentStation || 'SES3';
    const allowedOrigins = new Set([
      ..._xptsForStation(station).map(_normalizeOrigemId),
      ...Object.entries(NEX_CONFIG || {})
        .filter(([, cfg]) => cfg && cfg.station === station)
        .map(([nid]) => _normalizeOrigemId(nid)),
    ]);
    const addExtraRoute = (r, forcedOrigin) => {
      if (!r) return;
      const origem = _normalizeOrigemId(forcedOrigin || r.origem || r.xpt || r._nex_id);
      if (origem && allowedOrigins.size && !allowedOrigins.has(origem)) return;
      const rr = { ...r, origem: origem || r.origem || 'SVC', xpt: origem || r.xpt, station };
      if (rr.tipo_entrega !== 'me_extra' && !isExtraTcp(rr.transportadora)) return;
      const key = `${origem || 'SVC'}|${_d1RouteKey(rr)}`;
      if (seen.has(key)) return;
      seen.add(key);
      rows.push(rr);
    };
    const source = Array.isArray(raw.todas_dia) ? raw.todas_dia : [];
    source.forEach(r => addExtraRoute(r));

    Object.entries(raw.xpts_expedicao || {}).forEach(([xid, xdata]) => {
      const origem = _normalizeOrigemId(xid);
      if (!allowedOrigins.has(origem)) return;
      (xdata.extras || []).forEach(r => addExtraRoute(r, origem));
      // Alguns NEx podem vir sem bucket `extras`, mas com a rota marcada na lista completa.
      (xdata.todas || []).forEach(r => addExtraRoute(r, origem));
    });

    const byOrigin = {};
    rows.forEach(r => {
      const origem = _normalizeOrigemId(r.origem) || _normalizeOrigemId(r.xpt) || 'SVC';
      if (!byOrigin[origem]) {
        byOrigin[origem] = {
          nex: origem,
          nex_nome: _origemLabel(origem).replace(new RegExp('^' + origem + '\\s*-\\s*'), ''),
          rotas: 0,
          pacotes: 0,
          entregues: 0,
          falhas: 0,
          pendentes: 0,
          ds: 0,
        };
      }
      const slot = byOrigin[origem];
      const pacotes = Number(r.pacotes ?? r.total ?? ((r.entregues || 0) + (r.falhas || 0) + (r.pendentes || 0))) || 0;
      slot.rotas += 1;
      slot.pacotes += pacotes;
      slot.entregues += Number(r.entregues || 0);
      slot.falhas += Number(r.falhas || 0);
      slot.pendentes += Number(r.pendentes || 0);
    });

    return Object.values(byOrigin)
      .map(l => ({ ...l, ds: l.pacotes > 0 ? (l.entregues / l.pacotes * 100) : 0 }))
      .sort((a, b) => b.rotas - a.rotas || String(a.nex).localeCompare(String(b.nex)));

  if (_repSubTab === 'nex' && nexes.length) {

      const linhasSemExtra = linhasAll.filter(l => !isExtraTcp(l.transportadora));

      html += `<div style="display:grid;grid-template-columns:1fr;gap:0;max-width:520px;margin:0 auto 18px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
        <div style="background:#1e3a8a;color:#fff;text-align:center;padding:8px;font-weight:800;letter-spacing:.05em;border:1px solid #1e3a8a">PERFORMANCE ${(n.nome||n.nex||'').toUpperCase()} (${n.nex||''})</div>
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead style="background:#1e40af;color:#fff">
            <tr>
              <th style="padding:8px 10px;text-align:left;border:1px solid #1e3a8a;font-weight:700">Transportadora</th>
              <th style="padding:8px 10px;text-align:center;border:1px solid #1e3a8a;font-weight:700">ROTAS</th>

function _nexPanelIds(station) {
  const st = station || _currentStation || 'SES3';
  return Object.entries(NEX_CONFIG || {})
    .filter(([, cfg]) => cfg && cfg.station === st)
    .map(([nid]) => _normalizeOrigemId(nid));
}

function _nexPanelRouteKey(r) {
  return String(r?.id_rota || r?.id || r?.shipment_id || r?.rota || r?.nome_rota || JSON.stringify([
    r?.origem, r?.xpt, r?.motorista, r?.total, r?.pacotes
  ]));
}

function _nexPanelPkg(r) {
  const clean = Number(r?.pacotes || 0);
  if (clean > 0) return clean;
  const total = Number(r?.total || r?.total_envios || 0);
  if (total > 0) return total;
  return Number(r?.entregues || 0) + Number(r?.falhas || 0) + Number(r?.pendentes || 0);
}

function _nexPanelFirstLabel(...values) {
  for (const value of values) {
    const text = String(value ?? '').trim();
    if (text && text !== '-') return text;
  }
  return '-';
}

function _nexPanelTcpModalLabel(r) {
  return _nexPanelFirstLabel(r?.modal, r?.tipo_veiculo, r?.veiculo, r?.transportadora);
}

function _nexPanelStatusRank(status) {
  return { a_caminho: 0, no_xpt: 1, em_curso: 2, concluida: 3 }[status] ?? 9;
}

function _nexPanelHasText(value) {
  const text = String(value ?? '').trim();
  return !!text && text !== '-' && text.toLowerCase() !== 'null' && text.toLowerCase() !== 'undefined';
}

function _nexPanelEffectiveStatus(r) {
  const status = r?.status || '';
  if (status !== 'em_curso') return status;

  const hasDriver = _nexPanelHasText(r?.motorista) && String(r.motorista).trim() !== '—';
  const hasFirstMove = _nexPanelHasText(r?.hora_primeiro_mov) || _nexPanelHasText(r?.primeiro_movimento);
  const hasDeliveries = Number(r?.entregues || 0) > 0;

  // NEX pode vir da API como em_curso mesmo sem motorista/movimento.
  // No Logistics isso aparece como "No NEX"; mantemos o painel alinhado.
  if (!hasDriver && !hasFirstMove && !hasDeliveries) return 'no_xpt';
  return status;
}

function nexStatusBadge(status) {
  if (status === 'no_xpt') return '<span class="badge badge-laranja">⏸ No NEX</span>';
  return statusBadge(status);
}

function _nexPanelRoutesFor(data, nid) {
  const unit = (data.nex || {})[nid] || {};
  const raw = window._rawDados || {};
  const todasDia = raw.todas_dia || raw.top_geral || [];
  const candidates = [
    ...(unit.todas || []),
    ...(unit.no_xpt || []),
    ...(unit.a_caminho || []),
    ...(unit.em_curso || []),
    ...(unit.concluidas || []),
    ...todasDia.filter(r => _normalizeOrigemId(r.origem || r.xpt) === nid),
  ];

  const seen = new Set();
  return candidates
    .map(r => {
      const fixed = { ...r, origem: _normalizeOrigemId(r.origem || r.xpt || nid), xpt: _normalizeOrigemId(r.xpt || r.origem || nid) };
      fixed._status_original = fixed.status;
      fixed.status = _nexPanelEffectiveStatus(fixed);
      return fixed;
    })
    .filter(r => !r.e_de_amanha)
    .filter(r => {
      const key = _nexPanelRouteKey(r);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    })
    .sort((a, b) => {
      const st = _nexPanelStatusRank(a.status) - _nexPanelStatusRank(b.status);
      if (st) return st;
      return String(a.rota || '').localeCompare(String(b.rota || ''), 'pt-BR', { numeric: true });
    });
}

function renderNexRowsHTML(rows) {
  if (!rows.length) {
    return '<tr><td colspan="11"><div class="empty"><div class="empty-icon">📦</div>Sem rotas NEX no momento.</div></td></tr>';
  }
  return rows.map(r => {
    const nid = r._nex_id || r.origem || r.xpt || '-';
    const tcpModal = _nexPanelTcpModalLabel(r);
    const orh = r.orh_min != null ? (typeof fmtMin === 'function' ? fmtMin(r.orh_min) : r.orh_min) : (r.orh || '-');
    const pct = parseFloat(String(r.progresso_pct || '0').replace(',', '.')) || 0;
    const pkg = _nexPanelPkg(r);
    return `<tr>
      <td><span class="badge badge-roxo" style="font-size:10px;">${nid}</span></td>
      <td>${typeof rotaIdLink === 'function' ? rotaIdLink(r) : (r.rota || r.nome_rota || '-')}</td>
      <td>${nexStatusBadge(r.status)}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${tcpModal}">${tcpModal}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.motorista || ''}">${r.motorista || '-'}</td>
      <td style="text-align:right;">${pkg.toLocaleString('pt-BR')}</td>
      <td style="text-align:right;color:var(--green);">${Number(r.entregues || 0).toLocaleString('pt-BR')}</td>
      <td style="text-align:right;color:${Number(r.falhas || 0) > 0 ? 'var(--red)' : 'var(--text3)'};">${Number(r.falhas || 0).toLocaleString('pt-BR')}</td>
      <td style="text-align:right;color:${Number(r.pendentes || 0) > 0 ? 'var(--yellow)' : 'var(--text3)'};">${Number(r.pendentes || 0).toLocaleString('pt-BR')}</td>
      <td class="time-val">${orh}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;min-width:90px;">
          <div class="progress-bar"><div class="progress-fill ${pct >= 60 ? 'high' : pct < 20 ? 'low' : ''}" style="width:${Math.min(pct,100)}%"></div></div>
          <span style="font-size:10px;color:var(--text2);">${r.progresso_pct || '0'}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function renderNexPanel(data) {
  const ids = _nexPanelIds();
  const stationLabel = _currentStation || 'SES3';
  const idsLabel = ids.join(', ');
  const summaries = ids.map(nid => {
    const cfg = NEX_CONFIG[nid] || { nome: nid };
    const rows = _nexPanelRoutesFor(data, nid);
    const a_caminho = rows.filter(r => r.status === 'a_caminho').length;
    const no_xpt = rows.filter(r => r.status === 'no_xpt').length;
    const em_curso = rows.filter(r => r.status === 'em_curso').length;
    const concluidas = rows.filter(r => r.status === 'concluida').length;
    const pacotes = rows.reduce((s, r) => s + _nexPanelPkg(r), 0);
    const entregues = rows.reduce((s, r) => s + Number(r.entregues || 0), 0);
    const falhas = rows.reduce((s, r) => s + Number(r.falhas || 0), 0);
    const pendentes = rows.reduce((s, r) => s + Number(r.pendentes || 0), 0);
    return { nid, cfg, rows, total: rows.length, a_caminho, no_xpt, em_curso, concluidas, pacotes, entregues, falhas, pendentes };
  });

  const allRows = summaries.flatMap(s => s.rows.map(r => ({ ...r, _nex_id: s.nid })));
  const totalRotas = summaries.reduce((s, n) => s + n.total, 0);
  const totalPacotes = summaries.reduce((s, n) => s + n.pacotes, 0);
  const totalFalhas = summaries.reduce((s, n) => s + n.falhas, 0);
  const totalPendentes = summaries.reduce((s, n) => s + n.pendentes, 0);

  const cards = summaries.map(s => `
    <div class="xpt-card${(s.no_xpt || s.a_caminho) ? ' alert-border' : ''}" style="padding:16px;cursor:default;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div>
          <div class="xpt-name">${s.cfg.emoji || '📦'} ${s.nid}${s.cfg.nome ? ' — ' + s.cfg.nome : ''}</div>
          <div class="xpt-meta"><strong style="color:#111827">${s.total}</strong> rotas hoje · ${s.pacotes.toLocaleString('pt-BR')} pacotes</div>
        </div>
      </div>
      <div class="xpt-stats">
        <div class="stat-item stat-azul"><div class="stat-val">${s.a_caminho}</div><div class="stat-lbl">A caminho</div></div>
        <div class="stat-item stat-laranja"><div class="stat-val">${s.no_xpt}</div><div class="stat-lbl">No NEX</div></div>
        <div class="stat-item stat-verde"><div class="stat-val">${s.em_curso}</div><div class="stat-lbl">Expedidas</div></div>
        <div class="stat-item stat-cinza"><div class="stat-val">${s.concluidas}</div><div class="stat-lbl">Concluidas</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;font-size:11px;color:var(--text2);">
        <div><strong style="color:var(--green)">${s.entregues.toLocaleString('pt-BR')}</strong><br>Entregues</div>
        <div><strong style="color:var(--red)">${s.falhas.toLocaleString('pt-BR')}</strong><br>Falhas</div>
        <div><strong style="color:var(--yellow)">${s.pendentes.toLocaleString('pt-BR')}</strong><br>Pendentes</div>
      </div>
    </div>
  `).join('');

  const rowHtml = renderNexRowsHTML(allRows);

  return `
    <div class="info-box">
      <strong>📦 NEX ${stationLabel}</strong> | ${idsLabel} | ${totalRotas} rotas | ${totalPacotes.toLocaleString('pt-BR')} pacotes | ${totalFalhas.toLocaleString('pt-BR')} falhas | ${totalPendentes.toLocaleString('pt-BR')} pendentes
    </div>
    <div style="display:grid;grid-template-columns:repeat(${Math.min(3, Math.max(1, ids.length))},minmax(0,1fr));gap:12px;margin-bottom:20px;">${cards}</div>
    <div class="section">

        <div class="section-title">Rotas NEX</div>
        <span class="count-pill" id="count-nex">${allRows.length} rotas</span>

        <input type="text" placeholder="Buscar rota, motorista, placa..." id="search-nex">
        <select id="unit-nex">
          <option value="">Todos os NEX</option>
        </select>
        <select id="status-nex">
          <option value="">Todos os status</option>
          <option value="a_caminho">A caminho</option>
          <option value="no_xpt">No NEX</option>
          <option value="em_curso">Expedidas</option>

              <th>Motorista</th>

              <th style="text-align:right;">Entregues</th>
              <th style="text-align:right;">Falhas</th>
              <th style="text-align:right;">Pendentes</th>
              <th>ORH</th>
              <th>Progresso</th>
            </tr></thead>
            <tbody id="tbody-nex">${rowHtml}</tbody>

        </div>

}

function attachNexFilters(data) {
  const tbody = document.getElementById('tbody-nex');
  if (!tbody) return;

  const allRows = _nexPanelIds()
    .flatMap(nid => _nexPanelRoutesFor(data, nid).map(r => ({ ...r, _nex_id: nid })));

  const searchEl = document.getElementById('search-nex');
  const unitEl = document.getElementById('unit-nex');
  const statusEl = document.getElementById('status-nex');
  const carrierEl = document.getElementById('carrier-nex');
  const countEl = document.getElementById('count-nex');

  const nexUnits = _nexPanelIds();
  if (unitEl) {
    const selected = _nexFilterState.nex || '';
    unitEl.innerHTML = '<option value="">Todos os NEX</option>' +
      nexUnits.map(nid => `<option value="${nid}">${nid}</option>`).join('');
    unitEl.value = nexUnits.includes(selected) ? selected : '';
    _nexFilterState.nex = unitEl.value;
  }

  const carriers = [...new Set(allRows.map(r => _nexPanelTcpModalLabel(r)).filter(v => v && v !== '-'))].sort();
  if (carrierEl) {
    const selected = _nexFilterState.carrier || '';
    carrierEl.innerHTML = '<option value="">Todos os modais</option>' +
      carriers.map(c => `<option value="${c}">${c}</option>`).join('');
    carrierEl.value = carriers.includes(selected) ? selected : '';
    _nexFilterState.carrier = carrierEl.value;
  }
  if (searchEl) searchEl.value = _nexFilterState.search || '';
  if (statusEl) statusEl.value = _nexFilterState.status || '';

  const render = () => {
    _nexFilterState.search = (searchEl?.value || '').toLowerCase();
    _nexFilterState.nex = unitEl?.value || '';
    _nexFilterState.status = statusEl?.value || '';
    _nexFilterState.carrier = carrierEl?.value || '';

    const rows = allRows.filter(r => {
      if (_nexFilterState.nex && r._nex_id !== _nexFilterState.nex) return false;
      if (_nexFilterState.status && r.status !== _nexFilterState.status) return false;
      if (_nexFilterState.carrier && _nexPanelTcpModalLabel(r) !== _nexFilterState.carrier) return false;
      if (_nexFilterState.search) {
        const haystack = [
          r._nex_id, r.rota, r.nome_rota, r.id, r.id_rota,
          r.motorista, r.placa, r.transportadora, r.veiculo, r.modal, r.tipo_veiculo, _nexPanelTcpModalLabel(r)
        ].join(' ').toLowerCase();
        if (!haystack.includes(_nexFilterState.search)) return false;
      }
      return true;
    });

    tbody.innerHTML = renderNexRowsHTML(rows);
    if (countEl) countEl.textContent = rows.length + ' rota' + (rows.length === 1 ? '' : 's');
  };

  [searchEl, unitEl, statusEl, carrierEl].forEach(el => {
    if (!el) return;
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });
  render();
}

function switchTab(xid) {
  activeTab = xid;
  _saveActiveTab(xid);
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.xpt-card').forEach(c => c.classList.remove('active'));
  const tab = document.getElementById('tab-' + xid);
  const panel = document.getElementById('panel-' + xid);
  const card = document.getElementById('card-' + xid);
  if (tab) tab.classList.add('active');
  if (panel) panel.classList.add('active');
  if (card) card.classList.add('active');
}

function renderXPTPanel(xid, xpt, cfg, extraidoEm) {
  const isNexPanel = !!NEX_CONFIG[_normalizeOrigemId(xid)];
  const no_xpt = xpt.no_xpt || [];
  const a_caminho = (xpt.a_caminho || []).filter(r => !r.e_de_amanha);
  const em_curso = xpt.em_curso || [];
  const concluidas = xpt.concluidas || [];
  const d1NoXptSource = Array.isArray(xpt.no_xpt_d1)
    ? xpt.no_xpt_d1
    : [...(xpt.amanha || []), ...(xpt.proximo || [])];
  const seenD1NoXpt = new Set();
  const d1NoXpt = cfg.tipo === 'D+1'
    ? d1NoXptSource.filter(r => {
        const key = String(r?.id || r?.id_rota || r?.rota || r?.nome_rota || JSON.stringify(r));
        if (seenD1NoXpt.has(key)) return false;
        seenD1NoXpt.add(key);
        return true;
      }).map(r => ({ ...r, status: 'no_xpt', _d1_no_xpt: true }))
    : [];
  const no_xpt_display = no_xpt.length;
  const no_xpt_label = isNexPanel ? 'No NEX' : 'No XPT';
  const carrier_filter_label = isNexPanel ? 'Todos os modais' : 'Todas as transportadoras';
  const total = xpt.total || 0;
  const baseTodas = (xpt.hoje || xpt.todas || []).filter(r => !r.e_de_amanha);
  const panelSeen = new Set(baseTodas.map(_d1RouteKey));
  const aCaminhoExtra = a_caminho.filter(r => {
    const key = _d1RouteKey(r);
    if (panelSeen.has(key)) return false;
    panelSeen.add(key);
    return true;
  });
  const todas = [...baseTodas, ...aCaminhoExtra];

  const entregues = todas.reduce((s, r) => s + (r.entregues || 0), 0);
  const pendentes = todas.reduce((s, r) => s + (r.pendentes || 0), 0);
  const totalPkgs = todas.reduce((s, r) => s + (r.total || 0), 0);
  const pctEntregues = totalPkgs > 0 ? Math.round(entregues / totalPkgs * 100) : 0;

  const infoBox = cfg.tipo === 'D+1'
    ? `<strong>Tipo:</strong> D+1 &nbsp;|&nbsp; <strong>LM início:</strong> ${cfg.horario_lm_inicio || '06:00'} &nbsp;|&nbsp; <strong>LM encerra:</strong> ${cfg.horario_lm_fim || '12:00'}${cfg.tem_extra ? ' &nbsp;|&nbsp; <strong>Extra carregamento:</strong> 10:00 (alerta: 10:30)' : ''}`
    : `<strong>Tipo:</strong> D0 &nbsp;|&nbsp; <strong>Saída carretas SVC:</strong> até ${cfg.horario_carreta_saida || '?'} &nbsp;|&nbsp; <strong>Chegada prevista:</strong> ${cfg.janela_chegada || '?'} &nbsp;|&nbsp; <strong>Expedição LM:</strong> ~${cfg.tempo_expedicao || 80}min após chegada`;

  const extraFarolSection = (xid === 'EBA32' && cfg.tem_extra)
    ? `<div class="section" style="margin-bottom:0;margin-top:20px;">
        <div class="section-header">
          <div class="section-title">⚡ Farol Envios Extra — EBA32 <span style="font-size:11px;font-weight:400;color:var(--text3);margin-left:8px;">Horário previsto: 10:00 | Alerta de atraso: 10:30</span></div>
        </div>
        <div class="section-body" id="farol-extra-body"></div>
      </div>`
    : '';

  return `
    <div class="info-box">${infoBox}</div>
    <div class="mini-stats">
      <div class="mini-stat">
        <div class="val" style="color:var(--text)">${total}</div>
        <div class="lbl">Total rotas</div>
      </div>
      <div class="mini-stat">
        <div class="val" style="color:var(--blue)">${a_caminho.length}</div>
        <div class="lbl">A caminho</div>
      </div>
      <div class="mini-stat">
        <div class="val" style="color:var(--orange)">${no_xpt_display}</div>
        <div class="lbl">${no_xpt_label}</div>
      </div>
      <div class="mini-stat">
        <div class="val" style="color:var(--green)">${em_curso.length}</div>
        <div class="lbl">Expedidas</div>
      </div>
      <div class="mini-stat">
        <div class="val" style="color:var(--text2)">${concluidas.length}</div>
        <div class="lbl">Concluídas</div>
      </div>
      <div class="mini-stat">
        <div class="val" style="color:var(--purple)">${totalPkgs.toLocaleString('pt-BR')}</div>
        <div class="lbl">Pacotes totais</div>
      </div>
      <div class="mini-stat">
        <div class="val" style="color:var(--green)">${entregues.toLocaleString('pt-BR')}</div>
        <div class="lbl">Entregues (${pctEntregues}%)</div>
      </div>
    </div>
    <div class="filter-bar" id="filter-${xid}">
      <input type="text" placeholder="Buscar rota, motorista, placa..." id="search-${xid}">
      <select id="status-${xid}">
        <option value="">Todos os status</option>
        <option value="a_caminho">A caminho</option>
        <option value="no_xpt">${no_xpt_label}</option>
        <option value="em_curso">Expedidas</option>
        <option value="concluida">Concluídas</option>

        <option value="">${carrier_filter_label}</option>

    <div class="tbl-wrap">
      <table id="table-${xid}">

          <th>Pacotes</th>
          <th>Progresso</th>

          <th>Alertas</th>
        </tr></thead>
        <tbody id="tbody-${xid}"></tbody>

    </div>
    ${extraFarolSection}

}

// ─── TABLE FILTERS & RENDER ──────────────────────────────────────
function attachTableFilters(xid, xpt) {
  const isNexPanel = !!NEX_CONFIG[_normalizeOrigemId(xid)];
  const cfg = XPT_CONFIG[xid] || {};
  const baseTodas = (xpt.hoje || xpt.todas || []).filter(r => !r.e_de_amanha);
  const seenRoutes = new Set(baseTodas.map(r => String(r?.id || r?.id_rota || r?.rota || r?.nome_rota || JSON.stringify(r))));
  const aCaminhoExtra = (xpt.a_caminho || []).filter(r => {
    if (r.e_de_amanha) return false;
    const key = String(r?.id || r?.id_rota || r?.rota || r?.nome_rota || JSON.stringify(r));
    if (seenRoutes.has(key)) return false;
    seenRoutes.add(key);
    return true;
  });
  const todas = [...baseTodas, ...aCaminhoExtra];

  // Populate carrier filter
  const carriers = [...new Set(todas.map(r => isNexPanel ? _nexPanelTcpModalLabel(r) : r.transportadora).filter(Boolean))].sort();
  const carrierSel = document.getElementById('carrier-' + xid);
  if (carrierSel) carriers.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    carrierSel.appendChild(opt);
  });

  const render = () => {
    const search = (document.getElementById('search-' + xid)?.value || '').toLowerCase();
    const status = document.getElementById('status-' + xid)?.value || '';
    const carrier = document.getElementById('carrier-' + xid)?.value || '';

    let rows = todas.filter(r => {
      if (status && r.status !== status) return false;
      if (carrier && (isNexPanel ? _nexPanelTcpModalLabel(r) : r.transportadora) !== carrier) return false;
      if (search) {
        const haystack = [r.rota, r.motorista, r.placa, r.transportadora, r.veiculo, r.modal, r.tipo_veiculo].join(' ').toLowerCase();
        if (!haystack.includes(search)) return false;
      }
      return true;
    });

    renderTable(xid, rows);
    const countEl = document.getElementById('count-' + xid);
    if (countEl) countEl.textContent = rows.length + ' rota' + (rows.length !== 1 ? 's' : '');
  };

  ['search-' + xid, 'status-' + xid, 'carrier-' + xid].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('input', render);
      el.addEventListener('change', render);
    }
  });

  render();
}

function statusBadge(status) {
  const map = {
    a_caminho: '<span class="badge badge-azul">🚚 A caminho</span>',
    no_xpt:    '<span class="badge badge-laranja">⏸ No XPT</span>',
    em_curso:  '<span class="badge badge-verde">▶ Expedida</span>',
    concluida: '<span class="badge badge-cinza">✅ Concluída</span>',
  };
  return map[status] || `<span class="badge badge-cinza">${status}</span>`;
}

function renderTable(xid, rows) {
  const tbody = document.getElementById('tbody-' + xid);
  if (!tbody) return;

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="11"><div class="empty"><div class="empty-icon">🔍</div>Nenhuma rota encontrada</div></td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => {
    const isNexRow = !!NEX_CONFIG[_normalizeOrigemId(r._nex_id || r.origem || r.xpt || xid)];

      r.alerta_comercial ? '<span title="Parada comercial pendente">🏪</span>' : '',

      <td class="motorista-name" style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.motorista}">${r.motorista || '—'}</td>
      <td><div style="font-size:11px;">${r.veiculo || '—'}</div><div style="font-size:10px;color:var(--text3);font-family:monospace;">${r.placa || ''}</div></td>
      <td class="time-val">${r.hora_inicio || '—'}</td>
      <td class="time-val ${r.hora_primeiro_mov === '-' && r.status === 'em_curso' ? 'time-warn' : ''}">${r.hora_primeiro_mov || '—'}</td>
      <td>
        <div style="font-size:11px;"><span style="color:var(--green)">${r.entregues}</span> / ${r.total}</div>
        <div style="font-size:10px;color:var(--red);">${r.falhas > 0 ? r.falhas + ' falha(s)' : ''}</div>
      </td>
      <td>
        <div style="display:flex;align-items:center;gap:6px;">

    </tr>`;
  }).join('');
}

    .then(r => r.json())
