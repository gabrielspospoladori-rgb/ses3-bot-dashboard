<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot 2.0 — Monitor de Expedições e Performance Automatizado — SVC SES3 Linhares</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root {
  /* Light theme inspirado em Mercado Libre — header amarelo MELI,
     fundo claro, cards brancos limpos. Paleta baseada no Cockpit
     de Reinjeção (#fff159 header, #f9fafb body, #ffffff cards). */
  --bg: #f9fafb; --bg2: #ffffff; --bg3: #f3f4f6;
  --border: #e5e7eb; --border2: #d1d5db;
  --text: #111827; --text2: #374151; --text3: #4b5563;
  --green: #16a34a; --green-bg: #f0fdf4; --green-border: #86efac;
  --yellow: #d97706; --yellow-bg: #fffbeb; --yellow-border: #fde68a;
  --red: #dc2626; --red-bg: #fef2f2; --red-border: #fecaca;
  --blue: #2563eb; --blue-bg: #eff6ff; --blue-border: #bfdbfe;
  --purple: #7c3aed; --purple-bg: #faf5ff; --purple-border: #ddd6fe;
  --orange: #ea580c; --orange-bg: #fff7ed; --orange-border: #fed7aa;
  --accent: #2563eb;
  /* Amarelo MELI oficial (header) */
  --meli-yellow: #fff159; --meli-yellow-dark: #e6d930;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 14px; min-height: 100vh; }

/* ── LOAD SCREEN ── */

.drop-zone { border: 2px dashed var(--accent); border-radius: 16px; padding: 60px 80px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--bg3); }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--blue-bg); }
.drop-zone h2 { font-size: 18px; color: var(--text); margin-bottom: 8px; }
.drop-zone p { color: var(--text2); font-size: 13px; }
.drop-icon { font-size: 48px; margin-bottom: 16px; }
.file-btn { display: inline-block; margin-top: 20px; background: var(--accent); color: #fff; padding: 10px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; border: none; transition: background 0.2s; }
.file-btn:hover { background: #4f46e5; }
#fileInput { display: none; }
.tip-text { font-size: 12px; color: var(--text3); text-align: center; max-width: 500px; line-height: 1.6; }

/* ── DASHBOARD ── */
#dashboard { display: block; }

/* Header MELI — amarelo no topo, texto preto */
.header { background: var(--meli-yellow); border-bottom: 1px solid var(--meli-yellow-dark); padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-left h1 { font-size: 18px; font-weight: 800; color: #111827; }
.header-left .subtitle { font-size: 12px; color: #4b5563; margin-top: 2px; }
.header-right { display: flex; align-items: center; gap: 12px; }
.ts-badge { background: #ffffff; border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px; font-size: 11px; color: var(--text2); transition: all 0.4s; }
.ts-badge.stale-warn  { background: var(--yellow-bg); border-color: var(--yellow-border); color: var(--yellow); }
.ts-badge.stale-danger { background: var(--red-bg); border-color: var(--red-border); color: var(--red); animation: pulse-badge 1.2s ease-in-out infinite; }
@keyframes pulse-badge { 0%,100%{opacity:1} 50%{opacity:.55} }
.reload-btn { background: #ffffff; border: 1px solid var(--border2); color: var(--text); padding: 7px 14px; border-radius: 7px; cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; }
.reload-btn:hover { background: var(--bg3); border-color: var(--accent); color: var(--accent); }

/* Alerts bar */
.alerts-bar { padding: 12px 24px; display: flex; flex-direction: column; gap: 8px; }
.alert-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 8px; font-size: 12px; font-weight: 500; }
.alert-red { background: var(--red-bg); border: 1px solid var(--red-border); color: #fca5a5; }
.alert-yellow { background: var(--yellow-bg); border: 1px solid var(--yellow-border); color: #fde68a; }
.alert-icon { font-size: 15px; }

/* Main layout */
.main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

/* XPT Cards */
.xpt-cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
.xpt-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 14px; padding: 24px; cursor: pointer; transition: all 0.2s; }
.xpt-card:hover { border-color: var(--accent); }
.xpt-card.active { border-color: var(--accent); background: var(--blue-bg); }
.xpt-card.alert-border { border-color: var(--red-border); }
.xpt-name { font-size: 17px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.xpt-meta { font-size: 12px; color: var(--text3); margin-bottom: 18px; }
.xpt-tipo { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; margin-left: 6px; }
.xpt-tipo.d0 { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
.xpt-tipo.dp1 { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }
.xpt-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat-item { text-align: center; background: var(--bg); border-radius: 10px; padding: 14px 6px; }
.stat-val { font-size: 32px; font-weight: 800; line-height: 1; color: #111827; }
.stat-lbl { font-size: 12px; color: var(--text2); margin-top: 5px; font-weight: 600; }
/* Painel XPT — TODOS os numeros em PRETO (single color). */
.stat-verde .stat-val,
.stat-azul .stat-val,
.stat-laranja .stat-val,
.stat-vermelho .stat-val,
.stat-roxo .stat-val,
.stat-cinza .stat-val { color: #111827 !important; }

/* Section */
.section { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; overflow: hidden; }
.section-header { padding: 16px 20px; background: var(--bg3); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.section-title { font-size: 14px; font-weight: 700; color: var(--text); display: flex; align-items: center; gap: 10px; }
.section-body { padding: 20px; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 4px; }
.tab { padding: 7px 16px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 500; color: var(--text2); transition: all 0.2s; }
.tab:hover { color: var(--text); background: var(--bg3); }
.tab.active { background: var(--accent); color: #fff; }
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* Status badges */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 600; white-space: nowrap; }
.badge-verde { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
.badge-azul { background: var(--blue-bg); color: var(--blue); border: 1px solid var(--blue-border); }
.badge-laranja { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-border); }
.badge-vermelho { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
.badge-roxo { background: var(--purple-bg); color: var(--purple); border: 1px solid var(--purple-border); }
.badge-cinza { background: var(--bg); color: var(--text3); border: 1px solid var(--border); }
.badge-amarelo { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-border); }

/* ── EXTRA TAB ── */
.extra-sub-header { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:11px; font-weight:700; color:var(--text2); text-transform:uppercase; letter-spacing:0.05em; }
.extra-sub-info { font-size:10px; font-weight:400; color:var(--text3); text-transform:none; letter-spacing:0; }
.alert-chip { display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600; }
.alert-chip-red { background:var(--red-bg);border:1px solid var(--red-border);color:var(--red); }
.alert-chip-yellow { background:var(--yellow-bg);border:1px solid var(--yellow-border);color:var(--yellow); }
.alert-chip-orange { background:var(--orange-bg);border:1px solid var(--orange-border);color:var(--orange); }

/* Tables — light theme MELI, alto contraste, fonte negrito grande.
   Usa !important defensivo pra sobrescrever estilos inline que vinham
   do dark theme (rgba whites que ficavam invisiveis no light). */
.tbl-wrap { overflow-x: auto; border-radius: 8px; border: 1px solid var(--border); background: #ffffff; }
table { width: 100%; border-collapse: collapse; font-size: 14px; background: #ffffff; }
table th { background: #f3f4f6 !important; color: #111827 !important; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px 14px; text-align: left; border-bottom: 2px solid #d1d5db; white-space: nowrap; }
table td { padding: 11px 14px; border-bottom: 1px solid #e5e7eb; color: #111827 !important; vertical-align: middle; font-weight: 600; font-size: 14px; background: #ffffff; }
table tr:last-child td { border-bottom: none; }
/* Zebra striping (cinza-claro, NUNCA invisivel). Defesa contra
   inline 'background:rgba(255,255,255,.015)' que ficava invisivel no light. */
table tbody tr:nth-child(even) td { background: #f3f4f6 !important; }
table tbody tr:nth-child(odd) td { background: #ffffff !important; }
/* Linhas alertadas — fundo claro avermelhado, texto vermelho escuro bold */
table tr.row-alert td, table tr.row-alerta td { background: #fee2e2 !important; color: #7f1d1d !important; }
table tr.row-warn td, table tr.row-atencao td { background: #fef3c7 !important; color: #78350f !important; }
table tr.row-ok td { background: #dcfce7 !important; color: #14532d !important; }
table tr:hover td { background: #dbeafe !important; }
.rota-id { font-weight: 800 !important; color: #111827 !important; font-size: 14px; }
.rota-id-num { font-size: 12px; color: #6b7280 !important; font-family: monospace; margin-left: 4px; font-weight: 600; }
a.rota-link { text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 3px; flex-wrap: wrap; }
a.rota-link:hover { text-decoration: underline; }
a.rota-link:hover .rota-id { color: var(--blue); }
a.rota-link:hover .rota-id-num { color: #4b5563; }
a.rota-link .rota-link-icon { font-size: 10px; opacity: 0.5; }
a.rota-link:hover .rota-link-icon { opacity: 1; }
.rota-copy-btn { display:inline-flex; align-items:center; justify-content:center;
  background:transparent; border:1px solid transparent; color:#94a3b8; cursor:pointer;
  padding:1px 4px; margin-left:4px; border-radius:4px; font-size:11px; transition:all .15s;
  vertical-align:middle; }
.rota-copy-btn:hover { background:#1e40af33; border-color:#1e40af66; color:#60a5fa; }
.rota-copy-btn.copied { background:#16a34a33; border-color:#16a34a; color:#22c55e; }
.encerrar-btn { display:inline-flex; align-items:center; gap:3px;
  background:#16a34a; color:#fff !important; text-decoration:none; cursor:pointer;
  padding:3px 9px; margin-left:6px; border-radius:5px; font-size:10px; font-weight:700;
  border:1px solid #15803d; transition:all .15s; vertical-align:middle; white-space:nowrap; }
.encerrar-btn:hover { background:#15803d; border-color:#166534; box-shadow:0 0 0 2px #16a34a44; }
.encerrar-btn:active { transform:translateY(1px); }
.rota-checkbox { cursor:pointer; width:14px; height:14px; accent-color:#1e40af; vertical-align:middle; }
#andamento-bulk-bar { display:none; gap:8px; align-items:center; padding:6px 12px;
  background:#eef4ff; border:1px solid #93a7d8; border-radius:6px; margin-bottom:8px;
  font-size:12px; color:#1e3a8a; }
#andamento-bulk-bar.active { display:flex; }
#andamento-bulk-count { font-weight:900; color:#0f172a; }
.bulk-btn { background:#1e40af; color:#fff; border:none; padding:4px 10px; border-radius:5px;
  font-size:11px; font-weight:800; cursor:pointer; transition:all .15s; white-space:nowrap; }
.bulk-btn:hover { background:#1e3a8a; }
.bulk-btn.secondary { background:#ffffff; border:1px solid #64748b; color:#0f172a; }
.bulk-btn.secondary:hover { background:#dbeafe; border-color:#1d4ed8; color:#1e3a8a; }
.bulk-btn:disabled,
.bulk-btn.disabled { background:#e2e8f0; border:1px solid #94a3b8; color:#475569; cursor:not-allowed; opacity:1; }
.motorista-name { color: var(--text); }
.time-val { font-family: monospace; font-size: 16px; font-weight: 800; color: #111827; }
.time-alert { color: var(--red); font-weight: 800; }
/* Stem Out: thresholds visuais. 3h-4h = laranja, >=4h = vermelho. */
.time-val.stem-orange { color: #ea580c !important; font-weight: 800; }
.time-val.stem-red    { color: #b91c1c !important; font-weight: 800; }
.time-warn { color: var(--yellow); font-weight: 600; }
.progress-bar { width: 80px; height: 6px; background: var(--border2); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; background: var(--accent); }
.progress-fill.high { background: var(--green); }
.progress-fill.low { background: var(--yellow); }

/* ── MODO AMPLIAR (screenshot WhatsApp) ── */
#table-andamento.zoom-mode { font-size: 15px; }
#table-andamento.zoom-mode th { font-size: 12px; padding: 12px 14px; }
#table-andamento.zoom-mode td { padding: 11px 14px; font-size: 15px; }
#table-andamento.zoom-mode .rota-id { font-size: 16px; }
#table-andamento.zoom-mode .badge { font-size: 12px; padding: 3px 10px; }
#table-andamento.zoom-mode .time-val { font-size: 14px; }
#table-andamento.zoom-mode div[style*="font-size:11px"] { font-size: 13px !important; max-width: 220px !important; }

/* Farol Extra */
.farol-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.farol-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; padding: 14px; transition: all 0.2s; }
.farol-card.ok { border-color: var(--green-border); background: var(--green-bg); }
.farol-card.alerta { border-color: var(--red-border); background: var(--red-bg); animation: pulse-alert 2s infinite; }
.farol-card.atencao { border-color: var(--yellow-border); background: var(--yellow-bg); }
@keyframes pulse-alert { 0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.2); } 50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); } }
.farol-rota { font-size: 13px; font-weight: 700; color: var(--text); }
.farol-rota-plan { font-size: 10px; color: var(--text3); margin-top: 1px; font-family: monospace; }
.farol-motorista { font-size: 12px; color: var(--text2); margin-top: 4px; }
.farol-info { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.farol-info-item label { font-size: 10px; color: var(--text3); display: block; }
.farol-info-item span { font-size: 12px; font-family: monospace; }

/* Cross-reference ME Extra */
.crossref-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.crossref-table th { background: var(--bg); color: var(--text2); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); }
.crossref-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.crossref-table tr:last-child td { border-bottom: none; }
.crossref-table tr:hover td { background: var(--bg3); }
.crossref-table tr.row-ok td { background: rgba(34,197,94,0.04); }
.crossref-table tr.row-alerta td { background: rgba(239,68,68,0.06); }
.crossref-table tr.row-atencao td { background: rgba(234,179,8,0.04); }
.crossref-table tr.row-pendente td { background: rgba(168,139,250,0.04); }
.plan-code { font-family: monospace; font-size: 11px; color: var(--text3); }
.exec-code { font-family: monospace; font-size: 12px; font-weight: 600; color: var(--text); }
.tm-link { display: inline-flex; align-items: center; gap: 6px; background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue); padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none; transition: all 0.2s; }
.tm-link:hover { background: #1e3a5f; }
.extra-global-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; padding: 14px; background: var(--bg3); border: 1px solid var(--border); border-radius: 10px; }
.extra-stat { text-align: center; min-width: 72px; }
.extra-stat .val { font-size: 22px; font-weight: 800; line-height: 1; }
.extra-stat .lbl { font-size: 10px; color: var(--text3); margin-top: 3px; }

/* Filter bar */
.filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.filter-bar input { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 12px; width: 200px; }
.filter-bar input::placeholder { color: var(--text3); }
.filter-bar select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
.filter-bar label { font-size: 11px; color: var(--text2); }
.count-pill { background: var(--bg); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; font-size: 11px; color: var(--text2); margin-left: auto; }

/* Summary mini-stats */
.mini-stats { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.mini-stat { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.mini-stat .val { font-size: 20px; font-weight: 700; }
.mini-stat .lbl { font-size: 11px; color: var(--text2); }

/* Chart container */
.chart-container { position: relative; height: 200px; }

/* Horario info box */
.info-box { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 12px; color: var(--text2); display: flex; gap: 20px; flex-wrap: wrap; }
.info-box strong { color: var(--text); }

/* Empty state */
.empty { text-align: center; padding: 40px; color: var(--text3); }
.empty .empty-icon { font-size: 32px; margin-bottom: 8px; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── SUMMARY KPI PANEL ── */
#summaryPanel { background: var(--bg3); border-bottom: 1px solid var(--border); }
.summary-panel { padding: 10px 0; display: flex; align-items: stretch; gap: 0; overflow-x: auto; justify-content: center; max-width: 1400px; margin: 0 auto; }
.summary-kpi { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 18px; border-right: 1px solid var(--border); min-width: 90px; }
.summary-kpi:last-child { border-right: none; }
.summary-kpi .sk-val { font-size: 22px; font-weight: 800; line-height: 1; }
.summary-kpi .sk-lbl { font-size: 10px; color: var(--text3); margin-top: 4px; text-align: center; }
.summary-kpi .sk-sub { font-size: 11px; color: var(--text2); margin-top: 2px; }
.summary-kpi.kpi-ds .sk-val { color: var(--green); }
.summary-kpi.kpi-ds-bad .sk-val { color: var(--red); }
.summary-kpi.kpi-ds-warn .sk-val { color: var(--yellow); }
.summary-kpi.kpi-pendentes .sk-val { color: var(--yellow); }
.summary-kpi.kpi-falhas .sk-val { color: var(--red); }
.summary-kpi.kpi-entregues .sk-val { color: var(--green); }
.summary-kpi.kpi-andamento .sk-val { color: var(--blue); }
.summary-kpi.kpi-orhc .sk-val { color: var(--purple); }
.summary-xpt-wrap { background: var(--bg); border-bottom: 1px solid var(--border); }
.summary-xpt-row { display: flex; gap: 0; padding: 0; max-width: 1400px; margin: 0 auto; overflow-x: auto; align-items: stretch; }
.sxpt-chip { display: flex; flex: 1; gap: 8px; align-items: center; justify-content: center; padding: 8px 12px; border-right: 1px solid var(--border); font-size: 11px; background: var(--bg3); min-width: 0; flex-wrap: wrap; }
.sxpt-chip:last-child { border-right: none; }
.sxpt-chip .sxpt-ds { font-weight: 700; }

/* ── QUICK FILTER PILLS ── */
.qfilter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.qfilter-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg3); color: var(--text2); cursor: pointer; font-size: 12px; font-weight: 500; transition: all 0.2s; white-space: nowrap; user-select: none; }
.qfilter-btn:hover { border-color: var(--accent); color: var(--text); }
.qfilter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.qfilter-btn.btn-red.active  { background: #b91c1c; border-color: var(--red-border); color: #fff; }
.qfilter-btn.btn-yellow.active { background: #92400e; border-color: var(--yellow-border); color: #fde68a; }
.qfilter-btn.btn-green.active  { background: #166534; border-color: var(--green-border); color: #bbf7d0; }
.qfilter-btn .pill-count { background: rgba(255,255,255,0.18); padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 700; }

/* ── EXTRA TOGGLE (Em Andamento) ── */

@media (max-width: 900px) { .expedicao-grid { grid-template-columns: 1fr; } }
.exp-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }

</style>
</head>
<body>

<!-- ═══ LOAD SCREEN ═══ -->
<!-- loadScreen removido — carregamento automático -->
<div id="dashboard">
  <div class="header">
    <div class="header-left">
      <h1>Bot 2.0 📦 Monitor de Expedições e Performance Automatizado — SVC SES3 Linhares</h1>
      <div class="subtitle" id="headerSubtitle"></div>
    </div>
    <div class="header-right">
      <!-- Toggle Station SES3/SES2 — filtra TODO o dashboard pela station
           selecionada. Persiste em localStorage. Switch instantaneo sem
           refetch (o bot ja coleta os 2 SCs em cada ciclo). -->
      <div id="stationToggle" style="display:inline-flex;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;margin-right:10px;font-size:11px;font-weight:700">
        <button id="btn-station-SES3" onclick="switchStation('SES3')"
          style="background:#2563eb;color:#fff;border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:700;font-size:11px;transition:all 0.15s">
          📍 SES3
        </button>
        <button id="btn-station-SES2" onclick="switchStation('SES2')"
          style="background:transparent;color:var(--text2);border:none;padding:5px 12px;border-radius:6px;cursor:pointer;font-weight:700;font-size:11px;transition:all 0.15s">
          📍 SES2
        </button>
      </div>
      <div class="ts-badge" id="tsBadge"></div>
      <span id="next-refresh-lbl" style="font-size:10px;color:var(--text2);margin-right:8px;"></span>
      <button class="reload-btn" onclick="fetchLatest();">⟳ Atualizar dados</button>
    </div>
  </div>

  <div class="alerts-bar" id="alertsBar"></div>
  <!-- KPI Summary Panel -->
  <div id="summaryPanel" style="display:none;"></div>

  <div class="main">
    <!-- XPT Cards -->
    <div class="xpt-cards" id="xptCards"></div>

    <!-- Tabs navigation -->
    <div class="tabs" id="mainTabs"></div>

    <!-- Tab panels -->
    <div id="tabPanels"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  STATION TOGGLE — SES2 vs SES3
// ═══════════════════════════════════════════════════════════════
// O bot coleta os 2 SCs (SES2 + SES3) a cada ciclo e taga cada rota
// com r.station. O toggle no header escolhe qual mostrar — filtra
// TODO o dashboard sem refetch.
const _STATION_KEY = 'selected_station_v1';
let _currentStation = (function(){
  try { return localStorage.getItem(_STATION_KEY) || 'SES3'; }
  catch { return 'SES3'; }
})();

function switchStation(s) {
  if (s !== 'SES2' && s !== 'SES3') return;
  if (s === _currentStation) return;
  _currentStation = s;
  try { localStorage.setItem(_STATION_KEY, s); } catch {}
  _updateStationToggleUI();
  // Re-renderiza tudo com o filtro novo. Usa _rawDadosFull (cache do
  // payload completo) — refetch tambem dispara renderDashboard.
  // O fetchLatest internamente chama latestToRelatorio que ja aplica
  // o filtro pela station ativa, entao um unico refetch resolve tudo.
  try { if (typeof fetchLatest === 'function') fetchLatest(); } catch(e){}
}

function _updateStationToggleUI() {
  const b3 = document.getElementById('btn-station-SES3');
  const b2 = document.getElementById('btn-station-SES2');
  if (!b3 || !b2) return;
  if (_currentStation === 'SES3') {
    b3.style.background = '#2563eb'; b3.style.color = '#fff';
    b2.style.background = 'transparent'; b2.style.color = 'var(--text2)';
  } else {
    b2.style.background = '#7c3aed'; b2.style.color = '#fff';
    b3.style.background = 'transparent'; b3.style.color = 'var(--text2)';
  }
}

// Lista dinamica dos XPT IDs da station ativa — usada em vez do array
// hardcoded _xptsForStation() espalhado pelo dashboard.
function _xptsForStation(station) {
  station = station || _currentStation;
  // Quando XPT_CONFIG ja existir, filtra por station. Defensivo: se XPT_CONFIG
  // ainda nao foi definido (script ordem de carregamento), usa fallback SES3.
  try {
    if (typeof XPT_CONFIG === 'undefined') {
      return station === 'SES2' ? ['EES5','EMG20'] : ['EBA32','EES2','EES3','EES6'];
    }
    return Object.entries(XPT_CONFIG)
      .filter(([id, cfg]) => cfg && cfg.station === station && id !== 'SVC')
      .map(([id]) => id);
  } catch {
    return station === 'SES2' ? ['EES5','EMG20'] : ['EBA32','EES2','EES3','EES6'];
  }
}

// Filtra o latest.json bruto, deixando so as rotas/xpts da station ativa.
// Mutaciona window._rawDados — guarda original em window._rawDadosFull.
// IMPORTANTE: tambem RECALCULA os totais (resumo.total_pacotes,
// total_pacotes, etc) pra refletir SOMENTE a station ativa — senao
// os KPIs do topo continuam mostrando soma dos 2 SCs.
function _applyStationFilter() {
  const full = window._rawDadosFull;
  if (!full) return;
  const st = _currentStation;
  // Defensive: alem de r.station, infere por origem/NEx/DC para evitar
  // qualquer vazamento entre SES2 e SES3 quando o payload vier incompleto.
  const matchSt = (r) => _routeMatchesStation(r, st);
  const normalizeRouteForStation = (r) => {
    if (!r) return r;
    r.station = _stationFromRoute(r);
    r.origem = _normalizeOrigemId(r.origem);
    r.transportadora_grupo = _carrierGroup(r.transportadora);
    if (!r.origem) {
      const n = String(r.rota || r.nome_rota || '').replace(/^>/, '').trim();
      const ciclo = n.includes('_') ? n.split('_').pop() : '';
      r.origem_display = ciclo ? `${r.station} - ${ciclo}` : r.station;
    }
    return r;
  };
  const cloned = JSON.parse(JSON.stringify(full));
  if (Array.isArray(cloned.todas_dia)) {
    cloned.todas_dia = cloned.todas_dia.filter(matchSt).map(normalizeRouteForStation);
  }
  if (Array.isArray(cloned.top_geral)) {
    cloned.top_geral = cloned.top_geral.filter(matchSt).map(normalizeRouteForStation);
  }
  if (cloned.xpts_expedicao && typeof cloned.xpts_expedicao === 'object') {
    const filteredXpts = {};
    for (const [xid, xdata] of Object.entries(cloned.xpts_expedicao)) {
      // Se o XPT tem config.station, usa isso. Senao, infere pela primeira rota.
      const cfgStation = (xdata.config && xdata.config.station) || null;
      const firstRoute = (xdata.todas && xdata.todas[0]) || null;
      const xptStation = cfgStation || (firstRoute && _stationFromRoute(firstRoute)) || (STATION_ORIGENS.SES2.has(_normalizeOrigemId(xid)) ? 'SES2' : 'SES3');
      if (xptStation === st) {
        ['todas','no_xpt','no_xpt_d1','a_caminho','em_curso','concluidas','extras','amanha','proximo'].forEach(k => {
          if (Array.isArray(xdata[k])) xdata[k] = xdata[k].filter(matchSt).map(normalizeRouteForStation);
        });
        filteredXpts[xid] = xdata;
      }
    }
    cloned.xpts_expedicao = filteredXpts;
  }

  const _stationFromOrigemId = (id) => {
    const og = _normalizeOrigemId(id);
    if (!og) return null;
    if (STATION_ORIGENS.SES2.has(og)) return 'SES2';
    if (STATION_ORIGENS.SES3.has(og)) return 'SES3';
    return (XPT_CONFIG[og] || NEX_CONFIG[og] || DC_CONFIG[og] || {}).station || null;
  };

  if (cloned.nex && typeof cloned.nex === 'object') {
    const filteredNex = {};
    for (const [nid, ndata] of Object.entries(cloned.nex)) {
      const cfgStation = _stationFromOrigemId(nid);
      const firstRoute = (ndata && ndata.todas && ndata.todas[0]) || null;
      const nexStation = cfgStation || (firstRoute && _stationFromRoute(firstRoute));
      if (nexStation === st) {
        ['todas','no_xpt','a_caminho','em_curso','concluidas','extras'].forEach(k => {
          if (Array.isArray(ndata[k])) ndata[k] = ndata[k].filter(matchSt).map(normalizeRouteForStation);
        });
        filteredNex[nid] = ndata;
      }
    }
    cloned.nex = filteredNex;
  }

  // Rotas do Dia: a coleta geral pode trazer apenas parte dos NEx.
  // A coleta segmentada por BRNES fica em xpts_expedicao; mesclamos aqui
  // antes de recalcular os totais para "Rotas do Dia", Reporte e KPIs.
  const _mergeNexSegmentado = (lista) => {
    const base = Array.isArray(lista) ? lista : [];
    const byKey = new Map();
    const keyOf = (r) => {
      const og = _normalizeOrigemId(r.origem || r.xpt);
      const id = String(r.id_rota || r.id || r.shipment_id || '').trim();
      if (id) return `${og}|id:${id}`;
      const rota = String(r.rota || r.nome_rota || '').replace(/^>/, '').trim().toUpperCase();
      const motorista = String(r.motorista || '').trim().toUpperCase();
      return `${og}|rota:${rota}|m:${motorista}`;
    };
    base.forEach(r => {
      const rr = normalizeRouteForStation({ ...r });
      byKey.set(keyOf(rr), rr);
    });

    const nexIds = Object.entries(NEX_CONFIG || {})
      .filter(([, cfg]) => cfg && cfg.station === st)
      .map(([nid]) => _normalizeOrigemId(nid));
    nexIds.forEach(nid => {
      const xdata = cloned.xpts_expedicao && cloned.xpts_expedicao[nid];
      const rotas = (xdata && Array.isArray(xdata.todas)) ? xdata.todas : [];
      rotas.forEach(r => {
        if (!r || r.e_de_amanha) return;
        const rr = normalizeRouteForStation({ ...r, origem: nid, xpt: nid, station: st });
        byKey.set(keyOf(rr), rr);
      });
    });
    return Array.from(byKey.values());
  };

  if (Array.isArray(cloned.todas_dia)) cloned.todas_dia = _mergeNexSegmentado(cloned.todas_dia);
  if (Array.isArray(cloned.top_geral)) cloned.top_geral = _mergeNexSegmentado(cloned.top_geral);

  if (Array.isArray(cloned.reporte_nex)) {
    cloned.reporte_nex = cloned.reporte_nex.filter(n => {
      const nid = _normalizeOrigemId(n.nex || n.codigo || n.origem || n.id);
      const station = _stationFromOrigemId(nid);
      return station ? station === st : false;
    });
  }
  if (Array.isArray(cloned.reporte_extra)) {
    cloned.reporte_extra = cloned.reporte_extra.filter(x => {
      const xid = _normalizeOrigemId(x.xpt || x.codigo || x.origem || x.id);
      const station = _stationFromOrigemId(xid);
      return station ? station === st : false;
    });
  }
  if (Array.isArray(cloned.top_envios_extra)) {
    cloned.top_envios_extra = cloned.top_envios_extra.filter(matchSt).map(normalizeRouteForStation);
  }

  // ── Recalcula totais por station — soma so as rotas filtradas ──
  // Sem isso, raw.resumo.total_pacotes (que o backend acumula dos 2 SCs)
  // continua inflando os KPIs do topo mesmo apos o filtro.
  const rotasFiltradas = cloned.todas_dia || cloned.top_geral || [];
  const _pkg = (r) => {
    if (r.pacotes != null) return r.pacotes;
    const t = (r.entregues||0) + (r.falhas||0) + (r.pendentes||0);
    return Math.max(0, t - (r.sacas||0));
  };
  const totalPacotesSt = rotasFiltradas.reduce((s, r) => s + _pkg(r), 0);
  const totalSacasSt   = rotasFiltradas.reduce((s, r) => s + (r.sacas||0), 0);
  const emAndamentoSt  = rotasFiltradas.filter(r => r.em_curso || r.status === 'em_curso').length;
  // RECALCULA tambem entregues/falhas/pendentes/total_rotas — sem isso o
  // Fechamento da Operacao mostra DS de 220% (entregues somados dos 2 SCs
  // dividido por pacotes ja filtrados, gerando >100%).
  const totalEntreguesSt = rotasFiltradas.reduce((s, r) => s + (r.entregues||0), 0);
  const totalFalhasSt    = rotasFiltradas.reduce((s, r) => s + (r.falhas||0), 0);
  const totalPendentesSt = rotasFiltradas.reduce((s, r) => s + (r.pendentes||0), 0);
  const totalRotasSt     = rotasFiltradas.length;
  const concluidasSt     = rotasFiltradas.filter(r => r.status === 'concluida').length;
  const dsGlobalSt       = totalPacotesSt > 0 ? (totalEntreguesSt / totalPacotesSt * 100) : 0;
  // Sobrescreve campos top-level (alguns codigos leem direto, outros via resumo)
  cloned.total_pacotes  = totalPacotesSt;
  cloned.total_sacas    = totalSacasSt;
  cloned.em_andamento   = emAndamentoSt;
  cloned.total_entregues= totalEntreguesSt;
  cloned.total_falhas   = totalFalhasSt;
  cloned.total_pendentes= totalPendentesSt;
  cloned.total_rotas    = totalRotasSt;
  cloned.total_concluidas= concluidasSt;
  cloned.ds_global      = dsGlobalSt;
  if (cloned.resumo && typeof cloned.resumo === 'object') {
    cloned.resumo.total_pacotes  = totalPacotesSt;
    cloned.resumo.total_sacas    = totalSacasSt;
    cloned.resumo.em_andamento   = emAndamentoSt;
    cloned.resumo.total_entregues= totalEntreguesSt;
    cloned.resumo.total_falhas   = totalFalhasSt;
    cloned.resumo.total_pendentes= totalPendentesSt;
    cloned.resumo.total_rotas    = totalRotasSt;
    cloned.resumo.total_concluidas= concluidasSt;
    cloned.resumo.ds_global      = dsGlobalSt;
    cloned.resumo.entregues      = totalEntreguesSt;
    cloned.resumo.falhas         = totalFalhasSt;
    cloned.resumo.pendentes      = totalPendentesSt;
    if (cloned.resumo.pacotes != null) cloned.resumo.pacotes = totalPacotesSt;
    if (cloned.resumo.rotas != null)   cloned.resumo.rotas   = totalRotasSt;
  }
  // Bloco 'fechamento' pode tambem existir no payload — atualiza
  if (cloned.fechamento && typeof cloned.fechamento === 'object') {
    cloned.fechamento.total_pacotes  = totalPacotesSt;
    cloned.fechamento.pacotes_entregues = totalEntreguesSt;
    cloned.fechamento.total_insucessos  = totalFalhasSt;
    cloned.fechamento.total_rotas    = totalRotasSt;
    cloned.fechamento.ds_geral       = dsGlobalSt;
  }

  // ── Recalcula reporte_svc (MLPs do SVC) a partir das rotas filtradas ──
  // O backend agrega esse bloco no .json sem station-awareness, entao
  // ele soma os 2 SCs. Recalculamos aqui agrupando por transportadora
  // baseado SOMENTE nas rotas da station ativa.
  // Identifica rotas SVC: sem origem XPT/NEX/DC propria.
  const _XPT_NEX_DC_IDS = new Set([
    'EBA32','EES2','EES3','EES6','EES5','EMG20','MG20',
    'BRNES124','BRNES73','BRNES464','BRDES73','BRDES6818',
    'BRNES10','BRNES87','BRNES6769',
    'BRDES6805','BRDES6810','BRDES6768','BRDES6807','BRDES10',
  ]);
  const _isSvcRoute = (r) => {
    const og = (r.origem || '').trim();
    return !og || !_XPT_NEX_DC_IDS.has(og);
  };
  const svcLinhasMap = {};
  const _svcTotalLinha = (l) => Number(l.pacotes || 0) + Number(l.sacas || 0);
  const _svcSucessoLinha = (l) => {
    const total = _svcTotalLinha(l);
    const ent = Number(l.entregues || 0);
    const fal = Number(l.falhas || 0);
    const pen = Number(l.pendentes || 0);
    const derivado = Math.max(0, total - fal - pen);
    const tolerancia = Math.max(2, Math.round(total * 0.01));
    if (ent > 0 && Math.abs((ent + fal + pen) - total) <= tolerancia) return ent;
    return derivado;
  };
  rotasFiltradas.filter(_isSvcRoute).forEach(r => {
    const tcp = _carrierGroup(r.transportadora) || (r.transportadora || '—').trim() || '—';
    if (!svcLinhasMap[tcp]) {
      svcLinhasMap[tcp] = { transportadora: tcp, rotas: 0, pacotes: 0, sacas: 0, entregues: 0, falhas: 0, pendentes: 0 };
    }
    const slot = svcLinhasMap[tcp];
    slot.rotas     += 1;
    slot.pacotes   += _pkg(r);
    slot.sacas     += (r.sacas||0);
    slot.entregues += (r.entregues||0);
    slot.falhas    += (r.falhas||0);
    slot.pendentes += (r.pendentes||0);
  });
  // Calcula DS por linha
  Object.values(svcLinhasMap).forEach(l => {
    const total = _svcTotalLinha(l);
    l.entregues = _svcSucessoLinha(l);
    l.ds = total > 0 ? (l.entregues / total * 100) : 0;
  });
  const novasLinhasSvc = Object.values(svcLinhasMap).sort((a,b) => b.rotas - a.rotas);
  const svcTotalRotas     = novasLinhasSvc.reduce((s,l) => s+(l.rotas||0), 0);
  const svcTotalPacotes   = novasLinhasSvc.reduce((s,l) => s+(l.pacotes||0), 0);
  const svcTotalSacas     = novasLinhasSvc.reduce((s,l) => s+(l.sacas||0), 0);
  const svcTotalEntregues = novasLinhasSvc.reduce((s,l) => s+(l.entregues||0), 0);
  const svcTotalFalhas    = novasLinhasSvc.reduce((s,l) => s+(l.falhas||0), 0);
  const svcTotalPendentes = novasLinhasSvc.reduce((s,l) => s+(l.pendentes||0), 0);
  const svcTotalDenom     = svcTotalPacotes + svcTotalSacas;
  const svcDS             = svcTotalDenom > 0 ? (svcTotalEntregues / svcTotalDenom * 100) : 0;
  if (cloned.reporte_svc && typeof cloned.reporte_svc === 'object') {
    cloned.reporte_svc.linhas = novasLinhasSvc;
    // Totais da tabela MLPs do SVC
    cloned.reporte_svc.total_rotas     = svcTotalRotas;
    cloned.reporte_svc.total_pacotes   = svcTotalPacotes;
    cloned.reporte_svc.total_sacas     = svcTotalSacas;
    cloned.reporte_svc.total_entregues = svcTotalEntregues;
    cloned.reporte_svc.total_falhas    = svcTotalFalhas;
    cloned.reporte_svc.total_pendentes = svcTotalPendentes;
    cloned.reporte_svc.delivery_success = svcDS;
    cloned.reporte_svc.insucesso_pct    = Math.max(0, 100 - svcDS);
  } else {
    cloned.reporte_svc = {
      linhas: novasLinhasSvc,
      total_rotas:      svcTotalRotas,
      total_pacotes:    svcTotalPacotes,
      total_sacas:      svcTotalSacas,
      total_entregues:  svcTotalEntregues,
      total_falhas:     svcTotalFalhas,
      total_pendentes:  svcTotalPendentes,
      delivery_success: svcDS,
      insucesso_pct:    Math.max(0, 100 - svcDS),
    };
  }

  // ── Recalcula reporte (POR XPT — LM) a partir das rotas filtradas ──
  // Agrupa por origem (XPT) — so XPTs da station ativa.
  const _xptsAtivos = _xptsForStation(st);
  const xptLinhasMap = {};
  _xptsAtivos.forEach(xid => {
    xptLinhasMap[xid] = { xpt: xid, codigo: xid, rotas: 0, pacotes: 0,
                          entregues: 0, falhas: 0, pendentes: 0,
                          expedidos: 0, insucessos: 0, delivery_success: 0 };
  });
  rotasFiltradas.forEach(r => {
    const og = (r.origem || '').trim();
    if (xptLinhasMap[og]) {
      const slot = xptLinhasMap[og];
      slot.rotas     += 1;
      slot.pacotes   += _pkg(r);
      slot.entregues += (r.entregues||0);
      slot.falhas    += (r.falhas||0);
      slot.pendentes += (r.pendentes||0);
      slot.expedidos = slot.pacotes;
      slot.insucessos = slot.falhas;
      slot.delivery_success = slot.pacotes > 0 ? (slot.entregues / slot.pacotes * 100) : 0;
    }
  });
  cloned.reporte = Object.values(xptLinhasMap);

  // Recalcula NEx da station ativa. O backend nem sempre gera esse bloco para
  // SES2, entao montamos por origem (BRNES10/BRNES87) a partir das rotas ja
  // filtradas.
  const _nexAtivos = Object.entries(NEX_CONFIG || {})
    .filter(([, cfg]) => cfg && cfg.station === st)
    .map(([nid]) => _normalizeOrigemId(nid));
  const nexMap = {};
  _nexAtivos.forEach(nid => {
    nexMap[nid] = {
      nex: nid,
      nome: (NEX_CONFIG[nid] || {}).nome || nid,
      linhasMap: {},
    };
  });
  rotasFiltradas.forEach(r => {
    const og = _normalizeOrigemId(r.origem);
    const nx = nexMap[og];
    if (!nx) return;
    const tcp = _carrierGroup(r.transportadora) || (r.transportadora || '—').trim() || '—';
    if (!nx.linhasMap[tcp]) {
      nx.linhasMap[tcp] = { transportadora: tcp, rotas: 0, pacotes: 0, entregues: 0, falhas: 0, pendentes: 0, ds: 0 };
    }
    const slot = nx.linhasMap[tcp];
    slot.rotas += 1;
    slot.pacotes += _pkg(r);
    slot.entregues += (r.entregues || 0);
    slot.falhas += (r.falhas || 0);
    slot.pendentes += (r.pendentes || 0);
  });
  cloned.reporte_nex = Object.values(nexMap)
    .map(n => {
      const linhas = Object.values(n.linhasMap).map(l => ({
        ...l,
        ds: l.pacotes > 0 ? (l.entregues / l.pacotes * 100) : 0,
      })).sort((a, b) => b.rotas - a.rotas);
      const totalPacotes = linhas.reduce((s, l) => s + l.pacotes, 0);
      const totalEntregues = linhas.reduce((s, l) => s + l.entregues, 0);
      return {
        nex: n.nex,
        nome: n.nome,
        linhas,
        total_rotas: linhas.reduce((s, l) => s + l.rotas, 0),
        total_pacotes: totalPacotes,
        total_entregues: totalEntregues,
        total_falhas: linhas.reduce((s, l) => s + l.falhas, 0),
        delivery_success: totalPacotes > 0 ? (totalEntregues / totalPacotes * 100) : 0,
      };
    })
    .filter(n => n.linhas.length > 0);

  // ── Filtra resumo por SD (Ciclo SD) — so rotas SD da station ativa ──
  // (Rotas SD geralmente tem origem == 'SD' — filtramos por todas_dia)
  if (cloned.resumo_sd || cloned.reporte_sd) {
    const sdRotas = rotasFiltradas.filter(r => r.origem === 'SD' ||
                                                (r.nome_rota||'').toUpperCase().endsWith('_SD'));
    const sdPkg  = sdRotas.reduce((s,r) => s + _pkg(r), 0);
    const sdEnt  = sdRotas.reduce((s,r) => s + (r.entregues||0), 0);
    const sdFal  = sdRotas.reduce((s,r) => s + (r.falhas||0), 0);
    const sdPen  = sdRotas.reduce((s,r) => s + (r.pendentes||0), 0);
    const sdData = {
      rotas:     sdRotas.length,
      pacotes:   sdPkg,
      entregues: sdEnt,
      falhas:    sdFal,
      pendentes: sdPen,
      ds:        sdPkg > 0 ? (sdEnt/sdPkg*100) : 0,
    };
    if (cloned.resumo_sd) Object.assign(cloned.resumo_sd, sdData);
    if (cloned.reporte_sd) Object.assign(cloned.reporte_sd, sdData);
  }

  // ── Filtra Frota Fixa por station ─────────────────────────
  // Cada veiculo agora carrega .station (SES2 ou SES3). Aqui mantemos
  // so os da station ativa e recalculamos totais (em_uso, ausentes,
  // inativos, pct_uso, por_tipo, por_transp) baseado nesse subset.
  if (cloned.frotas_fixas && typeof cloned.frotas_fixas === 'object') {
    const ff = cloned.frotas_fixas;
    const vehAll = Array.isArray(ff.veiculos) ? ff.veiculos : [];
    const cfgAll = Array.isArray(ff.config_lista) ? ff.config_lista : [];
    const vehSt  = vehAll.filter(v => (v.station || 'SES3') === st);
    const cfgSt  = cfgAll.filter(c => (c.station || 'SES3') === st);
    // Recalcula totais
    const naoReserva = vehSt.filter(v => !v.reserva);
    const reservas   = vehSt.filter(v => v.reserva);
    const ff_total       = naoReserva.length;
    const ff_em_uso      = naoReserva.filter(v => v.status !== 'ausente').length;
    const ff_ausentes    = naoReserva.filter(v => v.status === 'ausente').length;
    const ff_inativos    = naoReserva.filter(v => v.inativo).length;
    const ff_reserva_total = reservas.length;
    const ff_reserva_em_uso= reservas.filter(v => v.status !== 'ausente').length;
    const ff_pct_uso = ff_total > 0 ? Math.round(ff_em_uso/ff_total*100*10)/10 : 0;
    // Re-agrega por tipo/transportadora a partir das placas da station
    const porTipo = {}, porTransp = {};
    naoReserva.forEach(v => {
      const t = v.tipo || '—';
      const tcp = v.transportadora || '—';
      [[t, porTipo],[tcp, porTransp]].forEach(([k, idx]) => {
        if (!idx[k]) idx[k] = { total: 0, em_uso: 0, ausentes: 0 };
        idx[k].total += 1;
        if (v.status !== 'ausente') idx[k].em_uso += 1;
        else idx[k].ausentes += 1;
      });
    });
    const _agrupa = (idx, key) => Object.entries(idx).map(([k,v]) => ({
      [key]: k, ...v,
      pct: v.total > 0 ? Math.round(v.em_uso/v.total*1000)/10 : 0
    })).sort((a,b) => a[key].localeCompare(b[key]));
    cloned.frotas_fixas = {
      ...ff,
      total: ff_total, em_uso: ff_em_uso, ausentes: ff_ausentes,
      inativos: ff_inativos, pct_uso: ff_pct_uso,
      reserva_total: ff_reserva_total, reserva_em_uso: ff_reserva_em_uso,
      por_tipo: _agrupa(porTipo, 'tipo'),
      por_transp: _agrupa(porTransp, 'transportadora'),
      veiculos: vehSt,
      config_lista: cfgSt,
    };
  }

  // Anota a station ativa pra debug
  cloned._station_filter = st;

  window._rawDados = cloned;
}

function _normKey(txt) {
  return String(txt || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function _normalizeOrigemId(origem) {
  const og = String(origem || '').trim().toUpperCase();
  return og === 'MG20' ? 'EMG20' : og;
}

function _carrierGroup(tcp) {
  const n = _normKey(tcp);
  if (!n) return '';
  if (n.includes('HAWK')) return 'HAWK';
  if (n.includes('DELUNA')) return 'DELUNA';
  if (n.includes('ONTIME')) return 'ONTIME';
  if (n.includes('PARCEIRO')) return 'PARCEIRO';
  if (n.includes('RODACOOP') || n.includes('RODACOP')) return 'RODACOP';
  return String(tcp || '').trim();
}

function _stationFromRoute(r) {
  if (!r) return 'SES3';
  const explicit = String(r.station || '').toUpperCase();
  if (explicit === 'SES2' || explicit === 'SES3') return explicit;
  const og = _normalizeOrigemId(r.origem || r.xpt || r._nex_id || r.origem_id);
  if (STATION_ORIGENS.SES2.has(og)) return 'SES2';
  if (STATION_ORIGENS.SES3.has(og)) return 'SES3';
  const disp = String(r.origem_display || '').toUpperCase();
  if (disp.includes('SES2')) return 'SES2';
  if (disp.includes('SES3')) return 'SES3';
  return 'SES3';
}

function _routeMatchesStation(r, st) {
  return !r || _stationFromRoute(r) === st;
}

function _origemLabel(id) {
  const og = _normalizeOrigemId(id);
  const xpt = XPT_CONFIG[og];
  if (xpt) return `${xpt.display_id || og} - ${xpt.nome}`;
  const nex = NEX_CONFIG[og];
  if (nex) return `${og} - ${nex.nome}`;
  const dc = DC_CONFIG[og];
  if (dc) return `${og} - ${dc.nome}`;
  return id || '';
}

let globalData = null;
let montagemData = null; // driver assignments from extra_montagem export
let _stalenessInterval = null;

// ═══════════════════════════════════════════════════════════════
//  CARREGAMENTO DE ARQUIVO
// ═══════════════════════════════════════════════════════════════
// ─── SEPARAÇÃO DIA ATUAL vs DIA SEGUINTE (D+1 XPTs) ─────────────
// XPTs D+1 recebem rotas do dia + rotas do próximo dia juntas.
// O prefixo ">" alterna a cada dia. As rotas em_curso/concluida/no_xpt
// definem o padrão do dia. Rotas a_caminho com padrão OPOSTO = amanhã.
function separateD1Routes(xpt) {
  const todas = xpt.todas || [];

  // Fase 1: determinar o padrão do dia a partir de rotas JÁ expedidas (em_curso + concluida)
  // Estas são garantidamente do ciclo atual — nunca do dia seguinte.
  let ref = todas.filter(r => r.rota && (r.status === 'em_curso' || r.status === 'concluida'));

  // Fallback: se ainda não houve expedição LM (madrugada), usa no_xpt como referência
  if (!ref.length) {
    ref = todas.filter(r => r.rota && r.status === 'no_xpt');
  }

  if (!ref.length) return { hoje: todas, proximo: [], pattern: null };

  const comSimbolo = ref.filter(r => r.rota.startsWith('>')).length;
  const todayHasSymbol = comSimbolo > ref.length / 2;

  // Aplica o padrão a TODAS as rotas (inclusive no_xpt que já chegaram para amanhã)
  const isToday = r => {
    if (!r.rota) return true; // sem ID → inclui por segurança
    return todayHasSymbol ? r.rota.startsWith('>') : !r.rota.startsWith('>');
  };

  return {
    hoje:    todas.filter(r => isToday(r)),
    proximo: todas.filter(r => !isToday(r)),
    pattern: todayHasSymbol ? 'com_simbolo' : 'sem_simbolo'
  };
}

function _d1RouteName(r) {
  return String(r?.rota || r?.nome_rota || '').trim();
}

function _d1RouteKey(r) {
  return String(r?.id || r?.id_rota || r?.rota || r?.nome_rota || JSON.stringify(r));
}

function _dedupeD1Routes(rotas) {
  const seen = new Set();
  return (rotas || []).filter(r => {
    const key = _d1RouteKey(r);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function _normalizeXptArrivalStatus(r) {
  if (!r) return r;
  return r;
  const sub = String(r.substatus_api || r.sub_status || r.substatus || '').toLowerCase();
  // O monitor ja faz o cross-check contra a coleta geral e grava a
  // classificacao final. Nao sobrescrever `no_xpt` por substatus bruto aqui,
  // pois isso joga rotas D+1 de SES2/EBA32 no contador errado de "A caminho".
  if (r.status === 'a_caminho' && sub === 'at_destination_facility') {
    return { ...r, status: 'no_xpt' };
  }
  return r;
}

function _inferTodayArrowPattern(rotas) {
  const named = _dedupeD1Routes(rotas).filter(r => _d1RouteName(r));
  if (!named.length) return null;

  const operating = named.filter(r =>
    r.status === 'em_curso' ||
    r.status === 'concluida' ||
    (Number(r.entregues) || 0) > 0 ||
    (Number(r.ozh_min) || 0) > 0
  );
  const ref = operating.length >= 5 ? operating : named;
  const withArrow = ref.filter(r => _d1RouteName(r).startsWith('>')).length;
  const pctArrow = withArrow / ref.length;

  if (pctArrow >= 0.7) return true;
  if (pctArrow <= 0.3) return false;
  return null;
}

function _fixD1ByArrowMajority(xdata) {
  return {
    todas: xdata.todas || [],
    no_xpt: xdata.no_xpt || [],
    a_caminho: xdata.a_caminho || [],
    no_xpt_d1: xdata.no_xpt_d1 || [],
    amanha: xdata.amanha || [],
    proximo: xdata.proximo || [],
  };
  // Se o monitor ja separou rotas de amanha, respeita a fonte principal.
  // Reprocessar pelo prefixo aqui pode recolocar rotas futuras no total de hoje.
  if ((xdata.amanha || []).length || (xdata.proximo || []).length || (xdata.no_xpt_d1 || []).length) {
    const d1 = _dedupeD1Routes([...(xdata.no_xpt_d1 || []), ...(xdata.amanha || []), ...(xdata.proximo || [])])
      .map(r => ({ ...r, status: 'no_xpt', e_de_amanha: true, _d1_no_xpt: true }));
    const d1Keys = new Set(d1.map(_d1RouteKey));
    const todasHoje = _dedupeD1Routes(xdata.todas || []).filter(r => !d1Keys.has(_d1RouteKey(r)) && !r.e_de_amanha);
    return {
      todas: todasHoje,
      no_xpt: (xdata.no_xpt || []).filter(r => !d1Keys.has(_d1RouteKey(r)) && !r.e_de_amanha),
      a_caminho: (xdata.a_caminho || []).filter(r => !d1Keys.has(_d1RouteKey(r)) && !r.e_de_amanha),
      no_xpt_d1: d1,
      amanha: d1,
      proximo: d1,
    };
  }

  const todas = xdata.todas || [];
  const noXpt = xdata.no_xpt || [];
  const amanha = xdata.amanha || [];
  const proximo = xdata.proximo || [];
  const noXptD1 = xdata.no_xpt_d1 || [];
  const all = _dedupeD1Routes([...todas, ...noXpt, ...amanha, ...proximo, ...noXptD1]);
  const todayHasArrow = _inferTodayArrowPattern(all);

  if (todayHasArrow === null) {
    return { todas, no_xpt: noXpt, a_caminho: xdata.a_caminho || [], no_xpt_d1: [], amanha: [], proximo: [] };
  }

  const tomorrowHasArrow = !todayHasArrow;
  const isTomorrowPrefix = r => {
    const name = _d1RouteName(r);
    return name && name.startsWith('>') === tomorrowHasArrow;
  };
  const hasRealActivity = r =>
    r.status === 'em_curso' ||
    r.status === 'concluida' ||
    (Number(r.entregues) || 0) > 0 ||
    (Number(r.ozh_min) || 0) > 0;

  const trueD1 = _dedupeD1Routes([...noXptD1, ...amanha, ...proximo, ...noXpt, ...(xdata.a_caminho || []), ...todas])
    .filter(r => isTomorrowPrefix(r) && !hasRealActivity(r))
    .map(r => ({ ...r, status: 'no_xpt', e_de_amanha: true, _d1_no_xpt: true }));
  const trueACaminho = _dedupeD1Routes([...(xdata.a_caminho || []), ...todas])
    .filter(r => !isTomorrowPrefix(r) && !hasRealActivity(r))
    .filter(r => r.status === 'a_caminho')
    .map(r => ({ ...r, status: 'a_caminho', e_de_amanha: false, _d1_no_xpt: false }));
  const trueD1Keys = new Set(trueD1.map(_d1RouteKey));
  const trueACaminhoKeys = new Set(trueACaminho.map(_d1RouteKey));

  const restoreToday = _dedupeD1Routes([...amanha, ...proximo])
    .filter(r => !trueD1Keys.has(_d1RouteKey(r)) && !trueACaminhoKeys.has(_d1RouteKey(r)) && !isTomorrowPrefix(r))
    .map(r => ({ ...r, status: 'no_xpt', e_de_amanha: false, _d1_no_xpt: false }));

  const correctedTodas = _dedupeD1Routes([...todas, ...restoreToday, ...trueACaminho])
    .filter(r => !trueD1Keys.has(_d1RouteKey(r)));
  const correctedNoXpt = _dedupeD1Routes([...noXpt, ...restoreToday])
    .filter(r => !trueD1Keys.has(_d1RouteKey(r)) && !r.e_de_amanha);
  const correctedACaminho = _dedupeD1Routes([...(xdata.a_caminho || []), ...trueACaminho])
    .filter(r => !trueD1Keys.has(_d1RouteKey(r)) && !r.e_de_amanha);

  return {
    todas: correctedTodas,
    no_xpt: correctedNoXpt,
    a_caminho: correctedACaminho,
    no_xpt_d1: trueD1,
    amanha: trueD1,
    proximo: trueD1,
  };
}

// ─── PÓS-NORMALIZAÇÃO DO JSON ────────────────────────────────────
// Corrige classificações que o bookmarklet pode ter errado:
// Extra com motorista atribuído + initDate → em_curso (não no_xpt)
function normalizeData(data) {
  const allGroups = [
    ...Object.values(data.xpts || {}),
    ...Object.values(data.nex  || {}),
  ];
  allGroups.forEach(xpt => {
    if (!xpt.todas) return;
    xpt.todas = xpt.todas.map(_normalizeXptArrivalStatus);
    xpt.todas.forEach(r => {
      if (
        r.status === 'no_xpt' &&
        r.motorista_id &&
        r.hora_inicio && r.hora_inicio !== '-'
      ) {
        // Driver atribuído + initDate presente = rota bipada no XPT = expedida
        r.status = 'em_curso';
      }
    });
    // Recalcula arrays derivados a partir de todas[]
    xpt.no_xpt    = xpt.todas.filter(r => r.status === 'no_xpt');
    xpt.a_caminho = xpt.todas.filter(r => r.status === 'a_caminho');
    xpt.em_curso  = xpt.todas.filter(r => r.status === 'em_curso');
    xpt.concluidas= xpt.todas.filter(r => r.status === 'concluida');
    xpt.extras    = xpt.todas.filter(r => r.tipo_entrega === 'me_extra');
    xpt.total     = xpt.todas.length;
    xpt.hoje      = xpt.todas.filter(r => !r.e_de_amanha);
  });

  return data;

  // ── Separação dia atual / próximo dia para XPTs D+1 ──────────────
  // Admin trata as rotas do "próximo dia" (com `>` oposto ao padrão de hoje)
  // como "A caminho do XPT" — são rotas chegando via Line Haul que ainda
  // não estão operando. Mesclamos elas em `hoje` com status=a_caminho pra
  // espelhar exatamente o que admin mostra com o filtro "A caminho do XPT".
  ['EBA32', 'EES2', 'EES5', 'EMG20'].forEach(xid => {
    const xpt = data.xpts?.[xid];
    if (!xpt) return;
    let noXptD1 = [];
    const seenNoXptD1 = new Set();
    [
      ...(Array.isArray(xpt.no_xpt_d1) ? xpt.no_xpt_d1 : []),
      ...(Array.isArray(xpt.amanha) ? xpt.amanha : []),
      ...(Array.isArray(xpt.proximo) ? xpt.proximo : []),
    ].forEach(r => {
      const key = String(r.id || r.id_rota || r.rota || JSON.stringify(r));
      if (seenNoXptD1.has(key)) return;
      seenNoXptD1.add(key);
      noXptD1.push({ ...r, status: 'no_xpt', e_de_amanha: true, _d1_no_xpt: true });
    });
    const sep = separateD1Routes(xpt);
    // Marca rotas do "próximo dia" como a_caminho (LH chegando)
    const marcadasAmanha = (xpt.todas || []).filter(r => r.e_de_amanha);
    const proximo = [];
    const seenProximo = new Set();
    [...sep.proximo, ...marcadasAmanha].forEach(r => {
      const key = String(r.id || r.id_rota || r.rota || JSON.stringify(r));
      if (seenProximo.has(key)) return;
      seenProximo.add(key);
      proximo.push(r);
    });
    const proximoD1 = proximo
      .filter(r => r.status !== 'concluida' && r.status !== 'em_curso')
      .map(r => ({ ...r, status: 'no_xpt', e_de_amanha: true, _d1_no_xpt: true }));
    noXptD1 = _dedupeD1Routes([...noXptD1, ...proximoD1]);
    const d1Keys = new Set(noXptD1.map(_d1RouteKey));
    xpt.hoje        = sep.hoje.filter(r => !r.e_de_amanha && !d1Keys.has(_d1RouteKey(r)));
    xpt.proximo     = noXptD1;
    xpt.amanha      = noXptD1;
    xpt.no_xpt_d1   = noXptD1;
    xpt.day_pattern = sep.pattern;
    // Recomputa arrays somente com rotas operacionais de hoje.
    xpt.no_xpt    = xpt.hoje.filter(r => r.status === 'no_xpt' && !r.e_de_amanha);
    xpt.a_caminho = xpt.hoje.filter(r => r.status === 'a_caminho' && !r.e_de_amanha);
    xpt.em_curso  = xpt.hoje.filter(r => r.status === 'em_curso');
    xpt.concluidas= xpt.hoje.filter(r => r.status === 'concluida');
    xpt.extras    = xpt.hoje.filter(r => r.tipo_entrega === 'me_extra');
    xpt.total     = xpt.hoje.length;
    if (['EBA32', 'EES2', 'EES5', 'EMG20'].includes(xid)) {
      const forceTodayNoXpt = _dedupeD1Routes([
        ...(Array.isArray(xpt.no_xpt_d1) ? xpt.no_xpt_d1 : []),
        ...(Array.isArray(xpt.amanha) ? xpt.amanha : []),
        ...(Array.isArray(xpt.proximo) ? xpt.proximo : []),
      ])
        .filter(r => String(r.substatus_api || r.sub_status || r.substatus || '').toLowerCase() === 'at_destination_facility')
        .map(r => ({ ...r, status: 'no_xpt', e_de_amanha: false, _d1_no_xpt: false }));
      if (forceTodayNoXpt.length) {
        const forceKeys = new Set(forceTodayNoXpt.map(_d1RouteKey));
        xpt.no_xpt_d1 = (xpt.no_xpt_d1 || []).filter(r => !forceKeys.has(_d1RouteKey(r)));
        xpt.amanha = xpt.no_xpt_d1;
        xpt.proximo = xpt.no_xpt_d1;
        xpt.todas = _dedupeD1Routes([...(xpt.todas || []), ...forceTodayNoXpt]);
        xpt.hoje = _dedupeD1Routes([...(xpt.hoje || []), ...forceTodayNoXpt]);
        xpt.no_xpt = xpt.hoje.filter(r => r.status === 'no_xpt' && !r.e_de_amanha);
        xpt.a_caminho = xpt.hoje.filter(r => r.status === 'a_caminho' && !r.e_de_amanha);
        xpt.em_curso = xpt.hoje.filter(r => r.status === 'em_curso');
        xpt.concluidas = xpt.hoje.filter(r => r.status === 'concluida');
        xpt.extras = xpt.hoje.filter(r => r.tipo_entrega === 'me_extra');
        xpt.total = xpt.hoje.length;
      }
    }
  });
  // XPTs D0: hoje = todas (sem separação)
  ['EES3', 'EES6'].forEach(xid => {
    const xpt = data.xpts?.[xid];
    if (!xpt) return;
    const d0ACaminho = _dedupeD1Routes([
      ...(Array.isArray(xpt.amanha) ? xpt.amanha : []),
      ...(Array.isArray(xpt.proximo) ? xpt.proximo : []),
      ...(Array.isArray(xpt.no_xpt_d1) ? xpt.no_xpt_d1 : []),
    ]).map(r => ({ ...r, status: 'a_caminho', e_de_amanha: false, _d1_no_xpt: false }));
    xpt.todas = _dedupeD1Routes([...(xpt.todas || []), ...d0ACaminho])
      .map(r => ({ ...r, e_de_amanha: false, _d1_no_xpt: false }));
    xpt.hoje = xpt.todas;
    xpt.no_xpt = xpt.hoje.filter(r => r.status === 'no_xpt');
    xpt.a_caminho = xpt.hoje.filter(r => r.status === 'a_caminho');
    xpt.em_curso = xpt.hoje.filter(r => r.status === 'em_curso');
    xpt.concluidas = xpt.hoje.filter(r => r.status === 'concluida');
    xpt.extras = xpt.hoje.filter(r => r.tipo_entrega === 'me_extra');
    xpt.total = xpt.hoje.length;
    xpt.proximo = [];
    xpt.amanha = [];
    xpt.no_xpt_d1 = [];
  });

  return data;
}

// Helper: monta URL da rota no admin do Mercado Livre
// ═══════════════════════════════════════════════════════════════
function adminRotaUrl(r) {
  if (!r) return null;
  if (typeof r === 'number' || typeof r === 'string') {
    const idOnly = String(r).replace(/[^\d]/g, '');
    return idOnly ? `https://envios.adminml.com/logistics/monitoring-distribution/detail/${idOnly}?site=MLB` : null;
  }
  const id = r.id_rota || r.idRota || r.route_id || r.routeId || r.id_admin
           || (typeof r.id === 'number' || /^\d+$/.test(String(r.id||'')) ? r.id : null);
  if (!id) return null;
  return `https://envios.adminml.com/logistics/monitoring-distribution/detail/${id}?site=MLB`;
}

// Helper: renderiza o nome da rota como link clicável (se houver ID)
// Mostra também o ID numérico da rota ao lado, no formato: NOME · #ID 🔗 [📋]
function rotaIdLink(r, opts) {
  opts = opts || {};
  const nome = (r && (r.rota || '')) || '';
  const safeNome = String(nome).replace(/"/g, '&quot;');
  // ID numérico da rota (pra mostrar e pra montar a URL)
  const rId = r && (r.id_rota || r.idRota || r.route_id || r.routeId || r.id_admin
                 || (typeof r.id === 'number' || /^\d+$/.test(String(r.id||'')) ? r.id : null));
  const url = adminRotaUrl(r);
  // Conteúdo: nome + badge do ID (se houver)
  const nomeHtml = safeNome ? `<span class="rota-id">${safeNome}</span>` : '';
  const idHtml = rId ? `<span class="rota-id-num">·&nbsp;#${rId}</span>` : '';
  // Se não tem nem nome nem ID, devolve string vazia
  if (!nomeHtml && !idHtml) return '';
  // Texto a copiar (sem HTML) — escape pra atributo HTML
  const copyTxt = `${(nome||'').replace(/&/g,'&amp;')}${rId ? ' #'+rId : ''}`.trim();
  const copyTxtAttr = copyTxt.replace(/'/g, '&#39;').replace(/"/g, '&quot;');
  const copyBtn = opts.copy === false ? '' :
    `<button type="button" class="rota-copy-btn" title="Copiar &quot;${copyTxtAttr}&quot;"
      onclick="event.preventDefault();event.stopPropagation();copyRotaText(this, '${copyTxtAttr}')">📋</button>`;
  // Se não tem URL (sem ID), devolve texto + copy
  if (!url) return `${nomeHtml}${idHtml}${copyBtn}`;
  const icon = opts.icon === false ? '' : '<span class="rota-link-icon">🔗</span>';
  const title = `Abrir rota ${safeNome || ('#'+rId)} no admin`;
  return `<a class="rota-link" href="${url}" target="_blank" rel="noopener noreferrer" title="${title}">${nomeHtml}${idHtml}${icon}</a>${copyBtn}`;
}

// Clipboard helpers
// ═══════════════════════════════════════════════════════════════
function _copyToClipboard(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(txt);
  }
  // Fallback (HTTP / cloudflare tunnel sem HTTPS estrito)
  return new Promise((resolve, reject) => {
    try {
      const ta = document.createElement('textarea');
      ta.value = txt; ta.style.position='fixed'; ta.style.left='-9999px';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
      resolve();
    } catch (e) { reject(e); }
  });
}

function copyRotaText(btn, txt) {
  _copyToClipboard(txt).then(() => {
    if (!btn) return;
    const orig = btn.textContent;
    btn.classList.add('copied');
    btn.textContent = '✓';
    setTimeout(() => { btn.classList.remove('copied'); btn.textContent = orig; }, 1200);
  }).catch(err => {
    console.error('Falha ao copiar:', err);
    alert('Não foi possível copiar pra área de transferência.');
  });
}

// Templates de mensagem por filtro/contexto
// Helper que monta a tag da rota: usa nome+id se houver nome, senão só #id
function _rotaTag(r) {
  const id = r.id_rota || r.idRota || r.route_id || r.routeId || r.id_admin ||
             (typeof r.id === 'number' || /^\d+$/.test(String(r.id||'')) ? r.id : '');
  const nome = (r.rota || '').trim();
  if (nome && id) return `${nome} #${id}`;
  if (nome) return nome;
  if (id) return `#${id}`;
  return '(sem identificação)';
}
// Cada template tem 3 formatos:
//   single(r) → mensagem completa pra UMA rota
//   header()  → cabeçalho pra MÚLTIPLAS rotas (lista vem abaixo)
//   line(r)   → texto de cada linha da lista (rotaTag + metrica relevante).
//               Se nao definir, cai no fallback `_rotaTag(r)` puro.
// Helper local pra formatar minutos como Xh Ymin (compatibilidade caso fmtMin nao exista no escopo)
const _fmtMinSafe = (m) => {
  const n = Number(m||0); if (!n) return '0min';
  const h = Math.floor(n/60), mm = n%60;
  return h > 0 ? (mm > 0 ? `${h}h${String(mm).padStart(2,'0')}` : `${h}h`) : `${mm}min`;
};

/**
 * Converte 'DD/MM/AAAA HH:MM:SS' (formato de latest.atualizado, gerado pelo
 * bot em Python) para um objeto Date real. new Date() do navegador NAO
 * entende esse formato de forma confiavel entre navegadores — por isso o
 * badge de Online/Offline precisa dessa conversao explicita em vez de
 * confiar em new Date(latest.atualizado) direto.
 */
function _parseDataBotBR(str) {
  if (!str) return null;
  const m = String(str).match(/^(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})$/);
  if (!m) return null;
  const [, dd, mm, yyyy, hh, mi, ss] = m;
  const d = new Date(`${yyyy}-${mm}-${dd}T${hh}:${mi}:${ss}`);
  return isNaN(d.getTime()) ? null : d;
}

/**
 * Converte o formato latest.json (monitor_rotas.py v3.2)
 * para o formato esperado pelo Relatorio_Expedicoes.html
 */
function latestToRelatorio(latest) {
  // ── FILTRO POR STATION ───────────────────────────────────────
  // Guarda payload completo antes de filtrar e aplica filtro pela
  // station ativa. Isso e' feito ANTES de construir data.xpts/svc/nex,
  // entao todo o downstream ja recebe so a station correta.
  window._rawDadosFull = latest;
  _applyStationFilter();
  latest = window._rawDados || latest;

  // ── XPTs: mapeado de xpts_expedicao ──────────────────────────
  const xpts = {};
  for (const [xid, xdata] of Object.entries(latest.xpts_expedicao || {})) {
    // Cada rota em xdata.todas já tem os campos certos (status, rota, motorista, etc)
    const cfg = xdata.config || {};
    const fixedD1 = (cfg.tipo === 'D+1') ? _fixD1ByArrowMajority(xdata) : null;
    xpts[xid] = {
      config:     cfg,
      tipo:       cfg.tipo || 'D0',
      nome:       cfg.nome || xid,
      todas:      fixedD1 ? fixedD1.todas     : (xdata.todas     || []),
      no_xpt:     fixedD1 ? fixedD1.no_xpt    : (xdata.no_xpt    || []),
      no_xpt_d1:  fixedD1 ? fixedD1.no_xpt_d1 : (xdata.no_xpt_d1 || []),
      a_caminho:  fixedD1 ? fixedD1.a_caminho : (xdata.a_caminho || []),
      em_curso:   xdata.em_curso  || [],
      concluidas: xdata.concluidas|| [],
      extras:     xdata.extras    || [],
      amanha:     fixedD1 ? fixedD1.amanha    : (xdata.amanha    || []),
      proximo:    fixedD1 ? fixedD1.proximo   : (xdata.proximo   || []),
      total:      (fixedD1 ? fixedD1.todas : (xdata.todas || [])).length,
    };
  }

  // ── SVC routes: cria objetos sintéticos a partir de reporte_svc ──
  // Usado pela tabela MLPs do SVC
  const svcTodas = [];
  (latest.reporte_svc?.linhas || []).forEach(l => {
    const pkg = l.pacotes || 0;
    const ent = l.entregues || Math.round((l.ds||0) * pkg / 100);
    const fal = l.falhas || 0;
    svcTodas.push({
      transportadora: l.transportadora,
      status: 'em_curso',
      total:     pkg,
      entregues: ent,
      falhas:    fal,
      pendentes: Math.max(0, pkg - ent - fal),
    });
  });

  // ── NEX: mapeado de xpts_expedicao para origens NEX ──────────
  // Inclui SES3 (BRNES73/124/464, BRDES73) + SES2 (BRNES10, BRNES87, BRNES6769).
  // O filtro de station ja foi aplicado upstream em _applyStationFilter,
  // entao so chegam aqui os NEX da station ativa.
  const nex = {};
  const NEX_IDS = new Set([
    // SES3
    'BRNES124','BRNES73','BRNES464','BRDES73','BRDES6818',
    // SES2
    'BRNES10','BRNES87','BRNES6769'
  ]);
  for (const [xid, xdata] of Object.entries(latest.xpts_expedicao || {})) {
    if (NEX_IDS.has(xid)) nex[xid] = xdata;
  }

  // (O filtro de station ja foi aplicado no inicio de latestToRelatorio).
  // Atualiza o titulo do header pra refletir a station ativa
  try {
    const h = document.querySelector('.header-left h1');
    if (h) h.textContent = `Bot 2.0 📦 Monitor de Expedições e Performance — ${_currentStation}`;
    _updateStationToggleUI();
  } catch(e){}

  return {
    extraido_em:    (_parseDataBotBR(latest.atualizado) || new Date()).toISOString(),
    extraido_em_br: latest.atualizado || '',
    service_center: _currentStation,
    xpts:           xpts,
    svc:            { todas: svcTodas },

// ─── Snapshot da UI antes de re-render (preserva contexto do usuário) ───
function _snapshotUIState() {
  const snap = {
    activeTab: activeTab || _loadSavedActiveTab(),
    station: _currentStation,
    scrollX: window.scrollX || window.pageXOffset || 0,
    scrollY: window.scrollY || window.pageYOffset || 0,
    controls: {},
    filtros: {},
    quick: {
      andamentoFilter: typeof _andamentoFilter !== 'undefined' ? _andamentoFilter : 'todas',
      andamentoExtraFilter: typeof _andamentoExtraFilter !== 'undefined' ? _andamentoExtraFilter : 'todas',
      andamentoOrhFilter: typeof _andamentoOrhFilter !== 'undefined' ? _andamentoOrhFilter : 'todas',
      repSubTab: typeof _repSubTab !== 'undefined' ? _repSubTab : _loadSavedRepSubTab(),
      hhView: _getHoraHoraView(),
    },
  };

  document.querySelectorAll('input[id], select[id], textarea[id]').forEach(el => {
    if (el.type === 'file') return;
    snap.controls[el.id] = {
      tag: el.tagName,
      type: el.type || '',
      value: el.value,
      checked: !!el.checked,
    };
  });

  _xptsForStation().forEach(xid => {
    const s = document.getElementById('search-' + xid);
    const st = document.getElementById('status-' + xid);
    const c = document.getElementById('carrier-' + xid);
    if (s || st || c) {
      snap.filtros[xid] = {
        search: s ? s.value : '',
        status: st ? st.value : '',
        carrier: c ? c.value : '',
      };
    }
  });

  const ae = document.activeElement;
  if (ae && ae.id) {
    snap.focoId = ae.id;
    if (typeof ae.selectionStart === 'number') {
      snap.selectionStart = ae.selectionStart;
      snap.selectionEnd = ae.selectionEnd;
    }
  }
  return snap;
}

function _getHoraHoraView() {
  const desempenho = document.getElementById('hh-view-desempenho');
  if (desempenho && desempenho.style.display !== 'none') return 'desempenho';
  return 'tabela';
}

function _dispatchRestoreEvents(el) {
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
}

function _restoreUIState(snap) {
  if (!snap) return;

  if (snap.quick) {
    if (typeof _andamentoFilter !== 'undefined') _andamentoFilter = snap.quick.andamentoFilter || _andamentoFilter || 'todas';
    if (typeof _andamentoExtraFilter !== 'undefined') _andamentoExtraFilter = snap.quick.andamentoExtraFilter || _andamentoExtraFilter || 'todas';
    if (typeof _andamentoOrhFilter !== 'undefined') _andamentoOrhFilter = snap.quick.andamentoOrhFilter || _andamentoOrhFilter || 'todas';
    if (typeof _repSubTab !== 'undefined') _repSubTab = snap.quick.repSubTab || _repSubTab || 'xpt';
  }

  const wantedTab = snap.activeTab || activeTab;
  if (wantedTab && document.getElementById('tab-' + wantedTab)) {
    switchTab(wantedTab);
  }

  Object.entries(snap.controls || {}).forEach(([id, state]) => {
    const el = document.getElementById(id);
    if (!el || el.type === 'file') return;
    if (el.tagName === 'SELECT') {
      const exists = Array.from(el.options || []).some(o => o.value === state.value);
      if (!exists && state.value) return;
      el.value = state.value || '';
    } else if (el.type === 'checkbox' || el.type === 'radio') {
      el.checked = !!state.checked;
    } else {
      el.value = state.value || '';
    }
    _dispatchRestoreEvents(el);
  });

  Object.entries(snap.filtros || {}).forEach(([xid, f]) => {
    const s = document.getElementById('search-' + xid);
    const st = document.getElementById('status-' + xid);
    const c = document.getElementById('carrier-' + xid);
    if (s) { s.value = f.search || ''; _dispatchRestoreEvents(s); }
    if (st) { st.value = f.status || ''; _dispatchRestoreEvents(st); }
    if (c) { c.value = f.carrier || ''; _dispatchRestoreEvents(c); }
  });

  if (snap.quick) {
    if (document.getElementById('panel-andamento') && typeof setAndamentoFilter === 'function') {
      setAndamentoFilter(snap.quick.andamentoFilter || 'todas');
      if (typeof setAndamentoExtraFilter === 'function') setAndamentoExtraFilter(snap.quick.andamentoExtraFilter || 'todas');
      if (typeof setAndamentoOrhFilter === 'function') setAndamentoOrhFilter(snap.quick.andamentoOrhFilter || 'todas');
    }
    if (document.getElementById('panel-reporte') && typeof renderReporteTab === 'function') {
      _repSubTab = snap.quick.repSubTab || _repSubTab || 'xpt';
      _syncRepSubTabButtons(_repSubTab);
      renderReporteTab();
    }
    if (document.getElementById('panel-horahora') && typeof switchHhSubTab === 'function') {
      switchHhSubTab(snap.quick.hhView || 'tabela');
    }
  }

  const restoreFocus = () => {
    if (!snap.focoId) return;
    const el = document.getElementById(snap.focoId);
    if (el && typeof el.focus === 'function') {
      el.focus();
      if (typeof el.setSelectionRange === 'function' && typeof snap.selectionStart === 'number') {
        try { el.setSelectionRange(snap.selectionStart, snap.selectionEnd ?? snap.selectionStart); } catch(e) {}
      }
    }
  };
  const restoreScroll = () => {
    if (typeof snap.scrollY === 'number') {
      window.scrollTo({ left: snap.scrollX || 0, top: snap.scrollY, behavior: 'auto' });
    }
  };

  restoreScroll();
  restoreFocus();
  requestAnimationFrame(() => {
    restoreScroll();
    restoreFocus();
    setTimeout(() => {
      restoreScroll();
      restoreFocus();
    }, 60);
    setTimeout(() => {
      restoreScroll();
      restoreFocus();
    }, 250);
    setTimeout(() => {
      restoreScroll();
      restoreFocus();
    }, 600);
  });
}

function _restoreUIStateDeferred(snap) {
  requestAnimationFrame(() => _restoreUIState(snap));
}

function _syncRepSubTabButtons(activeSub) {
  const wrap = document.getElementById('rep-sub-tabs');
  if (!wrap) return;
  wrap.querySelectorAll('.rep-sub-btn').forEach(btn => {
    const attr = btn.getAttribute('onclick') || '';
    const isActive = attr.includes(`'${activeSub}'`) || attr.includes(`"${activeSub}"`);
    btn.classList.toggle('rep-sub-active', isActive);
    if (isActive) {
      btn.style.background = 'var(--blue)';
      btn.style.color = '#fff';
      btn.style.border = 'none';
    } else {
      btn.style.background = 'var(--bg3)';
      btn.style.color = 'var(--text)';
      btn.style.border = '1px solid var(--border)';
    }
  });
}

function _triggerRefreshPreservingUI() {
  const snap = _snapshotUIState();
  return fetchLatest(snap);
}

function _installRefreshPreserveHandlers() {
  document.querySelectorAll('button, a').forEach(el => {
    const txt = (el.textContent || '').toLowerCase();
    const attr = String(el.getAttribute('onclick') || '');
    if (attr.includes('fetchLatest') || txt.includes('atualizar dados') || txt.includes('recarregar')) {
      if (attr.includes('fetchLatest')) el.setAttribute('onclick', '_triggerRefreshPreservingUI()');
      if (!el.dataset.preserveRefreshBound) {
        el.dataset.preserveRefreshBound = '1';
        el.addEventListener('click', () => {
          window._pendingUiSnap = _snapshotUIState();
        }, true);
      }
    }
  });
}

function _csvSafe(v) {
  let s = String(v == null ? '' : v);

  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;

  if (/[;,"\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}

  }

  // Cria índice route_id → {rota, motorista, origem(XPT)} a partir do latest.json
  // BUG FIX: o campo do bot é `id_rota`, não `id`. Também aceita `id` como fallback.
  const rawAll = (window._rawDados?.todas_dia || window._rawDados?.top_geral || []);
  const idxRota = {};
  rawAll.forEach(r => {
    const k = r.id_rota || r.id;
    if (k != null) idxRota[String(k)] = r;
  });
  console.log('CSV: rotas indexadas do bot =', Object.keys(idxRota).length, '| pacotes BQ =', detalhe.itens.length);

  // Header + linhas (todas sanitizadas via _csvSafe)
  const linhas = [['Pacote_ID', 'Motorista', 'XPT', 'Rota', 'Transportadora', 'Motivo']];

  detalhe.itens.forEach(it => {
    const r = idxRota[String(it.rota_id)] || {};
    linhas.push([
      it.pacote_id || '',
      it.motorista || r.motorista || '',
      r.origem || '',
      r.rota || '',
      r.transportadora || '',
      it.motivo || '',
    ]);
  });

  // CSV com separador `;` (Excel BR) e BOM (acentos)
  const csv = '﻿' + linhas.map(l => l.map(_csvSafe).join(';')).join('\r\n');

  // Nome do arquivo sanitizado — só [A-Za-z0-9_.-], previne path injection
  const dataRaw = (detalhe.data || new Date().toISOString().slice(0,10));
  const dataSafe = dataRaw.replace(/[^0-9]/g, '');
  const nome = ('insucessos_SES3_' + dataSafe + '.csv').replace(/[^A-Za-z0-9_.\-]/g, '_');

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nome;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
  console.log('✅ CSV baixado:', nome, '|', detalhe.itens.length, 'pacotes');
}

async function baixarCSVInsucessosOntem(btn) {

// ── VERSAO PUBLICA (GitHub Pages) ─────────────────────────────
// A chave abaixo NAO e uma senha de usuario — e uma chave AES-256
// gerada localmente pelo bot (site_key.txt) so pra impedir que o
// arquivo data.enc.json seja legivel fora desta pagina (cache de
// busca, navegacao direta do repositorio, etc). Quem tem o link
// desta pagina ve o dashboard normalmente, sem digitar nada.
const _PUB_SITE_KEY_B64 = "d9R/l9xo7jQM+VDnNskIngLKLLaV7saQ70iM9iR7Kf4=";

async function _pubDecryptLatest() {
  const r = await fetch('./data.enc.json?_t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const envelope = await r.json();
  const keyBytes = Uint8Array.from(atob(_PUB_SITE_KEY_B64), c => c.charCodeAt(0));
  const iv = Uint8Array.from(atob(envelope.iv), c => c.charCodeAt(0));
  const ct = Uint8Array.from(atob(envelope.data), c => c.charCodeAt(0));
  const key = await crypto.subtle.importKey('raw', keyBytes, 'AES-GCM', false, ['decrypt']);
  const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  return JSON.parse(new TextDecoder('utf-8').decode(plainBuf));
}

async function fetchLatest(preservedSnap) {
  const _uiSnap = preservedSnap || window._pendingUiSnap || _snapshotUIState();

function parseCSV(text) {
  // Parser CSV robusto (suporta campos com vírgula entre aspas)
  const lines = [];
  let inQ = false, cur = '', row = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') { inQ = !inQ; }
    else if (ch === ',' && !inQ) { row.push(cur.trim()); cur = ''; }
    else if ((ch === '\n' || ch === '\r') && !inQ) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      row.push(cur.trim()); cur = '';
      if (row.some(c => c !== '')) lines.push(row);
      row = [];
    } else { cur += ch; }
  }
  if (row.length) { row.push(cur.trim()); if (row.some(c => c !== '')) lines.push(row); }
  return lines;
}

function normalizeModal(raw) {
  const s = (raw || '').toLowerCase();
  if (s.includes('van') || s.includes('furgão') || s.includes('furgao')) return 'Van';
  if (s.includes('utili')) return 'Utilitário';
  if (s.includes('vuc') || s.includes('caminhão') || s.includes('caminhao')) return 'Vuc';
  if (s.includes('passeio') || s.includes('carro')) return 'Passeio';
  if (s.includes('moto') || s.includes('bike')) return 'Moto';
  return raw || '?';
}
