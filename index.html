// ─── CROSS-REFERENCE ME EXTRA ─────────────────────────────────────
function buildExtraCrossRef(data, config) {
  // Precisa de pelo menos uma fonte de dados
  if (!config && !montagemData) return null;

  const result = { eba32: [], nex: {}, totais: { planejado: 0, aceito: 0, pendente: 0 } };

  // ── Lookup logistics EBA32 (todas as rotas, não só me_extra — a montagem sabe quais são Extra) ──
  const eba32Lookup = {};
  (data.xpts?.EBA32?.todas || []).forEach(r => {
    if (!r.rota) return;
    const key = r.rota.replace(/^>/, '').toLowerCase();
    eba32Lookup[key] = r;
  });

  // ── Lookup de aceites da montagem ──
  const montagemLookup = {};
  if (montagemData) {
    (montagemData.rotas || []).forEach(m => {
      if (!m.rota) return;
      montagemLookup[m.rota.toLowerCase()] = m;
    });
  }

  // ── FONTE PRINCIPAL: montagem (quando carregada) ──────────────────
  if (montagemData) {
    const montagemKeys = new Set();
    (montagemData.rotas || []).forEach(m => {
      if (!m.rota) return;
      const key = m.rota.toLowerCase();
      montagemKeys.add(key);
      const lr = eba32Lookup[key];
      const emRota = lr && (lr.status === 'em_curso' || lr.status === 'concluida' || (lr.hora_primeiro_mov && lr.hora_primeiro_mov !== '-'));
      const statusFinal = emRota ? 'em_rota' :
        (lr?.status === 'no_xpt') ? 'aceito_no_xpt' :
        (lr ? lr.status : 'aceito_sem_scan');

      result.eba32.push({
        planejada:   m.rota,
        executada:   m.rota,
        modal:       m.modal_key || m.tipo || '—',
        pacotes:     0,
        bairros:     '',
        cidades:     '',
        kms:         0,
        orh_plan:    '',
        motorista:   m.nome,
        placa:       m.placa || lr?.placa || null,
        hora_inicio: lr?.hora_inicio || null,
        hora_mov:    lr?.hora_primeiro_mov || null,
        etaMontagem: m.eta || null,
        isMontagem:  true,
        status:      statusFinal,
        logRoute:    lr || null,
      });
      result.totais.planejado++;
      if (emRota) result.totais.aceito++; else result.totais.pendente++;
    });

    // Rotas ME Extra no logistics que NÃO estão na montagem = sem aceite
    (data.xpts?.EBA32?.todas || [])
      .filter(r => r.tipo_entrega === 'me_extra' && r.rota)
      .forEach(r => {
        const key = r.rota.replace(/^>/, '').toLowerCase();
        if (montagemKeys.has(key)) return; // já processada
        const emRota = r.status === 'em_curso' || r.status === 'concluida' || (r.hora_primeiro_mov && r.hora_primeiro_mov !== '-');
        result.eba32.push({
          planejada:   r.rota,
          executada:   r.rota,
          modal:       r.veiculo || '—',
          pacotes:     r.total || 0,
          bairros:     '',
          cidades:     '',
          kms:         0,
          orh_plan:    '',
          motorista:   (r.motorista && r.motorista !== '-') ? r.motorista : null,
          placa:       r.placa || null,
          hora_inicio: r.hora_inicio || null,
          hora_mov:    r.hora_primeiro_mov || null,
          etaMontagem: null,
          isMontagem:  false,
          status:      emRota ? 'em_rota' : 'sem_aceite',
          logRoute:    r,
        });
        result.totais.planejado++;
        result.totais.pendente++;
      });

  // ── FALLBACK: planejamento_extra.json (sem montagem) ─────────────
  } else if (config) {
    (config.eba32 || []).forEach(plan => {
      const key = plan.executada.toLowerCase();
      const lr  = eba32Lookup[key];
      const temMotorista = lr && lr.motorista && lr.motorista !== '-';
      const emRota = lr && (lr.status === 'em_curso' || (lr.hora_primeiro_mov && lr.hora_primeiro_mov !== '-'));
      const statusFinal = emRota ? 'em_rota' :
        (lr?.status === 'no_xpt') ? 'no_xpt' :
        (lr ? lr.status : 'sem_aceite');

      result.eba32.push({
        planejada:   plan.planejada,
        executada:   plan.executada,
        modal:       plan.modal,
        pacotes:     plan.pacotes,
        bairros:     plan.bairros || '',
        cidades:     plan.cidades || '',
        kms:         plan.kms    || 0,
        orh_plan:    plan.orh_plan || '',
        motorista:   temMotorista ? lr.motorista : null,
        placa:       lr?.placa || null,
        hora_inicio: lr?.hora_inicio || null,
        hora_mov:    lr?.hora_primeiro_mov || null,
        etaMontagem: null,
        isMontagem:  false,
        status:      statusFinal,
        logRoute:    lr || null,
      });
      result.totais.planejado++;
      if (temMotorista) result.totais.aceito++; else result.totais.pendente++;
    });
  }

  // ── NEX: planned (AM1_1_1) matched by order/modal to logistics ──
  // NEX routes usam IDs numéricos no logistics; o match é feito por modal e ordem
  Object.entries(config?.nex || {}).forEach(([nid, nexCfg]) => {
    const nexRoutes = (data.nex?.[nid]?.todas || []).filter(r => r.tipo_entrega === 'me_extra');
    // Separar por tipo modal
    const byModal = {};
    nexRoutes.forEach(r => {
      const vei = (r.veiculo || '').toLowerCase();
      const isMoto = vei.includes('moto') || vei.includes('bike') || vei.includes('ciclomotor');
      const mKey = isMoto ? 'moto' : 'passeio';
      if (!byModal[mKey]) byModal[mKey] = [];
      byModal[mKey].push(r);
    });
    // Contadores para match sequencial
    const usedIdx = { moto: 0, passeio: 0 };

    const rows = (nexCfg.rotas || []).map(plan => {
      const isMoto  = plan.modal.toLowerCase().includes('moto');
      const mKey    = isMoto ? 'moto' : 'passeio';
      const lr      = byModal[mKey] ? byModal[mKey][usedIdx[mKey]++] : null;
      const temMotorista = lr && lr.motorista && lr.motorista !== '-';
      const emRota  = lr && (lr.status === 'em_curso' || (lr.hora_primeiro_mov && lr.hora_primeiro_mov !== '-'));
      result.totais.planejado++;
      if (temMotorista) result.totais.aceito++; else result.totais.pendente++;
      return {
        planejada:  plan.planejada,
        modal:      plan.modal,
        pacotes:    plan.pacotes,
        nex:        nexCfg.nome,
        motorista:  temMotorista ? lr.motorista : null,
        placa:      lr?.placa || null,
        hora_mov:   lr?.hora_primeiro_mov || null,
        status:     emRota ? 'em_rota' : (lr?.status === 'no_xpt' ? 'no_xpt' : (lr ? lr.status : 'sem_aceite')),
        logRoute:   lr || null,
      };
    });
    result.nex[nid] = { nome: nexCfg.nome, rotas: rows };
  });

  return result;
}

function statusRowClass(status) {
  if (status === 'em_rota' || status === 'concluida') return 'row-ok';
  if (status === 'sem_aceite') return 'row-pendente';
  if (status === 'no_xpt') return 'row-atencao';
  if (status === 'aceito_no_xpt' || status === 'aceito_sem_scan') return 'row-atencao';
  return '';
}

function statusBadgeExtra(status, pastAlert) {
  switch(status) {
    case 'em_rota':    return '<span class="badge badge-verde">✅ Em rota</span>';
    case 'concluida':  return '<span class="badge badge-verde">✅ Concluída</span>';
    case 'no_xpt':     return pastAlert
      ? '<span class="badge badge-vermelho" style="background:var(--red-bg);color:var(--red);border-color:var(--red-border);">🚨 Não carregou</span>'
      : '<span class="badge badge-amarelo" style="background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border);">⏳ Aguardando</span>';
    case 'sem_aceite': return '<span class="badge badge-roxo" style="background:var(--purple-bg);color:var(--purple);border-color:var(--purple-border);">🔵 Sem aceite</span>';
    case 'aceito_no_xpt':
      return pastAlert
        ? '<span class="badge badge-vermelho">🚨 Aceito · Não carregou</span>'
        : '<span class="badge badge-amarelo" style="background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border);">⏳ Aceito · Aguardando carga</span>';
    case 'aceito_sem_scan':
      return pastAlert
        ? '<span class="badge badge-vermelho">🚨 Aceito · Sem scan</span>'
        : '<span class="badge badge-amarelo" style="background:var(--yellow-bg);color:var(--yellow);border-color:var(--yellow-border);">⏳ Aceito · Sem scan</span>';
    default:           return '<span class="badge" style="color:var(--text3);">—</span>';
  }
}

  const aceitos   = rows.filter(r => r.motorista).length;
  const pendentes = rows.filter(r => !r.motorista).length;

  const statsHtml = `
    <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
      <div class="extra-stat"><div class="val" style="color:var(--purple)">${totalPlan}</div><div class="lbl">Planejadas</div></div>
      <div class="extra-stat"><div class="val" style="color:var(--green)">${aceitos}</div><div class="lbl">Com motorista</div></div>
      <div class="extra-stat"><div class="val" style="color:${pastAlert && pendentes ? 'var(--red)' : 'var(--yellow)'}">${pendentes}</div><div class="lbl">Pendentes${pastAlert && pendentes ? ' ⚠️' : ''}</div></div>
    </div>`;

  const rows_html = rows.map(r => {
    const execCol = r.executada
      ? `<span class="exec-code">${r.executada}</span>`
      : '<span style="color:var(--text3)">—</span>';
    const temMov    = r.hora_mov    && r.hora_mov    !== '-';

    return `
      <tr class="${statusRowClass(r.status)}">
        <td><span class="plan-code">${r.planejada}</span></td>
        <td>${execCol}${bairroTxt}</td>
        <td style="color:var(--text2);font-size:11px;white-space:nowrap;">${r.modal || '—'}${r.kms ? `<div style="font-size:10px;color:var(--text3);">${r.kms.toFixed(1)} km</div>` : ''}</td>
        <td style="text-align:center;">${r.pacotes || '—'}</td>
        <td>${r.motorista
          ? (r.isMontagem
              ? `<span style="color:var(--yellow);font-weight:500;">📱 ${r.motorista}</span><div style="font-size:10px;color:var(--text3);">aceite TM · aguard. scan</div>`
              : `<span style="color:#111827;font-weight:500;">${r.motorista}</span>`)
          : '<span style="color:var(--text3);font-style:italic;">Sem aceite</span>'}</td>
        <td style="color:var(--text3);font-size:11px;font-family:monospace;">${r.placa || '—'}</td>
        <td style="font-family:monospace;font-size:11px;">
          <div style="color:${temInicio ? 'var(--blue)' : 'var(--text3)'};" title="Hora início (bipa)">${temInicio ? r.hora_inicio : '—'}</div>
          <div style="color:${temMov ? 'var(--green)' : 'var(--text3)'}; font-size:10px;" title="1º movimento GPS">${temMov ? '▶ '+r.hora_mov : ''}</div>
          ${r.etaMontagem ? `<div style="color:var(--purple);font-size:10px;" title="ETA Montagem (TM)">📱 ${r.etaMontagem}</div>` : ''}
        </td>
        <td>${statusBadgeExtra(r.status, pastAlert)}</td>
      </tr>`;
  }).join('');

  container.innerHTML = statsHtml + `
    <div style="overflow-x:auto;">
      <table class="crossref-table">
        <thead>
          <tr>
            <th>Rota Planejada</th>
            <th>Rota Executada / Área</th>
            <th>Modal / Kms</th>
            <th style="text-align:center;">Pkgs</th>
            <th>Motorista</th>
            <th>Placa</th>
            <th>Início / Mov / ETA</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>${rows_html}</tbody>
      </table>
    </div>`;
}

//  RENDERIZAÇÃO DO DASHBOARD
// ═══════════════════════════════════════════════════════════════
function renderDashboard(data) {
  // Auto-load: dashboard always visible

  document.getElementById('headerSubtitle').textContent = 'Service Center: ' + (data.service_center || 'SES3');

  // ── Staleness ticker ──────────────────────────────────────────
  if (_stalenessInterval) clearInterval(_stalenessInterval);
  const extractedAt = data.extraido_em ? new Date(data.extraido_em) : null;

  function tickStaleness() {
    const badge = document.getElementById('tsBadge');
    if (!extractedAt) { badge.textContent = '🔴 Offline'; badge.className = 'ts-badge stale-danger'; badge.title = 'Sem dados do bot'; return; }
    const minAgo = Math.floor((Date.now() - extractedAt) / 60000);
    const timeStr = extractedAt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    // Bot atualiza a cada 3 min. Tolerância: <= 6 min = online; > 6 min = offline.
    if (minAgo <= 6) {
      badge.textContent = '🟢 Online';
      badge.className = 'ts-badge';
      badge.title = 'Recebendo dados — última extração ' + timeStr + ' (' + minAgo + 'min atrás)';
    } else if (minAgo <= 15) {
      badge.textContent = '🟡 Atrasado';
      badge.className = 'ts-badge stale-warn';
      badge.title = 'Última extração ' + timeStr + ' (' + minAgo + 'min atrás) — possível atraso na coleta';
    } else {
      badge.textContent = '🔴 Offline';
      badge.className = 'ts-badge stale-danger';
      badge.title = 'Sem atualização há ' + minAgo + 'min — última extração ' + timeStr;
    }
  }

  tickStaleness();
  _stalenessInterval = setInterval(tickStaleness, 30000);
  // ─────────────────────────────────────────────────────────────

  renderAlerts(data);
  renderSummaryPanel(data);
  renderXPTCards(data);
  renderTabs(data);
}

// ─── ALERTS ─────────────────────────────────────────────────────
function renderAlerts(data) {
  const bar = document.getElementById('alertsBar');
  bar.innerHTML = '';
  const alerts = computeAlerts(data);
  alerts.forEach(a => {
    const div = document.createElement('div');
    div.className = 'alert-item alert-' + a.level;
    div.innerHTML = `<span class="alert-icon">${a.icon}</span> <strong>${a.xpt}:</strong> ${a.msg}`;
    bar.appendChild(div);
  });
}

function computeAlerts(data) {
  const alerts = [];
  const now = new Date(data.extraido_em);
  const hhmm = (h, m) => h * 60 + m;
  const nowMin = hhmm(now.getHours(), now.getMinutes());

  for (const [xid, xpt] of Object.entries(data.xpts)) {
    const cfg = XPT_CONFIG[xid] || {};
    const total = xpt.total || 0;
    const no_xpt = (xpt.no_xpt || []).length;
    const em_curso = (xpt.em_curso || []).length;
    const a_caminho = (xpt.a_caminho || []).length;

    if (cfg.tipo === 'D+1') {
      // LM deadline 12:00 → alertar se há rotas no_xpt após 11:00
      if (nowMin >= hhmm(11, 0) && no_xpt > 0) {
        const deadlineLm = cfg.horario_lm_fim || '12:00';
        alerts.push({ level: 'red', icon: '🚨', xpt: xid + ' ' + cfg.nome, msg: `${no_xpt} rota(s) ainda NO XPT! Deadline LM: ${deadlineLm}` });
      }
      // Extra alert
      if (cfg.tem_extra && nowMin >= hhmm(10, 30)) {
        const extras_no_xpt = (xpt.extras || []).filter(r => r.status === 'no_xpt');
        if (extras_no_xpt.length > 0) {
          const nomes = extras_no_xpt.map(r => r.rota).join(', ');
          alerts.push({ level: 'red', icon: '⚠️', xpt: xid + ' Extra', msg: `${extras_no_xpt.length} rota(s) Extra não carregou após 10:30! (${nomes})` });
        }
      }
    }

    if (cfg.tipo === 'D0') {
      // Alertar se nenhuma rota em_curso após a janela de chegada + expedição
      if (xid === 'EES6' && nowMin >= hhmm(13, 20) && em_curso === 0) {
        alerts.push({ level: 'red', icon: '🚨', xpt: xid + ' ' + cfg.nome, msg: `Nenhuma rota em LM! Janela de chegada: ${cfg.janela_chegada}` });
      }
      if (xid === 'EES3' && nowMin >= hhmm(12, 20) && em_curso < 3) {
        alerts.push({ level: 'yellow', icon: '⚠️', xpt: xid + ' ' + cfg.nome, msg: `Apenas ${em_curso} rota(s) em LM. Verificar chegada das carretas.` });
      }
    }
  }
  return alerts;
}

// ─── XPT CARDS (2×2 + sidebar) ──────────────────────────────────
function renderXPTCards(data) {
  const container = document.getElementById('xptCards');
  if (!container) return;
  const xptOrder = _xptsForStation();

  // ── MLP stats: usa _reporte_svc (latest.json) se disponível ────
  const mlpStats = {};
  const _mlpTotal = (s) => Number(s.pkg || 0) + Number(s.sac || 0);
  const _mlpSucesso = (s) => {
    const total = _mlpTotal(s);
    const ent = Number(s.ent || 0);
    const fal = Number(s.fal || 0);
    const pen = Number(s.pen || 0);
    const derivado = Math.max(0, total - fal - pen);
    const tolerancia = Math.max(2, Math.round(total * 0.01));
    if (ent > 0 && Math.abs((ent + fal + pen) - total) <= tolerancia) return ent;
    return derivado;
  };
  if (data._reporte_svc?.linhas?.length) {
    // Fonte primária: dados pré-agregados do monitor_rotas.py
    data._reporte_svc.linhas.forEach(l => {
      const pkg = l.pacotes || 0;
      const sac = l.sacas || 0;
      const fal = l.falhas || 0;
      const pen = l.pendentes || 0;
      const ent = l.entregues != null ? l.entregues : Math.max(0, pkg + sac - fal - pen);
      mlpStats[l.transportadora] = {
        rotas: l.rotas || 0,
        pkg:   pkg,
        sac:   sac,
        ent:   ent,
        fal:   fal,
        pen:   pen,
      };
    });
  } else {
    // Fallback: computa de svc.todas (formato bookmarklet)
    (data.svc?.todas||[]).filter(r => r.status !== 'a_caminho').forEach(r => {
      const k = r.transportadora || 'Outros';
      if (!mlpStats[k]) mlpStats[k] = { rotas: 0, pkg: 0, sac: 0, ent: 0, fal: 0, pen: 0 };
      const m = mlpStats[k];
      const sac = r.sacas || 0;
      const pkg = r.pacotes != null ? r.pacotes : Math.max(0, (r.total||0) - sac);
      m.rotas++; m.pkg += pkg; m.sac += sac; m.ent += r.entregues||0;
      m.fal += r.falhas||0; m.pen += r.pendentes||0;
    });
  }
  const priorityMLPs = ['Hawk Transportes', 'Parceiro Spot Soluções', 'Parceiro', 'Deluna', 'On Time Serviços', 'ONTIME', 'Envios Extra', 'Agencias Kangu'];
  const mlpKeys = [
    ...priorityMLPs.filter(k => mlpStats[k]),
    ...Object.keys(mlpStats).filter(k => !priorityMLPs.includes(k)).sort()
  ];

  // ── XPT summary stats ───────────────────────────────────────────
  const xptSums = xptOrder.map(xid => {
    const xpt = data.xpts[xid]; if (!xpt) return null;
    const cfg = XPT_CONFIG[xid] || {};
    const rotas = (xpt.hoje || xpt.todas || []).filter(r => r.status !== 'a_caminho');
    const pkg = rotas.reduce((s,r) => s+(r.total||0), 0);
    const ent = rotas.reduce((s,r) => s+(r.entregues||0), 0);
    return { xid, cfg, n: rotas.length, pkg, ds: pkg > 0 ? ent/pkg*100 : 0 };
  }).filter(Boolean);

  // ── Global LM totals ────────────────────────────────────────────
  // Ciclo SD: rotas ativas (em_curso) com cycleName exatamente 'SD'
  // Exclui 'concluida' (oficialmente encerradas) e 'a_caminho'/'no_xpt' para alinhar com o painel do logistics
  const _activeStatuses = new Set(['em_curso', 'no_xpt']);
  const _allForSD = [
    ...xptOrder.flatMap(xid => {
      const xpt = data.xpts[xid]; if (!xpt) return [];
      return (xpt.hoje || xpt.todas || []).filter(r => _activeStatuses.has(r.status));
    }),
    ...(data.svc?.todas||[]).filter(r => _activeStatuses.has(r.status)),
    ...Object.values(data.nex||{}).flatMap(n => (n.todas||[]).filter(r => _activeStatuses.has(r.status))),
  ];
  // Inclui rotas SD diretas do todas_dia (que ficam fora dos XPTs/SVC/NEx).
  // Pegam pelo campo origem="SD" OU pelo nome terminando em _SD (ex: A1_SD).
  const _raw = window._rawDados || {};
  const _todasDia = (_raw.todas_dia || _raw.top_geral || []).filter(r => !r.e_de_amanha);
  const sdFromTD = _todasDia.filter(r =>
    (r.origem === 'SD') ||
    (r.rota && /[_-]SD$/i.test(String(r.rota).trim())) ||
    (r.ciclo && String(r.ciclo).toUpperCase() === 'SD')
  );
  // Combina com _allForSD pra cobrir os 2 caminhos (ciclo e origem)
  const sdRoutesFromAll = _allForSD.filter(r => r.ciclo && r.ciclo.toUpperCase() === 'SD');
  // Dedupe por id_rota / id
  const _sdSeen = new Set();
  const sdRoutes = [...sdRoutesFromAll, ...sdFromTD].filter(r => {
    const k = r.id_rota || r.id || r.rota || JSON.stringify([r.rota,r.motorista]);
    if (_sdSeen.has(k)) return false;
    _sdSeen.add(k);
    return true;
  });
  const _pktSD = (r) => r.pacotes || r.total ||
                ((r.entregues||0)+(r.falhas||0)+(r.pendentes||0)-(r.sacas||0));
  const gPkg = sdRoutes.reduce((s,r) => s+_pktSD(r), 0);
  const gEnt = sdRoutes.reduce((s,r) => s+(r.entregues||0), 0);
  const gFal = sdRoutes.reduce((s,r) => s+(r.falhas||0), 0);
  const gPen = sdRoutes.reduce((s,r) => s+(r.pendentes||0), 0);
  const gDS  = gPkg > 0 ? gEnt/gPkg*100 : 0;
  const gDSc = gDS >= 70 ? 'var(--green)' : gDS >= 50 ? 'var(--yellow)' : 'var(--red)';

  // ── Build XPT cards HTML ────────────────────────────────────────
  // "Rotas hoje" do card deve bater com o total do Last Mile sem esconder
  // Line Haul: soma A caminho + No XPT + Expedidas + Concluidas.
  // Assim EES6, por exemplo, mostra 69 quando tem 38 a caminho e 31 expedidas.
  const _rawDayForXpt = (window._rawDados?.todas_dia || window._rawDados?.top_geral || []);
  const _totalByXpt = {};
  _rawDayForXpt.forEach(r => {
    const og = (r.origem||'').trim();
    if (!og) return;
    _totalByXpt[og] = (_totalByXpt[og] || 0) + 1;
  });

  const cardsHTML = xptOrder.map((xid, idx) => {
    const xpt = data.xpts[xid]; if (!xpt) return '<div></div>';
    const cfg = XPT_CONFIG[xid] || {};
    const rotasHoje = (xpt.hoje || xpt.todas || []).filter(r => !r.e_de_amanha);
    const no_xpt   = rotasHoje.filter(r => r.status === 'no_xpt').length;
    const a_caminho= (xpt.a_caminho || rotasHoje.filter(r => r.status === 'a_caminho'))
      .filter(r => !r.e_de_amanha).length;
    const em_curso = rotasHoje.filter(r => r.status === 'em_curso').length;
    const concluidas=rotasHoje.filter(r => r.status === 'concluida').length;
    const d1NoXptSource = Array.isArray(xpt.no_xpt_d1)
      ? xpt.no_xpt_d1
      : [...(xpt.amanha || []), ...(xpt.proximo || [])];
    const seenD1NoXpt = new Set();
    const d1NoXptRoutes = cfg.tipo === 'D+1'
      ? d1NoXptSource.filter(r => {
          const key = String(r?.id || r?.id_rota || r?.rota || r?.nome_rota || JSON.stringify(r));
          if (seenD1NoXpt.has(key)) return false;
          seenD1NoXpt.add(key);
          return true;
        })
      : [];
    const no_xpt_d1 = d1NoXptRoutes.length;
    const no_xpt_display = no_xpt;
    const no_xpt_label = 'No XPT';
    // Total "rotas hoje" = total do Last Mile para o XPT no dia,
    // incluindo as rotas que ainda estao a caminho do XPT.
    const total = a_caminho + no_xpt + em_curso + concluidas;
    const hasAlert = no_xpt > 0 && cfg.tipo === 'D+1';
    return `
      <div class="xpt-card${hasAlert ? ' alert-border' : ''}${idx === 0 ? ' active' : ''}" id="card-${xid}" onclick="switchTab('${xid}')">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <div>
            <div class="xpt-name">${cfg.emoji||'📦'} ${xid} — ${cfg.nome}</div>
            <div class="xpt-meta"><strong style="color:#111827">${total}</strong> rotas hoje
              <span class="xpt-tipo ${cfg.tipo==='D0'?'d0':'dp1'}">${cfg.tipo}</span>
              ${a_caminho > 0 ? `<span style="font-size:9px;color:var(--blue);margin-left:5px;">${a_caminho} a caminho</span>` : ''}
              ${no_xpt_d1 > 0 ? `<span style="font-size:9px;color:var(--orange);margin-left:5px;">+${no_xpt_d1} amanhã no XPT</span>` : ''}
            </div>
          </div>
          ${hasAlert ? '<span style="font-size:18px;">🚨</span>' : ''}
        </div>
        <div class="xpt-stats">
          <div class="stat-item stat-azul"><div class="stat-val">${a_caminho}</div><div class="stat-lbl">A caminho</div></div>
          <div class="stat-item stat-laranja"><div class="stat-val">${no_xpt_display}</div><div class="stat-lbl">${no_xpt_label}</div></div>
          <div class="stat-item stat-verde"><div class="stat-val">${em_curso}</div><div class="stat-lbl">Expedidas</div></div>
          <div class="stat-item stat-cinza"><div class="stat-val">${concluidas}</div><div class="stat-lbl">Concluídas</div></div>
        </div>
      </div>`;
  }).join('');

  const nexPanelIds = _nexPanelIds();
  const _nexRouteKey = (r) => String(r?.id_rota || r?.id || r?.rota || r?.nome_rota || JSON.stringify([r?.origem, r?.motorista, r?.total]));
  const nexPanelHTML = nexPanelIds.length ? (() => {
    const nexCards = nexPanelIds.map(nid => {
      const cfg = NEX_CONFIG[nid] || {};
      const unit = (data.nex || {})[nid] || {};
      const rawRoutes = [
        ...(unit.todas || []),
        ..._rawDayForXpt.filter(r => _normalizeOrigemId(r.origem) === nid),
      ].filter(r => !r.e_de_amanha);
      const seen = new Set();
      const rotasHoje = rawRoutes.filter(r => {
        const key = _nexRouteKey(r);
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).map(r => ({ ...r, status: _nexPanelEffectiveStatus(r) }));
      const a_caminho = rotasHoje.filter(r => r.status === 'a_caminho').length;
      const no_xpt = rotasHoje.filter(r => r.status === 'no_xpt').length;
      const em_curso = rotasHoje.filter(r => r.status === 'em_curso').length;
      const concluidas = rotasHoje.filter(r => r.status === 'concluida').length;
      const total = a_caminho + no_xpt + em_curso + concluidas;
      const pacotes = rotasHoje.reduce((s, r) => s + (r.pacotes || r.total || r.total_envios || 0), 0);
      const falhas = rotasHoje.reduce((s, r) => s + (r.falhas || 0), 0);
      const hasAlert = no_xpt > 0 || a_caminho > 0;
      return `
        <div class="xpt-card${hasAlert ? ' alert-border' : ''}" style="padding:16px;cursor:default;">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
            <div>
              <div class="xpt-name" style="font-size:15px;">${cfg.emoji || '📦'} ${nid}${cfg.nome ? ' — ' + cfg.nome : ''}</div>
              <div class="xpt-meta" style="font-size:10px;"><strong style="color:#111827">${total}</strong> rotas hoje · ${(pacotes || 0).toLocaleString('pt-BR')} pacotes${falhas ? ` · <span style="color:var(--red);">${falhas} falhas</span>` : ''}</div>
            </div>
            ${hasAlert ? '<span style="font-size:16px;">🚨</span>' : ''}
          </div>
          <div class="xpt-stats">
            <div class="stat-item stat-azul"><div class="stat-val">${a_caminho}</div><div class="stat-lbl">A caminho</div></div>
            <div class="stat-item stat-laranja"><div class="stat-val">${no_xpt}</div><div class="stat-lbl">No NEX</div></div>
            <div class="stat-item stat-verde"><div class="stat-val">${em_curso}</div><div class="stat-lbl">Expedidas</div></div>
            <div class="stat-item stat-cinza"><div class="stat-val">${concluidas}</div><div class="stat-lbl">Concluídas</div></div>
          </div>
        </div>`;
    }).join('');
    return `
      <div style="margin-top:16px;">
        <div style="font-size:11px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px 2px;">📦 NEx ${_currentStation}</div>
        <div style="display:grid;grid-template-columns:repeat(${Math.min(3, Math.max(1, nexPanelIds.length))},1fr);gap:12px;">${nexCards}</div>
      </div>`;
  })() : '';

  // ── Sidebar tables ──────────────────────────────────────────────
  const th = (txt, center) =>
    `<th style="font-size:9px;text-transform:uppercase;color:var(--text3);padding:5px 8px;${center?'text-align:center;':'text-align:left;'}background:var(--bg3);border-bottom:1px solid var(--border);white-space:nowrap;">${txt}</th>`;

  const mlpRowsHTML = mlpKeys.map(k => {
    const s = mlpStats[k];
    const denom = _mlpTotal(s);
    const ds = denom > 0 ? _mlpSucesso(s)/denom*100 : 0;
    const dsc = ds >= 70 ? 'var(--green)' : ds >= 50 ? 'var(--yellow)' : 'var(--red)';
    const label = k.replace(' Transportes','').replace('transportes','').trim();
    return `<tr>
      <td style="font-size:11px;font-weight:600;color:#111827;padding:5px 8px;">${label}</td>
      <td style="text-align:center;font-size:11px;padding:5px 8px;color:var(--text2);">${s.rotas}</td>
      <td style="text-align:center;font-size:11px;padding:5px 8px;color:var(--accent);">${s.pkg.toLocaleString('pt-BR')}</td>
      <td style="text-align:center;font-size:11px;padding:5px 8px;font-weight:700;color:${dsc};">${denom>0?ds.toFixed(1)+'%':'—'}</td>
      <td style="text-align:center;font-size:11px;padding:5px 8px;color:var(--red);">${s.fal>0?s.fal:''}</td>
    </tr>`;
  }).join('');

  const xptRowsHTML = xptSums.map(x => {
    const dsc = x.ds >= 70 ? 'var(--green)' : x.ds >= 50 ? 'var(--yellow)' : x.ds > 0 ? 'var(--red)' : 'var(--text3)';
    return `<tr>
      <td style="font-size:11px;font-weight:600;color:#111827;padding:5px 8px;white-space:nowrap;">${x.cfg.emoji||''}${x.xid}</td>
      <td style="text-align:center;font-size:11px;padding:5px 8px;color:var(--text2);">${x.n}</td>
      <td style="text-align:center;font-size:11px;padding:5px 8px;color:var(--accent);">${x.pkg.toLocaleString('pt-BR')}</td>
      <td style="text-align:center;font-size:11px;padding:5px 8px;font-weight:700;color:${dsc};">${x.pkg>0?x.ds.toFixed(1)+'%':'—'}</td>
    </tr>`;
  }).join('');

  // ── Render ──────────────────────────────────────────────────────
  container.innerHTML = `
    <div class="xpt-layout">
      <!-- LEFT: 2×2 cards -->
      <div>
        <div class="xpt-cards-2x2">${cardsHTML}</div>
        ${nexPanelHTML}
      </div>
      <!-- RIGHT: sidebar -->
      <div class="perf-sidebar">
        <!-- MLPs -->
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">🚚 MLPs do SVC — LM</div>
          <div class="tbl-wrap">
            <table>
              <thead><tr>${th('MLP',false)}${th('Rotas',true)}${th('Pkgs',true)}${th('DS%',true)}${th('❌',true)}</tr></thead>
              <tbody>${mlpRowsHTML||'<tr><td colspan="5" style="padding:10px;text-align:center;color:var(--text3);">—</td></tr>'}</tbody>
            </table>
          </div>
        </div>
        <!-- XPTs -->
        <div>
          <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:8px;">🏭 Por XPT — LM</div>
          <div class="tbl-wrap">
            <table>
              <thead><tr>${th('XPT',false)}${th('Rotas',true)}${th('Pkgs',true)}${th('DS%',true)}</tr></thead>
              <tbody>${xptRowsHTML}</tbody>
            </table>
          </div>
        </div>
        <!-- Ciclo SD Global -->
        <div style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:16px;">
          <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:12px;">📊 Ciclo SD <span style="font-size:10px;font-weight:400;color:var(--text3);text-transform:none;">(${sdRoutes.length} rotas)</span></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div style="text-align:center;background:var(--bg);border-radius:8px;padding:12px 6px;">
              <div style="font-size:26px;font-weight:800;color:${gDSc};line-height:1;">${gDS.toFixed(1)}%</div>
              <div style="font-size:11px;color:var(--text3);margin-top:5px;">DS Global</div>
            </div>
            <div style="text-align:center;background:var(--bg);border-radius:8px;padding:12px 6px;">
              <div style="font-size:26px;font-weight:800;color:var(--accent);line-height:1;">${gPkg.toLocaleString('pt-BR')}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:5px;">Pacotes</div>
            </div>
            <div style="text-align:center;background:var(--bg);border-radius:8px;padding:12px 6px;">
              <div style="font-size:22px;font-weight:700;color:var(--red);line-height:1;">${gFal.toLocaleString('pt-BR')}</div>
              <div style="font-size:11px;color:var(--text3);margin-top:5px;">Insucessos</div>
            </div>
            <div style="text-align:center;background:var(--bg);border-radius:8px;padding:12px 6px;">

// ═══════════════════════════════════════════════════════════
//  AMBULÂNCIA — DESATIVADO (removido a pedido do usuário)
// ═══════════════════════════════════════════════════════════
function _renderAmbulanciaTab_DESATIVADO() {
  const el = document.getElementById('amb-content');
  const cnt = document.getElementById('amb-count');
  if (!el) return;
  const raw = window._rawDados || {};
  const todasDia = (raw.todas_dia || raw.top_geral || []);
  // Detecta rotas com ambulância — múltiplos critérios
  const rotasAmb = todasDia.filter(r => {
    if (r.tem_ambulancia) return true;
    if (r.ocorrencia && /ambulanc/i.test(String(r.ocorrencia))) return true;
    if (r.sub_status && /ambulanc/i.test(String(r.sub_status))) return true;
    return false;
  });
  if (cnt) cnt.textContent = `${rotasAmb.length} rota(s)`;

  if (!rotasAmb.length) {
    el.innerHTML = `<div style="text-align:center;padding:60px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:10px">
      <div style="font-size:48px;margin-bottom:12px">🚑</div>
      <div style="font-size:16px;font-weight:600;color:var(--green);margin-bottom:6px">Nenhuma rota com ambulância detectada</div>
      <div style="font-size:12px;color:var(--text3)">Se o admin estiver mostrando rotas com ocorrência "Ambulância", o bot ainda não está capturando esse campo da API. Me manda o nome do campo que aparece pra eu ajustar.</div>
    </div>`;
    return;
  }

  // Agrega por XPT pra mostrar resumo
  const porXpt = {};
  rotasAmb.forEach(r => {
    const og = (r.origem || '').trim() || 'SC';
    porXpt[og] = (porXpt[og] || 0) + 1;
  });
  const xptResumo = Object.entries(porXpt).sort((a,b) => b[1]-a[1]);

  // Cores por origem
  const coresOg = {
    EBA32:'#9d7ef5', EES2:'#22d3a0', EES3:'#f5883b', EES6:'#f25757',
    BRNES124:'#06b6d4', BRNES73:'#8b5cf6', BRNES464:'#ef4444',
    SD:'#a78bfa', SC:'#94a3b8',
  };

  let html = '';
  // Cards resumo por XPT
  html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px">`;
  xptResumo.forEach(([og, qtd]) => {
    const cor = coresOg[og] || '#64748b';
    html += `<div style="background:${cor}22;border:1px solid ${cor}66;border-radius:10px;padding:14px;text-align:center">
      <div style="font-size:11px;color:${cor};font-weight:700;text-transform:uppercase">${og}</div>
      <div style="font-size:28px;font-weight:800;color:${cor};margin-top:4px">${qtd}</div>
      <div style="font-size:10px;color:var(--text3);margin-top:2px">rota(s)</div>
    </div>`;
  });
  html += `</div>`;

  // Tabela detalhada
  html += `<div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;overflow:hidden">
    <div style="background:#7c2d12;color:#fff;padding:10px;font-weight:800;text-align:center">🚑 ROTAS COM OCORRÊNCIA DE AMBULÂNCIA</div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead style="background:#dc2626;color:#fff">
        <tr>
          <th style="padding:8px;border:1px solid #991b1b">XPT</th>
          <th style="padding:8px;border:1px solid #991b1b;text-align:left">Rota</th>
          <th style="padding:8px;border:1px solid #991b1b;text-align:left">Motorista</th>
          <th style="padding:8px;border:1px solid #991b1b;text-align:left">Transportadora</th>
          <th style="padding:8px;border:1px solid #991b1b;text-align:center">Entregues</th>
          <th style="padding:8px;border:1px solid #991b1b;text-align:center">Falhas</th>
          <th style="padding:8px;border:1px solid #991b1b;text-align:center">Pendentes</th>
          <th style="padding:8px;border:1px solid #991b1b;text-align:center">ORH</th>
          <th style="padding:8px;border:1px solid #991b1b;text-align:left">Status</th>
        </tr>
      </thead>
      <tbody>`;
  rotasAmb.forEach((r, i) => {
    const bg = i%2 ? 'background:var(--bg3)' : '';
    const og = (r.origem||'').trim() || 'SC';
    const cor = coresOg[og] || '#64748b';
    html += `<tr style="${bg}">
      <td style="padding:8px;border:1px solid var(--border);text-align:center">
        <span style="background:${cor}22;color:${cor};border:1px solid ${cor}55;font-weight:700;font-size:10px;padding:3px 8px;border-radius:5px">${og}</span>
      </td>
      <td style="padding:8px;border:1px solid var(--border)">${rotaIdLink ? rotaIdLink(r) : (r.rota||'?')}</td>
      <td style="padding:8px;border:1px solid var(--border);font-weight:600">${r.motorista||'—'}</td>
      <td style="padding:8px;border:1px solid var(--border);font-size:11px;color:var(--text2)">${r.transportadora||'—'}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center;color:var(--green)">${r.entregues||0}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center;color:${(r.falhas||0)>0?'var(--red)':'var(--text3)'}">${r.falhas||0}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center;color:var(--yellow)">${r.pendentes||0}</td>
      <td style="padding:8px;border:1px solid var(--border);text-align:center;font-family:monospace">${r.orh||'—'}</td>
      <td style="padding:8px;border:1px solid var(--border);font-size:11px">${r.ocorrencia || r.sub_status || 'ambulância'}</td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  el.innerHTML = html;

// Filtro ativo da Frota Fixa
window._ffFilter = window._ffFilter || 'all';
window._ffSubFilters = window._ffSubFilters || { status: '', transportadora: '', tipo: '' };
window._ffVisibleVecs = window._ffVisibleVecs || [];
function _ffTipoNormalizado(tipo) {
  return String(tipo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
}
function _ffFrotaFixo(v) {
  const tipo = _ffTipoNormalizado(v.tipo);
  // VUC LM é frota fixa; os demais VUC permanecem como veículos de apoio.
  const vucApoio = /^VUC\b/.test(tipo) && !/^VUC LM\b/.test(tipo);
  return !(/^HR\b/.test(tipo) || vucApoio ||
           tipo.includes('VEICULO DE PASSEIO') || tipo.includes('UTILITARIO'));
}
function setFfSubFilter(campo, valor) {
  window._ffSubFilters[campo] = valor;
  if (window._rawDados) renderFrotasFixasTab();
}
function setFfFilter(f, el) {
  window._ffFilter = f;
  // Atualiza visual dos botões
  document.querySelectorAll('.ff-fbtn').forEach(b => {
    b.style.background = 'var(--bg3)';
    b.style.color = 'var(--text)';
    b.style.border = '1px solid var(--border)';
  });
  if (el) {
    el.style.background = 'var(--blue)';
    el.style.color = '#fff';
    el.style.border = 'none';
  }
  if (window._rawDados) renderFrotasFixasTab();
}

function renderFrotasFixasTab(data) {
  // Pega dados do payload original (não convertido). _rawDados é setado por loadFromJSON.
  const raw = window._rawDados || {};
  const ff = raw.frotas_fixas || {};
  const kpisEl = document.getElementById('ff-kpis');
  if (!kpisEl) return;

  const kpi = (lbl, val, sub, cor) => `
    <div style="background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
      <div style="font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">${lbl}</div>
      <div style="font-size:26px;font-weight:800;color:${cor||'var(--text)'};line-height:1">${val}</div>
      ${sub?`<div style="font-size:11px;color:var(--text3);margin-top:4px">${sub}</div>`:''}
    </div>`;
  const tbody = document.getElementById('ff-tbody');
  const todosVecs = ff.veiculos || [];
  const sub = window._ffSubFilters;
  const statusLabels = { em_andamento: 'Em andamento', concluida: 'Concluída', ausente: 'Ausente', inativo: 'Inativo' };
  const preencherSelect = (id, placeholder, valores, selecionado, labels={}) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = `<option value="">${placeholder}</option>` + valores.map(v =>
      `<option value="${String(v).replace(/"/g, '&quot;')}">${labels[v] || v}</option>`).join('');
    el.value = selecionado || '';
  };
  preencherSelect('ff-sub-status', 'Status: todos',
    ['em_andamento','concluida','ausente','inativo'].filter(s => s === 'inativo' ? todosVecs.some(v => v.inativo) : todosVecs.some(v => v.status === s)), sub.status, statusLabels);
  preencherSelect('ff-sub-transportadora', 'Transportadora: todas',
    [...new Set(todosVecs.map(v => v.transportadora).filter(Boolean))].sort((a,b) => a.localeCompare(b)), sub.transportadora);
  preencherSelect('ff-sub-tipo', 'Tipo: todos',
    [...new Set(todosVecs.map(v => v.tipo).filter(Boolean))].sort((a,b) => a.localeCompare(b)), sub.tipo);
  // Aplica filtro
  const filtro = window._ffFilter || 'all';
  const vecs = todosVecs.filter(v => {
    if (filtro === 'all')          return true;
    if (filtro === 'em_andamento') return v.status === 'em_andamento';
    if (filtro === 'concluida')    return v.status === 'concluida';
    if (filtro === 'ausente')      return v.status === 'ausente';
    if (filtro === 'inativo')      return v.inativo === true;
    if (filtro === 'reserva')      return v.reserva === true;
    if (filtro === 'frota_fixo') {
      return _ffFrotaFixo(v);
    }
    return true;
  }).filter(v =>
    (!sub.status || (sub.status === 'inativo' ? v.inativo === true : v.status === sub.status)) &&
    (!sub.transportadora || v.transportadora === sub.transportadora) &&
    (!sub.tipo || v.tipo === sub.tipo)
  );
  window._ffVisibleVecs = vecs;
  window._ffReportUpdatedAt = raw.atualizado_em || '';

  // No filtro Frota Fixo, os KPIs acompanham exatamente a lista exibida.
  // Nos demais filtros, preserva os KPIs gerais da estação.
  const kpiVeiculos = filtro === 'frota_fixo' ? vecs : todosVecs;
  const kpiNormais = kpiVeiculos.filter(v => !v.reserva);
  const kpiReservas = kpiVeiculos.filter(v => v.reserva);
  const kpiTotal = kpiNormais.length;
  const kpiEmUso = kpiNormais.filter(v => v.status !== 'ausente').length;
  const kpiAusentes = kpiNormais.filter(v => v.status === 'ausente').length;
  const kpiInativos = kpiNormais.filter(v => v.inativo === true).length;
  const kpiPctUso = kpiTotal ? Math.round(kpiEmUso / kpiTotal * 1000) / 10 : 0;
  const kpiReservaEmUso = kpiReservas.filter(v => v.status !== 'ausente').length;
  kpisEl.innerHTML =
    kpi('Total',    kpiTotal,    '',                          'var(--text)') +
    kpi('Em uso',   kpiEmUso,    '',                          'var(--green)') +
    kpi('Ausentes', kpiAusentes, '',                          kpiAusentes>0?'var(--red)':'var(--green)') +
    kpi('Inativos', kpiInativos, '',                          kpiInativos>0?'var(--yellow)':'var(--text)') +
    kpi('% em uso', kpiPctUso.toFixed(1)+'%', '',              'var(--blue)') +
    kpi('🔄 Reserva', kpiReservaEmUso+'/'+kpiReservas.length, '', 'var(--blue)');

  // Atualiza contador
  const countEl = document.getElementById('ff-count');
  if (countEl) {
    const totalVisivel = vecs.length;
    countEl.textContent = filtro === 'all'
      ? `${totalVisivel} veículo(s)`
      : `${totalVisivel} de ${todosVecs.length} veículo(s)`;
  }
  const dash = '<span style="color:var(--text3)">—</span>';
  tbody.innerHTML = vecs.map((v,i) => {
    const bg = i%2 ? 'background:rgba(255,255,255,.015)' : '';
    const reserva = v.reserva ? '<span style="background:rgba(91,156,246,.15);color:var(--blue);border:1px solid rgba(91,156,246,.4);font-weight:700;font-size:9px;padding:2px 6px;border-radius:5px;margin-left:6px">🔄 RESERVA</span>' : '';
    const statusBadge = v.inativo
      ? '<span style="background:rgba(245,158,11,.15);color:var(--yellow);padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700">⚠ Inativo</span>'
      : v.status==='em_andamento' ? '<span style="background:rgba(34,197,94,.15);color:var(--green);padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700">✅ Em andamento</span>'
      : v.status==='concluida' ? '<span style="background:rgba(91,156,246,.15);color:var(--blue);padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700">🏁 Concluída</span>'
      : '<span style="background:rgba(239,68,68,.15);color:var(--red);padding:2px 8px;border-radius:5px;font-size:11px;font-weight:700">❌ Ausente</span>';
    return `<tr style="${bg}${v.reserva?';box-shadow:inset 3px 0 0 var(--blue)':''}">
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-family:monospace;font-weight:700;color:${v.status!=='ausente'?'var(--blue)':'var(--text3)'}">${v.placa}${reserva}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text2)">${v.tipo||dash}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text3);font-size:11px">${v.transportadora||dash}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border)">${statusBadge}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border)">${v.rota||dash}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text2)">${v.motorista||dash}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:var(--green)">${v.entregues>0?v.entregues:dash}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:var(--red)">${v.falhas>0?v.falhas:dash}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);text-align:right;color:var(--yellow)">${v.pendentes>0?v.pendentes:dash}</td>
      <td style="padding:8px 10px;border-bottom:1px solid var(--border);font-family:monospace">${v.orh||dash}</td>
    </tr>`;
  }).join('') || '<tr><td colspan="10" style="padding:24px;text-align:center;color:var(--text3)">Sem veículos cadastrados</td></tr>';

  // Status do override
  const elStatus = document.getElementById('ff-cfg-status');
  if (elStatus) {
    elStatus.innerHTML = ff.config_override_ativo
      ? '<span style="color:var(--green);font-weight:700">✓</span> usando dados/frotas_fixas.json'
      : '<span style="color:var(--text3)">usando lista padrão do código</span>';
  }
}

function copiarRelatorioFrotaFixa(botao) {
  const veiculos = window._ffVisibleVecs || [];
  if (!veiculos.length) {
    alert('Não há veículos no filtro atual para montar o relatório.');
    return;
  }
  const normais = veiculos.filter(v => !v.reserva);
  const emOperacao = normais.filter(v => v.status !== 'ausente' && !v.inativo);
  const ociosas = normais.filter(v => v.status === 'ausente' && !v.inativo);
  const manutencao = normais.filter(v => v.inativo === true);
  const pct = normais.length ? (emOperacao.length / normais.length * 100).toFixed(1) : '0.0';
  const data = new Date(window._ffReportUpdatedAt || Date.now());
  const dataFmt = data.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'2-digit' }).toUpperCase();
  const porTransportadora = (lista, titulo, emoji) => {
    const grupos = {};
    lista.forEach(v => (grupos[v.transportadora || 'SEM TRANSPORTADORA'] ||= []).push(v));
    return Object.entries(grupos).sort(([a],[b]) => a.localeCompare(b)).map(([transportadora, itens]) =>
      `${transportadora}\n${emoji} ${titulo} ${transportadora} (${String(itens.length).padStart(2,'0')}):\n` +
      itens.sort((a,b) => String(a.placa).localeCompare(String(b.placa))).map(v =>
        `${String(v.placa).toLowerCase()}${v.reserva ? ' - Com reserva' : ''}`).join('\n')
    ).join('\n\n');
  };
  const detalhes = [
    porTransportadora(manutencao, 'Em manutenção', '🔴'),
    porTransportadora(ociosas, 'Ociosos', '🟡')
  ].filter(Boolean).join('\n\n');
  const texto = [
    `RELATÓRIO EXECUTIVO - UTILIZAÇÃO DE FROTA FIXA (${dataFmt})`,
    `Utilização: ${pct}% ${Number(pct) >= 90 ? '✅' : '⚠️'}`,
    '',
    'VISÃO GERAL',
    `Frota Total: ${normais.length} veículos`,
    '',
    `🟢 Em Operação (Ativa): ${emOperacao.length} frotas (${pct}% da frota disponível)`,
    `🟡 Ociosas: ${String(ociosas.length).padStart(2,'0')} frotas (${normais.length ? (ociosas.length/normais.length*100).toFixed(1) : '0.0'}% da frota disponível)`,
    `🔴 Em Manutenção: ${String(manutencao.length).padStart(2,'0')} frotas (${normais.length ? (manutencao.length/normais.length*100).toFixed(1) : '0.0'}% da frota total)`,
    detalhes ? '\n' + detalhes : ''
  ].join('\n');
  const copiar = navigator.clipboard?.writeText
    ? navigator.clipboard.writeText(texto)
    : new Promise((resolve, reject) => {
        const area = document.createElement('textarea');
        area.value = texto;
        area.style.position = 'fixed';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        document.execCommand('copy') ? resolve() : reject(new Error('copy failed'));
        area.remove();
      });
  copiar.then(() => {
    const original = botao?.innerHTML;
    if (botao) {
      botao.textContent = '✓ Relatório copiado';
      setTimeout(() => { botao.innerHTML = original; }, 1800);
    }
  }).catch(() => alert('Não foi possível copiar o relatório.'));
}

function _ffRemove(i) { _ffEditorRows.splice(i,1); _renderFfEditor(); }
function addFrotaRow() { _ffEditorRows.push({placa:'',tipo:'',transportadora:'',reserva:false}); _renderFfEditor(); }
function saveFrotasEdit() {

}
function downloadFrotasJSON() {

function downloadFrotasCSV() {
  const ff = (window._rawDados && window._rawDados.frotas_fixas) || {};
  const vecs = ff.veiculos || [];
  if (!vecs.length) { alert('Sem dados de frotas pra baixar (aguarde o bot terminar um ciclo).'); return; }
  const today = new Date().toISOString().slice(0,10);
  const linhas = ['data;placa;tipo;transportadora;reserva;status;rota;motorista;entregues;falhas;pendentes;orh;performance;origem'];
  vecs.forEach(v => {
    linhas.push([
      today,
      v.placa||'',
      (v.tipo||'').replace(/;/g, ','),
      (v.transportadora||'').replace(/;/g, ','),
      v.reserva ? 'SIM' : 'NAO',
      v.status||'',
      (v.rota||'').replace(/;/g, ','),
      (v.motorista||'').replace(/;/g, ','),
      v.entregues||0,
      v.falhas||0,
      v.pendentes||0,
      v.orh||'',
      v.performance||'',
      v.origem||'',
    ].join(';'));
  });
  _downloadFile('frotas_fixas_' + today + '.csv', linhas.join('\n'), 'text/csv;charset=utf-8');
}
function _downloadFile(filename, content, mime) {
  if (mime.includes('csv')) content = '﻿' + content;
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

// Quando o usuário muda o threshold de Stem Out, ajusta automaticamente:
// - Se threshold baixo (< 3h) → ordena "menor primeiro" (vê as menores antes)
// - Se threshold padrão (≥ 3h) → ordena "maior primeiro" (mostra as piores)
function _onStemFilterChange() {
  const stemSel  = document.getElementById('of-filter-stem');
  const ordemSel = document.getElementById('of-filter-ordem');
  if (!stemSel || !ordemSel) return;
  const v = parseInt(stemSel.value, 10) || 180;
  ordemSel.value = v < 180 ? 'asc' : 'desc';
}

function renderOfensoresTab(data) {
  const raw = window._rawDados || {};
  const stationAtiva = raw._station_filter || _currentStation || 'SES3';
  const todasDia = (raw.todas_dia || raw.top_geral || [])
    .filter(r => _routeMatchesStation(r, stationAtiva))
    .map(r => {
      const rr = { ...r };
      rr.station = _stationFromRoute(rr);
      rr.origem = _normalizeOrigemId(rr.origem);
      rr.transportadora_grupo = _carrierGroup(rr.transportadora);
      if (!rr.origem) {
        const disp = String(rr.origem_display || '');
        const ciclo = (disp.match(/(?:SES2|SES3)\s*[·-]\s*(.+)$/i) || [])[1];
        rr.origem_display = ciclo ? `${rr.station} - ${ciclo.trim()}` : rr.station;
      }
      return rr;
    });

  // Lê filtros
  const origemSel = (document.getElementById('of-filter-origem')||{}).value || '';
  const tcpSel    = (document.getElementById('of-filter-tcp')||{}).value || '';
  const topNRaw   = (document.getElementById('of-filter-top')||{}).value;
  const topN      = (topNRaw === '0' || topNRaw === undefined) ? (topNRaw === '0' ? Infinity : 10) : parseInt(topNRaw, 10);
  const tcpLabel = (r) => stationAtiva === 'SES2'
    ? (_carrierGroup(r.transportadora) || (r.transportadora||'').trim())
    : (r.transportadora||'').trim();

  // Popula dropdown de transportadoras conforme a station ativa.
  const tcpSelEl = document.getElementById('of-filter-tcp');
  if (tcpSelEl && tcpSelEl.dataset.station !== stationAtiva) {
    tcpSelEl.innerHTML = '<option value="">Todas</option>';
    tcpSelEl.dataset.station = stationAtiva;
  }
  if (tcpSelEl && tcpSelEl.options.length <= 1) {
    const set = new Set();
    todasDia.forEach(r => {
      const t = tcpLabel(r);
      if (t) set.add(t);
    });
    const preferred = stationAtiva === 'SES2'
      ? ['HAWK','DELUNA','ONTIME','PARCEIRO','RODACOP']
      : [];
    const ordered = preferred.length
      ? preferred.filter(t => set.has(t)).concat(Array.from(set).filter(t => !preferred.includes(t)).sort())
      : Array.from(set).sort();
    ordered.forEach(t => {
      const o = document.createElement('option');
      o.value = t; o.textContent = t;
      tcpSelEl.appendChild(o);
    });
    if (tcpSel) tcpSelEl.value = tcpSel; // mantém seleção
  }

  // Exclui amanhã e Envios Extra (padrão)
  let lista = todasDia.filter(r => !r.e_de_amanha)
                      .filter(r => {
                        const t = (r.transportadora||'').toLowerCase();
                        return !t.includes('envios extra') && !t.includes('envios e');
                      });

  // Aplica filtro de origem
  // Sentinel __SES3__/__SES2__/__SC__ = rotas sem origem (direto do SC).
  if (origemSel) {
    if (origemSel === '__SES3__' || origemSel === '__SES2__' || origemSel === '__SC__') {
      lista = lista.filter(r => !(r.origem||'').trim());
    } else {
      const origemNorm = _normalizeOrigemId(origemSel);
      lista = lista.filter(r => _normalizeOrigemId(r.origem) === origemNorm);
    }
  }
  // Aplica filtro de transportadora
  if (tcpSel) {
    lista = lista.filter(r => tcpLabel(r) === tcpSel);
  }

  const topFalhas = lista.filter(r => (r.falhas||0) >= 1).sort((a,b)=>(b.falhas||0)-(a.falhas||0)).slice(0, topN);
  // Threshold de Stem Out (em minutos) configurável pelo dropdown
  const stemMinRaw = (document.getElementById('of-filter-stem')||{}).value;
  const stemMin = stemMinRaw ? parseInt(stemMinRaw, 10) : 180;
  // Override do topN: se threshold for baixo (< 3h), mostra TODOS por padrão
  // (não faz sentido limitar Top 10 quando o usuario quer ver as menores)
  const _topNStem = stemMin < 180 ? Infinity : topN;
  // Ordem do sort: desc (maior primeiro) ou asc (menor primeiro)
  const ordemRaw = (document.getElementById('of-filter-ordem')||{}).value || 'desc';
  // Pega valor de Stem Out aceitando vários nomes de campo
  const _stemVal = (r) => r.stem_out || r.stem_out_min || r.stem_out_minutes
                       || r.stemOut || r.stemOutMin || r.stem || 0;
  const topStem   = lista.filter(r => _stemVal(r) >= stemMin)
                         .sort((a,b)=> ordemRaw === 'asc'
                                       ? _stemVal(a)-_stemVal(b)
                                       : _stemVal(b)-_stemVal(a))
                         .slice(0, _topNStem);
  const topOrh    = lista.filter(r => (r.orh_minutos||0) >= 540).sort((a,b)=>(b.orh_minutos||0)-(a.orh_minutos||0)).slice(0, topN);
  window._topOfensores = { falhas: topFalhas, stem: topStem, orh: topOrh, data: raw.atualizado || '' };

  const ORIGEM_INFO = {
    EBA32:{tipo:'XPT',cor:'#9d7ef5'}, EES2:{tipo:'XPT',cor:'#22d3a0'},
    EES3:{tipo:'XPT',cor:'#f5883b'},  EES6:{tipo:'XPT',cor:'#f25757'},
    BRNES124:{tipo:'NEx',cor:'#06b6d4'}, BRNES73:{tipo:'NEx',cor:'#8b5cf6'},
    BRNES464:{tipo:'NEx',cor:'#ef4444'}, BRDES73:{tipo:'NEx',cor:'#8b5cf6'}, BRDES6818:{tipo:'NEx',cor:'#10b981'},
    EES5:{tipo:'XPT',cor:'#f97316'}, EMG20:{tipo:'XPT',cor:'#0ea5e9'}, MG20:{tipo:'XPT',cor:'#0ea5e9'},
    BRNES10:{tipo:'NEx',cor:'#06b6d4'}, BRNES87:{tipo:'NEx',cor:'#8b5cf6'}, BRNES6769:{tipo:'NEx',cor:'#10b981'},
    BRDES6805:{tipo:'DC',cor:'#475569'}, BRDES6810:{tipo:'DC',cor:'#475569'},
    BRDES6768:{tipo:'DC',cor:'#475569'}, BRDES6807:{tipo:'DC',cor:'#475569'}, BRDES10:{tipo:'DC',cor:'#475569'},
    SD:{tipo:'SD',cor:'#a78bfa'},
  };
  function origemBadge(r) {
    const og = _normalizeOrigemId(r.origem);
    if (og && ORIGEM_INFO[og]) {
      const info = ORIGEM_INFO[og];
      return `<span style="background:${info.cor}22;color:${info.cor};border:1px solid ${info.cor}66;font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px">${info.tipo} · ${_origemLabel(og)}</span>`;
    }
    const display = r.origem_display || og || r.station || stationAtiva;
    return `<span style="background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5;font-weight:800;font-size:11px;padding:3px 8px;border-radius:6px">❗ ${display}</span>`;
  }
  function fmtMin(min) {
    if (!min) return '—';
    const h = Math.floor(min/60), m = min%60;
    return h + 'h' + String(m).padStart(2,'0');
  }
  function card(titulo, icon, cor, lista, metricFn, metricLbl) {
    const itens = lista.length ? lista.map((r,i) => {
      const rId = r.id_rota;
      const url = rId ? `https://envios.adminml.com/logistics/monitoring-distribution/detail/${rId}?site=MLB` : '';
      const linkRota = url
        ? `<a href="${url}" target="_blank" rel="noopener" style="color:var(--blue);text-decoration:none;font-weight:700">${r.rota||'?'}</a>`
        : `<span style="font-weight:700;color:var(--blue)">${r.rota||'?'}</span>`;
      return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 12px;background:${i%2?'#ffffff':cor+'0f'};border:1px solid ${cor}22;border-radius:8px;font-size:14px;margin-bottom:6px">
        <span style="background:${cor};color:#fff;font-weight:900;min-width:28px;height:28px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;text-align:center">${i+1}</span>
        <div style="overflow:hidden">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-family:monospace;font-size:13px">${linkRota}</span>${origemBadge(r)}</div>
          <div style="color:var(--text);font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px">${r.motorista||'—'}</div>
          <div style="color:#334155;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px">${stationAtiva === 'SES2' ? (r.transportadora_grupo || _carrierGroup(r.transportadora) || r.transportadora || '') : (r.transportadora || '')}</div>
        </div>
        <div style="text-align:right">
          <div style="display:inline-block;background:${cor};color:#fff;font-weight:900;font-size:20px;line-height:1;padding:6px 8px;border-radius:8px;min-width:58px;text-align:center">${metricFn(r)}</div>
          <div style="color:#334155;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;margin-top:3px">${metricLbl}</div>
        </div>
      </div>`;
    }).join('') : '<div style="text-align:center;padding:24px;color:var(--text3);font-size:14px;font-weight:700">Nenhuma rota nesta categoria</div>';
    return `<div style="background:#ffffff;border:1px solid ${cor}66;border-left:6px solid ${cor};border-radius:10px;overflow:hidden;box-shadow:0 8px 20px rgba(15,23,42,.08)">
      <div style="padding:12px 14px;background:${cor};border-bottom:1px solid ${cor};font-weight:900;font-size:15px;color:#fff;display:flex;align-items:center;gap:8px">
        ${icon} ${titulo} <span style="color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;margin-left:auto">${lista.length} ofensor(es)</span>
      </div>
      <div style="padding:9px;background:${cor}08">${itens}</div>
    </div>`;
  }

  const gridEl = document.getElementById('of-grid');
  if (!gridEl) return;
  // Rótulo amigável do threshold: "35 min", "1h", "2h", "3h" etc.
  const stemLabel = stemMin < 60 ? `${stemMin} min`
                   : stemMin % 60 === 0 ? `${stemMin/60}h`
                   : `${Math.floor(stemMin/60)}h${String(stemMin%60).padStart(2,'0')}`;
  gridEl.innerHTML =
    card('Mais Falhas',     '🔴', '#dc2626', topFalhas, r => r.falhas + 'f', 'falhas') +
    card(`Stem Out ≥ ${stemLabel}`, '⏱', '#f59e0b',  topStem,   r => fmtMin(_stemVal(r)), 'stem') +
    card('ORH Alto (≥ 9h)', '🔵', '#2563eb',  topOrh,    r => (r.orh_minutos/60).toFixed(1)+'h', 'ORH');
}

function downloadOfensoresCSV() {
  const o = window._topOfensores;
  if (!o) { alert('Sem dados ainda.'); return; }
  const today = new Date().toISOString().slice(0,10);
  const linhas = ['data;categoria;ranking;rota;id_rota;motorista;transportadora;placa;origem;falhas;stem_out_min;orh_min;entregues;pendentes'];
  const add = (cat, lista) => lista.forEach((r,i) => linhas.push([
    today, cat, i+1, (r.rota||'').replace(/;/g,','), r.id_rota||'',
    (r.motorista||'').replace(/;/g,','), (r.transportadora||'').replace(/;/g,','),
    r.placa||'', r.origem_display||r.origem||'',
    r.falhas||0, r.stem_out||0, r.orh_minutos||0, r.entregues||0, r.pendentes||0,
  ].join(';')));
  add('falhas',  o.falhas);
  add('stem_out',o.stem);
  add('orh_alto',o.orh);
  _downloadFile('ofensores_'+today+'.csv', linhas.join('\n'), 'text/csv;charset=utf-8');
}
function downloadOfensoresJSON() {
  const o = window._topOfensores;
  if (!o) { alert('Sem dados ainda.'); return; }
  const today = new Date().toISOString().slice(0,10);
  _downloadFile('ofensores_'+today+'.json', JSON.stringify(o,null,2), 'application/json');
}

// EXPORTAR RESUMO PDF — abre janela nova com layout dedicado pra print
// ═══════════════════════════════════════════════════════════════════
// Seguranca: dados sao escapados via esc() antes de injetar no HTML.
// Conteudo aberto via window.open(about:blank) — sem chamadas externas,
// sem postMessage, sem cookies/storage compartilhados com a popup.
// ═══════════════════════════════════════════════════════════
//  DESCRICOES POR ROTA OFENSORA — persistido em localStorage
//  Chave inclui a DATA do dia operacional, entao as descricoes
//  de ontem nao vazam pro PDF de hoje (reset diario automatico).
// ═══════════════════════════════════════════════════════════
const _DESC_KEY = 'descricoes_ofensores_v1';
const _DESC_MAX_LEN = 500; // limite por descricao (anti-DoS / anti localStorage overflow)

function _descDataHoje() {
  // dd/mm/yyyy local — mesma logica usada no rest do dashboard
  return new Date().toLocaleDateString('pt-BR');
}

function _descKeyRota(r) {
  const id = String(r.id_rota || r.rota || '').trim();
  return `${_descDataHoje()}|${id}`;
}

function _descLerTudo() {
  try {
    const raw = localStorage.getItem(_DESC_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function _descGravarTudo(map) {
  try {
    localStorage.setItem(_DESC_KEY, JSON.stringify(map));
    return true;
  } catch (e) {
    console.warn('[desc] falha ao gravar localStorage:', e);
    return false;
  }
}

function _descGet(r) {
  return _descLerTudo()[_descKeyRota(r)] || '';
}

function _descSet(r, txt) {
  const map = _descLerTudo();
  const limpo = String(txt || '').slice(0, _DESC_MAX_LEN);
  if (limpo) {
    map[_descKeyRota(r)] = limpo;
  } else {
    delete map[_descKeyRota(r)];
  }
  return _descGravarTudo(map);
}

// Limpa entradas de dias anteriores — chamado ao abrir o modal,
// pra nao deixar o localStorage crescer indefinidamente.
function _descGarbageCollect() {
  const map = _descLerTudo();
  const hoje = _descDataHoje();
  let mudou = false;
  Object.keys(map).forEach(k => {
    const [data] = k.split('|');
    if (data !== hoje) { delete map[k]; mudou = true; }
  });
  if (mudou) _descGravarTudo(map);
}

// Lista as 10 rotas mesma logica do exportarResumoPDF
function _descTop10Ofensoras() {
  const raw = window._rawDados || {};
  const MAX_ORH_MIN = 780;
  const _orhMin = (r) => Number(r.orh_min || r.orh_minutos || 0);
  const _isEnviosExtra = (r) => (r.transportadora||'').toLowerCase().includes('envios extra');
  return (raw.todas_dia || raw.top_geral || [])
    .filter(r => !r.e_de_amanha)
    .filter(r => _orhMin(r) < MAX_ORH_MIN)
    .filter(r => (r.falhas||0) > 0)
    .filter(r => !_isEnviosExtra(r))
    .sort((a,b) => (b.falhas||0) - (a.falhas||0))
    .slice(0, 10);
}

    <button id="desc-close" style="margin-left:auto;background:transparent;border:1px solid var(--border,#2a2f3f);color:var(--text,#e5e7eb);padding:5px 10px;border-radius:5px;cursor:pointer;font-size:12px">✕ Fechar</button>

    const idShort = _esc(r.id_rota || '');
    const tcp = _esc(r.transportadora || '—');
    const mot = _esc(r.motorista || '—');
    const falhas = Number(r.falhas || 0);

    const item = document.createElement('div');
    item.style.cssText = 'margin-bottom:14px;padding:10px;background:var(--bg3,#0f1219);border:1px solid var(--border,#2a2f3f);border-radius:6px';
    item.innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
        <span style="background:#1e3a8a;color:#fff;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700">#${idx+1}</span>
        <strong style="color:var(--text,#e5e7eb);font-size:13px">${rotaTag}</strong>
        ${idShort ? `<span style="color:var(--text3,#6b7280);font-size:11px">#${idShort}</span>` : ''}
        <span style="background:#7f1d1d;color:#fecaca;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:700">${falhas} falhas</span>
        <span style="color:var(--text2,#9ca3af);font-size:11px">${tcp} · ${mot}</span>
      </div>
      <textarea data-desc-key="${_esc(_descKeyRota(r))}" maxlength="${_DESC_MAX_LEN}"
        placeholder="O que aconteceu com essa rota? Ex: Driver com problema no veiculo, condominio fechou, endereço incorreto..."
        style="width:100%;min-height:60px;padding:8px 10px;background:var(--bg,#0a0d14);border:1px solid var(--border,#2a2f3f);color:var(--text,#e5e7eb);border-radius:5px;font-size:12px;font-family:inherit;resize:vertical;box-sizing:border-box">${_esc(desc)}</textarea>
      <div style="font-size:10px;color:var(--text3,#6b7280);margin-top:3px;text-align:right">

    body.appendChild(item);

  card.appendChild(body);

  const footer = document.createElement('div');
  footer.style.cssText = 'padding:12px 18px;border-top:1px solid var(--border,#2a2f3f);display:flex;gap:8px;align-items:center;flex-wrap:wrap';

  card.appendChild(footer);

  overlay.appendChild(card);

  // Contador de chars ao vivo
  body.querySelectorAll('textarea[data-desc-key]').forEach(ta => {
    ta.addEventListener('input', (e) => {
      const c = e.target.parentElement.querySelector('.desc-count');

  // Fechar (X)
  document.getElementById('desc-close').onclick = () => overlay.remove();

  // Fechar clicando fora do card
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

  // ESC fecha
  const escHandler = (e) => {
    if (e.key === 'Escape') { overlay.remove(); document.removeEventListener('keydown', escHandler); }
  };
  document.addEventListener('keydown', escHandler);

  // Limpar todas
  document.getElementById('desc-clear-all').onclick = () => {
    if (!confirm('Apagar TODAS as descricoes de hoje?')) return;
    body.querySelectorAll('textarea[data-desc-key]').forEach(ta => { ta.value = ''; });
    body.querySelectorAll('.desc-count').forEach(c => c.textContent = '0');
  };

  // Salvar
  document.getElementById('desc-save').onclick = () => {
    let okCount = 0, falhouCount = 0;
    body.querySelectorAll('textarea[data-desc-key]').forEach(ta => {
      // Acha a rota correspondente pela chave (data|id_rota)
      const key = ta.getAttribute('data-desc-key');

      const r = top10.find(x => String(x.id_rota || x.rota || '').trim() === id);

      const ok = _descSet(r, ta.value);
      if (ok) okCount++; else falhouCount++;
    });
    if (falhouCount) {
      alert(`${okCount} descricoes salvas. ${falhouCount} falharam (localStorage cheio?).`);
    } else {
      // Feedback visual rapido + fecha
      const btn = document.getElementById('desc-save');
      btn.textContent = '✓ Salvo';
      btn.style.background = '#15803d';
      setTimeout(() => overlay.remove(), 700);
    }
  };
}

function exportarResumoPDF() {
  const raw = window._rawDados || {};
  // Exclui rotas com ORH >= 13h (780min) — sao remanescentes do dia anterior
  // que nao fecharam, e contaminam a analise do dia operacional atual.
  // Aplica em TODAS as secoes (top ofensores, mais falhas, falhas por XPT/TCP),
  // exceto Motivos (que vem do BigQuery e ja filtra por dia).
  const MAX_ORH_MIN = 780; // 13h
  const _orhMin = (r) => Number(r.orh_min || r.orh_minutos || 0);
  const todasDia = (raw.todas_dia || raw.top_geral || [])
    .filter(r => !r.e_de_amanha)
    .filter(r => _orhMin(r) < MAX_ORH_MIN);
  if (!todasDia.length) {
    alert('Sem dados pra gerar o resumo. Aguarde o bot terminar o primeiro ciclo.');
    return;
  }

  // Helpers locais — mesma logica de esc/fmtN do dashboard principal
  const _esc = (s) => String(s == null ? '' : s).replace(/[&<>"'`]/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'
  })[c]);
  const _fmtN = (n) => Number(n || 0).toLocaleString('pt-BR');
  const _fmtMin = (m) => {
    const n = Number(m||0); if (!n) return '—';
    const h = Math.floor(n/60), mm = n%60;
    return h > 0 ? (mm > 0 ? `${h}h${String(mm).padStart(2,'0')}` : `${h}h`) : `${mm}min`;
  };
  const _isEnviosExtra = (r) => (r.transportadora||'').toLowerCase().includes('envios extra');

  // 1) Top ofensores (sem envios extras) — ordenado por falhas desc
  const ofensores = todasDia
    .filter(r => (r.falhas||0) > 0)
    .filter(r => !_isEnviosExtra(r))
    .sort((a,b) => (b.falhas||0) - (a.falhas||0));

  const top10 = ofensores.slice(0, 10);
  const top10MaisFalhas = ofensores.slice(0, 10);
  const orhAlto9h = todasDia
    .filter(r => (r.orh_min || r.orh_minutos || 0) >= 540)
    .sort((a,b) => (b.orh_min || b.orh_minutos || 0) - (a.orh_min || a.orh_minutos || 0))
    .slice(0, 10);

  // 2) Motivos de insucesso (BQ embed ou JSON)
  const mfBQ = window._motivosBQ || (typeof _MOTIVOS_BQ_EMBED !== 'undefined' ? _MOTIVOS_BQ_EMBED : null);
  const motivosBQ = (mfBQ && Array.isArray(mfBQ.motivos)) ? mfBQ.motivos : [];

  // 3) Falhas por XPT/Origem
  const porXpt = {};
  todasDia.forEach(r => {
    const k = (r.origem || 'SVC') || 'SVC';
    if (!porXpt[k]) porXpt[k] = {falhas:0, rotas:0, rotasFalha:0, pacotes:0};
    porXpt[k].falhas    += (r.falhas||0);
    porXpt[k].pacotes   += (r.pacotes||0);
    porXpt[k].rotas     += 1;
    if ((r.falhas||0) > 0) porXpt[k].rotasFalha += 1;
  });
  const falhasXpt = Object.entries(porXpt)
    .map(([k,v]) => ({xpt:k, ...v, pctFalha: v.pacotes>0 ? (v.falhas/v.pacotes*100):0}))
    .filter(x => x.falhas > 0)
    .sort((a,b) => b.falhas - a.falhas);

  // 4) Falhas por Transportadora
  const porTcp = {};
  todasDia.forEach(r => {
    const k = (r.transportadora || '—').trim() || '—';
    if (!porTcp[k]) porTcp[k] = {falhas:0, rotas:0, pacotes:0};
    porTcp[k].falhas  += (r.falhas||0);
    porTcp[k].pacotes += (r.pacotes||0);
    porTcp[k].rotas   += 1;
  });
  const falhasTcp = Object.entries(porTcp)
    .map(([k,v]) => ({tcp:k, ...v, pctFalha: v.pacotes>0 ? (v.falhas/v.pacotes*100):0}))
    .filter(x => x.falhas > 0)
    .sort((a,b) => b.falhas - a.falhas);

  // Totais pra header
  const totFalhas = todasDia.reduce((s,r) => s+(r.falhas||0), 0);
  const totPac = todasDia.reduce((s,r) => s+(r.pacotes||0), 0);
  const totEnt = todasDia.reduce((s,r) => s+(r.entregues||0), 0);
  const ds = totPac>0 ? (totEnt/totPac*100) : 0;
  const dataStr = new Date().toLocaleString('pt-BR', {dateStyle:'short', timeStyle:'short'});

  // Linhas de tabela helper — inclui sub-linha com descricao se houver
  // (_descGet le do localStorage; _esc sanitiza pra evitar XSS no popup)
  const linhaOfensor = (r, idx) => {
    const desc = _descGet(r);
    const main = `<tr>
      <td>${idx+1}</td>
      <td><strong>${_esc(r.rota || r.id_rota || '?')}</strong></td>
      <td>${_esc(r.origem || 'SVC')}</td>
      <td>${_esc(r.transportadora || '—')}</td>
      <td>${_esc(r.motorista || '—')}</td>
      <td class="num red">${_fmtN(r.falhas||0)}</td>
      <td class="num">${_fmtN(r.pacotes||0)}</td>
      <td class="num">${_fmtN(r.pendentes||0)}</td>
    </tr>`;
    const descRow = desc ? `<tr class="desc-row"><td colspan="8" class="desc-cell"><strong>📝 Descrição:</strong> ${_esc(desc)}</td></tr>` : '';
    return main + descRow;
  };

  // Monta HTML completo
  const html = `<!doctype html>

  .kpi-val{font-size:18px;font-weight:800;color:#111827;margin-top:2px}
  .kpi.red .kpi-val{color:#b91c1c}

//  PDF do Reporte Insucessos — espelha o que esta na tela
//  (mesmo filtro !e_de_amanha, sem cortar por ORH) pra os
//  numeros baterem 1:1 com o print que o usuario manda.
// ═══════════════════════════════════════════════════════════
function exportarInsucessosPDF() {
  const raw = window._rawDados || {};
  const todasDia = (raw.todas_dia || raw.top_geral || [])
    .filter(r => !r.e_de_amanha);

  if (!todasDia.length) {
    alert('Sem dados pra gerar o PDF de Insucessos. Aguarde o bot terminar o primeiro ciclo.');
    return;
  }

  // Helpers (mesma logica de _esc/_fmtN do exportarResumoPDF)
  const _esc = (s) => String(s == null ? '' : s).replace(/[&<>"'`]/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'
  })[c]);
  const _fmtN = (n) => Number(n || 0).toLocaleString('pt-BR');
  const _pct  = (num, den) => den > 0 ? (num/den*100).toFixed(1) : '0.0';

  // ─── KPIs no topo (5 cards do print) ──────────────────────
  const totFalhas = todasDia.reduce((s, r) => s + (r.falhas || 0), 0);
  const totPacotes = todasDia.reduce((s, r) => s + (r.total || 0), 0);
  const totEntregues = todasDia.reduce((s, r) => s + (r.entregues || 0), 0);
  const rotasComFalha = todasDia.filter(r => (r.falhas || 0) > 0);

  // Motoristas unicos com falha (case-insensitive, trim)
  const motoristasSet = new Set();
  rotasComFalha.forEach(r => {
    const m = (r.motorista || '').trim().toLowerCase();
    if (m) motoristasSet.add(m);
  });

  // XPTs afetados (origem unica, conta SVC pra rotas sem origem)
  const xptsSet = new Set();
  rotasComFalha.forEach(r => {
    const og = (r.origem || '').trim() || 'SVC';
    xptsSet.add(og);
  });

  // Transportadoras unicas com falha
  const tcpsSet = new Set();
  rotasComFalha.forEach(r => {
    const t = (r.transportadora || '').trim();
    if (t) tcpsSet.add(t);
  });

  // ─── Agregador (mesma logica do render Insucessos) ────────
  const _agregar = (rotas, chaveFn) => {
    const m = {};
    rotas.forEach(r => {
      const k = chaveFn(r);
      if (!k) return;
      if (!m[k]) m[k] = { chave: k, falhas: 0, pacotes: 0, entregues: 0, rotas: 0 };
      m[k].falhas    += (r.falhas    || 0);
      m[k].pacotes   += (r.total     || 0);
      m[k].entregues += (r.entregues || 0);
      m[k].rotas     += 1;
    });
    return Object.values(m)
      .filter(x => x.falhas > 0)
      .sort((a, b) => b.falhas - a.falhas);
  };

  const porXpt           = _agregar(todasDia, r => (r.origem || 'SVC'));

  // Top motoristas (mesma logica do render — agrupa por motorista, nao por rota)

    motoristaMap[nome].falhas += (r.falhas || 0);

  const html = `<!doctype html>
