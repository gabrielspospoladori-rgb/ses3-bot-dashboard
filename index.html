// Badge de status TM — usa keys reais do bot Python
function _tmBadge(r) {
  const s  = r.status || '';
  const cid = r.cycle_id || '';
  // Em rota com número de rota
  if ((s === 'started' || s === 'in_progress') && cid)
    return `<span style="background:#16a34a;color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap">🚗 Rota ${cid}</span>`;
  if (s === 'started' || s === 'in_progress')
    return `<span style="background:#16a34a;color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700">🚗 Em rota</span>`;
  // Aceito mas ainda aguardando início da rota
  if (s === 'accepted' || s === 'waiting_acceptance')
    return `<span class="badge badge-amarelo">⏳ Aguardando aceite</span>`;
  // Sem resposta do motorista
  if (s === 'assigned')
    return `<span class="badge badge-cinza">⏸ Sem resposta</span>`;
  // Finalizado
  if (s === 'finished')
    return `<span class="badge badge-cinza">🏁 Finalizado</span>`;
  // Recusado
  if (s === 'rejected' || s === 'refused')
    return `<span class="badge badge-vermelho">✗ Recusado</span>`;
  // Cancelado
  if (s === 'canceled')
    return `<span class="badge badge-cinza">✗ Cancelado</span>`;
  // Dados incompletos
  if (s === 'defined')
    return `<span class="badge badge-amarelo">⚠️ Dados incompletos</span>`;
  return `<span class="badge badge-cinza">${r.display_status || s || '—'}</span>`;
}

function renderTMSection(data) {
  const el = document.getElementById('tm-section');
  if (!el) return;
  const tm = data.travel_management || {};
  const records = (tm.records || []).filter(r => r.is_envios_extra);
  if (!records.length) { el.innerHTML = ''; return; }

  // Agrupa por facility
  const byFacility = {};
  records.forEach(r => {
    const f = r.origem || 'SES3';
    if (!byFacility[f]) byFacility[f] = [];
    byFacility[f].push(r);
  });
  const facilities = Object.keys(byFacility);
  if (!_tmActiveFacility || !byFacility[_tmActiveFacility]) _tmActiveFacility = facilities[0];

  // Renderiza sub-abas das facilities
  const tabs = facilities.map(fid => {
    const cfg  = _TM_FACILITY_CFG[fid] || { label: fid, emoji: '⚡' };
    const recs = byFacility[fid];
    const aguard = recs.filter(r => r.status === 'accepted' || r.status === 'waiting_acceptance').length;
    const active = fid === _tmActiveFacility;
    const alertBadge = aguard
      ? `<span style="background:#d97706;color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700">${aguard}</span>`
      : '';
    return `<button onclick="_tmSwitchFacility('${fid}',this)" style="
      background:${active ? '#1d4ed8' : 'var(--bg2)'};
      color:${active ? '#fff' : 'var(--text2)'};
      border:1px solid ${active ? '#1e40af' : 'var(--border)'};
      padding:6px 12px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;
      display:flex;align-items:center;gap:5px;white-space:nowrap">
      ${cfg.emoji} ${cfg.label} ${alertBadge}
    </button>`;
  }).join('');

  // Facility ativa
  const activeRecs  = byFacility[_tmActiveFacility] || [];
  const cfgAtiva    = _TM_FACILITY_CFG[_tmActiveFacility] || { label: _tmActiveFacility, emoji: '⚡' };
  const totalFac    = activeRecs.length;
  const emRotaFac   = activeRecs.filter(r => r.status === 'started' || r.status === 'in_progress').length;
  const aguardFac   = activeRecs.filter(r => r.status === 'accepted' || r.status === 'waiting_acceptance').length;
  const semRespFac  = activeRecs.filter(r => r.status === 'assigned').length;
  const recusadosFac= activeRecs.filter(r => r.status === 'rejected' || r.status === 'refused').length;
  const finalizFac  = activeRecs.filter(r => r.status === 'finished').length;
  const nViagens    = new Set(activeRecs.map(r => r.travel_id)).size;

  const statsLine = [
    `<span style="font-size:11px;color:var(--text3)">${nViagens} viagens</span>`,
    `<span style="font-size:11px;color:var(--text3)">${totalFac} Total</span>`,
    emRotaFac   ? `<span style="font-size:11px;color:#16a34a;font-weight:700">${emRotaFac} Em rota</span>`           : '',
    semRespFac  ? `<span style="font-size:11px;color:var(--text3)">${semRespFac} Sem resposta</span>`               : '',
    aguardFac   ? `<span style="font-size:11px;color:#d97706;font-weight:700">${aguardFac} Aguardando aceite</span>` : '',
    recusadosFac? `<span style="font-size:11px;color:#dc2626;font-weight:700">${recusadosFac} Recusados</span>`      : '',
    finalizFac  ? `<span style="font-size:11px;color:var(--text3)">${finalizFac} Finalizados</span>`                : '',
  ].filter(Boolean).join(' · ');

  // Agrupa por tipo de veículo
  const byTipo = {};
  activeRecs.forEach(r => {
    const t = r.veiculo_tipo || r.servico || 'Outros';
    if (!byTipo[t]) byTipo[t] = [];
    byTipo[t].push(r);
  });

  // Cross-reference TM → rota de Em Andamento
  // Busca mais precisa: placa + motorista + preferência por Envios Extra
  // Rotas individuais com placa/motorista — as mesmas fontes que o Em Andamento usa.
  // window._rawDados.todas_dia inclui rotas SVC sem origem mapeada (ex: ">F9_AM1"
  // cujo facility_id "F9" não está em _MAPA_ORIGENS → origem = "").
  const _isAtivo = rt => rt.placa && (rt.status === 'em_curso' || rt.em_curso === true);
  const _rawTodas = window._rawDados?.todas_dia || window._rawDadosFull?.todas_dia || [];
  const _allRotas = [
    ..._rawTodas.filter(_isAtivo),
    ...Object.values(data.xpts || {}).flatMap(x => (x.todas || []).filter(_isAtivo)),
    ...Object.values(data.nex  || {}).flatMap(n => (n.todas || []).filter(_isAtivo)),
  ];
  function _findRotaMatch(tmRecord) {
    if (!tmRecord.placa) return null;
    const placaKey = tmRecord.placa.toUpperCase();
    const candidates = _allRotas.filter(rt => rt.placa && rt.placa.toUpperCase() === placaKey);
    if (!candidates.length) return null;
    if (candidates.length === 1) return candidates[0];
    // Mais de uma rota com a mesma placa: desambigua
    // pool inicial = todas; refina por motorista se disponível
    let pool = candidates;
    if (tmRecord.motorista) {
      const firstName = tmRecord.motorista.trim().toLowerCase().split(/\s+/)[0];
      const byMot = candidates.filter(rt =>
        rt.motorista && rt.motorista.toLowerCase().includes(firstName)
      );
      if (byMot.length >= 1) pool = byMot;
    }
    // Prioridade dentro do pool:
    // 1) rota com prefixo '>' (ex: ">F9_AM1") = nome completo com XPT
    const withPrefix = pool.find(rt => (rt.rota || '').startsWith('>'));
    if (withPrefix) return withPrefix;
    // 2) Envios Extra transportadora
    const extra = pool.find(rt => (rt.transportadora || '').toLowerCase().includes('extra'));
    if (extra) return extra;
    // 3) Possui id_rota preenchido
    const withId = pool.find(rt => rt.id_rota && rt.id_rota !== '0');
    if (withId) return withId;
    return pool[0];
  }

  const tipoSections = Object.entries(byTipo).map(([tipo, recs]) => {
    const emR = recs.filter(r => r.status === 'started' || r.status === 'in_progress').length;
    const ag  = recs.filter(r => r.status === 'accepted' || r.status === 'waiting_acceptance').length;
    const sem = recs.filter(r => r.status === 'assigned').length;
    const fi  = recs.filter(r => r.status === 'finished').length;
    const re  = recs.filter(r => r.status === 'rejected' || r.status === 'refused').length;
    const summaryParts = [];
    if (emR) summaryParts.push(`<span style="color:#16a34a;font-weight:700">${emR} em rota</span>`);
    if (ag)  summaryParts.push(`<span style="color:#d97706;font-weight:700">${ag} aguand. aceite</span>`);
    if (sem) summaryParts.push(`<span style="color:var(--text3)">${sem} sem resposta</span>`);
    if (fi)  summaryParts.push(`<span style="color:var(--text3)">${fi} finalizado</span>`);
    if (re)  summaryParts.push(`<span style="color:#dc2626;font-weight:700">${re} recusado</span>`);

    // Cor da borda esquerda: alerta > recusado > em rota > normal
    const borderColor = ag ? '#d97706' : re ? '#dc2626' : emR ? '#16a34a' : 'var(--border)';

    const rows = recs.map(r => {
      const nomeColor  = r.motorista ? 'var(--text)' : 'var(--text3)';
      const nomeItalic = r.motorista ? '' : 'font-style:italic';
      const nomeText   = r.motorista || 'Sem nome';

      // WhatsApp — usa a mesma função do Em Andamento (busca por placa + motorista)
      const waLink = ctWhatsBtnHTML(r);

      // Botão de primeiro contato (📨) — sempre visível; muda de cor conforme status (vermelho=pendente / verde=enviado)
      const novatoBtn = (() => {
        const c = _ctAcharPorRota(r);
        if (!c || !c.tel) return '';
        const placa = (c.placa || r.placa || '').trim();
        const link = _novatosWhatsLink({
          nome: c.nome || r.motorista || '',
          placa: placa,
          tel: c.tel
        });
        if (!link) return '';
        const placaEsc = placa.replace(/'/g,"\\'");
        const jaEnviado = !!_novatosGetContatados()[placa];
        const bg    = jaEnviado ? '#16a34a' : '#dc2626';
        const title = jaEnviado ? 'Mensagem já enviada (clique para reenviar)' : 'Enviar mensagem de primeiro contato';
        return `<a href="${link}" target="_blank" rel="noopener noreferrer"
          id="novatoBtn_${placaEsc}"
          onclick="_novatosMarcarContatado('${placaEsc}');
                   const _b=document.getElementById('novatoBtn_${placaEsc}');
                   if(_b){_b.style.background='#16a34a';_b.title='Mensagem já enviada (clique para reenviar)';}"
          style="display:inline-flex;align-items:center;gap:2px;background:${bg};color:#fff;text-decoration:none;
                 padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;margin-left:4px;vertical-align:middle;
                 transition:background .2s"
          title="${title}">📨</a>`;
      })();

      // Cross-reference placa → rota de Em Andamento (prioriza motorista + Extra)
      const rotaMatch = _findRotaMatch(r);

      // Coluna ROTA / ETA — nome + ID numérico, ambos clicáveis
      const rotaDisplay = (() => {
        if (rotaMatch) {
          const rid  = rotaMatch.id_rota || rotaMatch.route_id || rotaMatch.idRota || rotaMatch.id_admin || rotaMatch.id || '';
          const cleanId = String(rid || '').replace(/\D/g, '');
          const url  = cleanId && cleanId !== '0'
            ? `https://envios.adminml.com/logistics/monitoring-distribution/detail/${cleanId}?site=MLB`
            : null;
          const nome = rotaMatch.rota || '—';
          const link = url
            ? `<a href="${url}" target="_blank" style="color:var(--accent);font-weight:700;font-size:12px;text-decoration:none">${nome}</a>`
            : `<span style="font-size:12px;font-weight:700;color:var(--text)">${nome}</span>`;
          const idHtml = cleanId && cleanId !== '0'
            ? `<span style="font-size:10px;color:var(--text3);margin-left:4px">·&nbsp;#${cleanId}</span>` : '';
          return link + idHtml;
        }
        if (r.cycle_id) return `<span style="font-size:12px;font-weight:700;color:var(--text)">${r.cycle_id}</span>`;
        return '—';
      })();
      const etaText = r.eta ? ` <span style="font-size:10px;color:var(--text3)">· ${r.eta}</span>` : '';

      // Coluna STATUS — badge clicável com nome da rota quando em rota
      // URL destino: monitoring-distribution/detail/{id_rota}?site=MLB
      const statusBadge = (() => {
        const s   = r.status || '';
        const cid = r.cycle_id || '';
        if (s === 'started' || s === 'in_progress') {
          // Monta URL direto: só usa id_rota (monitoring-distribution)
          const idRota = rotaMatch
            ? (rotaMatch.id_rota || rotaMatch.route_id || rotaMatch.idRota || rotaMatch.id_admin || rotaMatch.id || '')
            : (cid || '');
          const cleanId = String(idRota || '').replace(/\D/g, '');
          const url  = cleanId && cleanId !== '0'
            ? `https://envios.adminml.com/logistics/monitoring-distribution/detail/${cleanId}?site=MLB`
            : null;
          const nome = rotaMatch ? (rotaMatch.rota || (cid ? `Rota ${cid}` : 'Em rota'))
                                 : (cid ? `Rota ${cid}` : 'Em rota');
          const st = 'background:#16a34a;color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;text-decoration:none;display:inline-block';
          return url
            ? `<a href="${url}" target="_blank" style="${st}">🚗 ${nome}</a>`
            : `<span style="${st}">🚗 ${nome}</span>`;
        }
        return _tmBadge(r);

// ── Helpers ──────────────────────────────────────────────────────
function _isDispatched(r) {
  if (!r) return false;
  return r.status === 'em_curso' || r.status === 'concluida' ||
    (r.hora_primeiro_mov && r.hora_primeiro_mov !== '-');
}

function renderExtraEBA32Section(data, pastAlert) {
  const stationAtiva = (typeof _currentStation !== 'undefined') ? _currentStation : 'SES3';
  const extraXptIds = stationAtiva === 'SES2' ? ['EES5', 'EMG20'] : ['EBA32'];
  const logAll = extraXptIds.flatMap(xid => data.xpts?.[xid]?.todas || []);

  // Logistics lookup keyed by clean route id (strip leading >)
  const logLookup = {};
  logAll.forEach(r => {
    if (!r.rota) return;
    logLookup[r.rota.replace(/^>/, '').toLowerCase()] = r;
  });

  const pending = [], emRota = [];

  if (montagemData) {
    const montagemKeys = new Set();
    (montagemData.rotas || []).forEach(m => {
      if (!m.rota) return;
      const key = m.rota.toLowerCase();
      montagemKeys.add(key);
      const lr = logLookup[key];
      const obj = {
        rota: m.rota, nome: m.nome, modal: m.modal_key || m.tipo,
        placa: m.placa || lr?.placa, eta: m.eta, _lr: lr, _fromMontagem: true
      };
      (_isDispatched(lr) ? emRota : pending).push(obj);
    });
    // Extras in logistics NOT in montagem = sem aceite
    logAll.filter(r => r.tipo_entrega === 'me_extra' && r.rota).forEach(r => {
      const key = r.rota.replace(/^>/, '').toLowerCase();
      if (montagemKeys.has(key)) return;
      const obj = {
        rota: r.rota.replace(/^>/, ''), nome: r.motorista || null, modal: r.veiculo,
        placa: r.placa, eta: null, _lr: r, _fromMontagem: false, _semAceite: !r.motorista
      };
      (_isDispatched(r) ? emRota : pending).push(obj);
    });
  } else {
    // Fallback: montagem not loaded, use logistics extras only
    logAll.filter(r => r.tipo_entrega === 'me_extra' && r.rota).forEach(r => {
      const obj = {
        rota: r.rota.replace(/^>/, ''), nome: r.motorista || null, modal: r.veiculo,
        placa: r.placa, eta: null, _lr: r, _fromMontagem: false, _semAceite: !r.motorista
      };
      (_isDispatched(r) ? emRota : pending).push(obj);
    });
  }

  // KPI chips in header
  const total = pending.length + emRota.length;
  const alertPending = pastAlert && pending.length > 0;
  const kpiEl = document.getElementById('extra-eba32-kpis');
  if (kpiEl) {
    kpiEl.innerHTML =
      `<span><strong style="color:var(--purple);">${total}</strong> <span style="color:var(--text3);">planejadas</span></span>` +
      `<span style="color:var(--border2);">|</span>` +
      `<span><strong style="color:var(--green);">${emRota.length}</strong> <span style="color:var(--text3);">carregadas</span></span>` +
      `<span style="color:var(--border2);">|</span>` +
      `<span><strong style="color:${alertPending ? 'var(--red)' : 'var(--yellow)'};">${pending.length}</strong> <span style="color:var(--text3);">pendentes${alertPending ? ' ⚠️' : ''}</span></span>`;
  }

  const expCount = document.getElementById('extra-eba32-exp-count');
  if (expCount) expCount.textContent = pending.length + ' rotas';
  const monCount = document.getElementById('extra-eba32-mon-count');
  if (monCount) monCount.textContent = emRota.length + ' rotas';

  renderExtraExpedicaoBlock(pending, 'extra-eba32-expedicao', pastAlert, !!montagemData);
  renderExtraMonitoramentoBlock(emRota, 'extra-eba32-monitoramento');
}

function renderExtraNEXSection(nid, nexUnit, pastAlert) {

// ── BLOCO EXPEDIÇÃO ──────────────────────────────────────────────
function renderExtraExpedicaoBlock(routes, containerId, pastAlert, hasMontagem) {
  const el = document.getElementById(containerId);
  if (!el) return;

  if (!routes.length) {
    el.innerHTML = '<div class="empty" style="padding:16px;"><div class="empty-icon">✅</div>Todas as rotas já carregaram!</div>';
    return;
  }

  // Sort: sem aceite first, then alphabetical by rota
  routes.sort((a, b) => {
    const aNo = !a.nome, bNo = !b.nome;
    if (aNo && !bNo) return -1;
    if (!aNo && bNo) return 1;
    return (a.rota || '').localeCompare(b.rota || '');
  });

  const rows = routes.map(r => {
    const noAceite = !r.nome;
    const statusBadge = noAceite
      ? '<span class="badge badge-roxo">🔵 Sem aceite</span>'
      : pastAlert
        ? '<span class="badge badge-vermelho">🚨 Não carregou</span>'
        : '<span class="badge badge-amarelo">⏳ Aguardando</span>';

    const rowBg = noAceite
      ? 'rgba(168,139,250,0.05)'
      : pastAlert ? 'rgba(239,68,68,0.06)' : 'rgba(234,179,8,0.04)';

    const nomeHtml = r.nome
      ? `<span style="color:#fff;font-weight:500;">${r.nome}</span>`
        + (r._fromMontagem && !_isDispatched(r._lr)
           ? '<div style="font-size:10px;color:var(--text3);">aceite TM · aguard. scan</div>' : '')
      : '<span style="color:var(--text3);font-style:italic;">Sem aceite</span>';

    const lr = r._lr;
    const horaInicio = lr?.hora_inicio && lr.hora_inicio !== '-' ? lr.hora_inicio : null;

    return `<tr style="background:${rowBg};">
      <td>${rotaIdLink(r)}</td>
      <td>${nomeHtml}</td>
      <td style="color:var(--text2);font-size:11px;">${r.modal || '—'}</td>
      <td style="font-family:monospace;font-size:11px;color:var(--text3);">${r.placa || '—'}</td>
      <td style="font-family:monospace;font-size:11px;color:var(--purple);">${r.eta || (horaInicio ? `scan ${horaInicio}` : '—')}</td>
      <td>${statusBadge}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Rota</th><th>Motorista</th><th>Modal</th><th>Placa</th>
          <th>ETA / Scan</th><th>Status</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── BLOCO MONITORAMENTO ──────────────────────────────────────────
function renderExtraMonitoramentoBlock(routes, containerId) {
  const el = document.getElementById(containerId);
  if (!el) return;

  if (!routes.length) {
    el.innerHTML = '<div class="empty" style="padding:16px;"><div class="empty-icon">📭</div>Nenhuma rota em andamento ainda</div>';
    return;
  }

  // Annotate alerts
  const annotated = routes.map(r => {
    const lr = r._lr;
    const orhAlto    = (lr?.orh_min || 0) > ORH_CONTRATADO_MIN;
    const muitasFalhas = (lr?.falhas || 0) > 2;
    const muitosPend  = (lr?.pendentes || 0) > 10;
    const gpsInativo  = !!lr?.alerta_inatividade;
    return { ...r, _orhAlto: orhAlto, _falhas: muitasFalhas, _pend: muitosPend, _gps: gpsInativo,
      _alertCount: [orhAlto, muitasFalhas, muitosPend, gpsInativo].filter(Boolean).length };
  });

  // Sort: most alerts first, then by ORH descending
  annotated.sort((a, b) => b._alertCount - a._alertCount || ((b._lr?.orh_min||0) - (a._lr?.orh_min||0)));

  // Alert summary chips
  const chipDefs = [
    { fn: r => r._orhAlto,  icon:'⏱',  label:'ORH alto',        cls:'alert-chip-red'    },
    { fn: r => r._falhas,   icon:'❌',  label:'Com falhas',      cls:'alert-chip-red'    },
    { fn: r => r._pend,     icon:'📦',  label:'Muitos pendentes',cls:'alert-chip-yellow' },
    { fn: r => r._gps,      icon:'🅿️', label:'GPS inativo',     cls:'alert-chip-orange' },
  ];
  const chips = chipDefs
    .map(c => ({ ...c, count: annotated.filter(c.fn).length }))
    .filter(c => c.count > 0)
    .map(c => `<span class="alert-chip ${c.cls}">${c.icon} ${c.label}: ${c.count}</span>`)
    .join('');

  const rows = annotated.map(r => {
    const lr = r._lr;
    const temMov = lr?.hora_primeiro_mov && lr.hora_primeiro_mov !== '-';
    const rowBg = (r._orhAlto || r._gps) ? 'rgba(239,68,68,0.04)'
                : r._falhas ? 'rgba(239,68,68,0.03)'
                : r._pend   ? 'rgba(234,179,8,0.03)' : '';
    const alertIcons = [
      r._orhAlto ? '<span title="ORH acima do contrato" style="color:var(--red);font-size:15px;">⏱</span>' : '',
      r._falhas  ? '<span title="Muitas falhas" style="color:var(--red);font-size:15px;">❌</span>' : '',
      r._pend    ? '<span title="Muitos pendentes" style="color:var(--yellow);font-size:15px;">📦</span>' : '',
      r._gps     ? '<span title="GPS inativo / veículo parado" style="color:var(--orange);font-size:15px;">🅿️</span>' : '',
    ].filter(Boolean).join(' ') || '<span style="color:var(--text3);">—</span>';

    const nomeTxt = r.nome || lr?.motorista || '—';
    const pct = lr && (lr.total||0) > 0 ? Math.round((lr.entregues||0)/(lr.total||1)*100) : 0;

    return `<tr${rowBg ? ` style="background:${rowBg};"` : ''}>
      <td>${rotaIdLink(r)}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;" title="${nomeTxt}">${nomeTxt}</td>
      <td>
        <div style="font-family:monospace;font-size:11px;color:var(--blue);">${lr?.hora_inicio && lr.hora_inicio!=='-' ? lr.hora_inicio : '—'}</div>
        <div style="font-family:monospace;font-size:10px;color:${temMov?'var(--green)':'var(--text3)'};">${temMov ? '▶ '+lr.hora_primeiro_mov : 'aguard. GPS'}</div>
      </td>
      <td style="text-align:center;">
        <span style="color:var(--green);font-weight:700;">${lr?.entregues||0}</span>
        <span style="color:var(--text3);">/${lr?.total||0}</span>
        <div style="font-size:10px;color:var(--text3);">${pct}%</div>
      </td>
      <td style="color:${(lr?.falhas||0)>0?'var(--red)':'var(--text3)'};font-weight:${(lr?.falhas||0)>0?'700':'400'};text-align:center;">${lr?.falhas||0}</td>
      <td style="color:${(lr?.pendentes||0)>10?'var(--yellow)':'var(--text)'};text-align:center;">${lr?.pendentes||0}</td>
      <td style="font-family:monospace;font-size:11px;text-align:center;color:${r._orhAlto?'var(--red)':'var(--text2)'};">${fmtMin(lr?.orh_min)}</td>
      <td style="white-space:nowrap;">${alertIcons}</td>
    </tr>`;
  }).join('');

  el.innerHTML = `
    ${chips ? `<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;">${chips}</div>` : ''}
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Rota</th><th>Motorista</th><th>Início / GPS</th>
          <th style="text-align:center;">Entregas</th>
          <th style="text-align:center;">Falhas</th>
          <th style="text-align:center;">Pendentes</th>
          <th style="text-align:center;">ORH</th>
          <th>Alertas</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function renderFarolCards(routes, extraidoEm, containerId, pastAlert) {
  const container = document.getElementById(containerId);
  if (!container) return;

  const now = new Date(extraidoEm);
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const _pastAlert = pastAlert !== undefined ? pastAlert : (nowMin >= 10 * 60 + 30);

  if (!routes.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Nenhuma rota encontrada</div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'farol-grid';

  routes.forEach(r => {
    const temMovimento = r.hora_primeiro_mov && r.hora_primeiro_mov !== '-';
    const emCurso = r.status === 'em_curso';
    const noXpt = r.status === 'no_xpt';

    let cardClass = 'farol-card', statusLabel = '', statusColor = '';
    if (temMovimento || emCurso) {
      cardClass += ' ok'; statusLabel = '✅ Em rota'; statusColor = 'var(--green)';
    } else if (noXpt && _pastAlert) {
      cardClass += ' alerta'; statusLabel = '🚨 ALERTA — Não carregou'; statusColor = 'var(--red)';
    } else if (noXpt) {
      cardClass += ' atencao'; statusLabel = '⚠️ Aguardando carregamento'; statusColor = 'var(--yellow)';
    } else {
      cardClass += ' ok'; statusLabel = '▶ Em curso'; statusColor = 'var(--green)';
    }

    // Buscar rota planejada correspondente no cross-ref (EBA32)
    const execKey = (r.rota || '').replace(/^>/, '').toLowerCase();
    const planEntry = meExtraConfig?.eba32?.find(p => p.executada.toLowerCase() === execKey);
    const planLabel = planEntry ? `<div class="farol-rota-plan">Planejada: ${planEntry.planejada}</div>` : '';

    const card = document.createElement('div');
    card.className = cardClass;
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="farol-rota">${rotaIdLink(r)}</div>
          ${planLabel}
          <div class="farol-motorista" style="display:flex;align-items:center;gap:4px">${r.motorista || '—'}${ctWhatsBtnHTML(r)}</div>
        </div>
        <div style="font-size:11px;font-weight:700;color:${statusColor};text-align:right;max-width:140px;">${statusLabel}</div>
      </div>
      <div class="farol-info">
        <div class="farol-info-item"><label>1º Movimento</label><span style="color:${temMovimento ? 'var(--green)' : 'var(--red)'};">${r.hora_primeiro_mov || '—'}</span></div>
        <div class="farol-info-item"><label>Placa</label><span>${r.placa || '—'}</span></div>
        <div class="farol-info-item"><label>Pacotes</label><span>${r.entregues}/${r.total}</span></div>
        <div class="farol-info-item"><label>Tipo</label><span>${r.tipo_entrega || '—'}</span></div>
      </div>`;
    grid.appendChild(card);
  });

  const okCount = routes.filter(r => (r.hora_primeiro_mov && r.hora_primeiro_mov !== '-') || r.status === 'em_curso').length;
  const alertCount = routes.filter(r => r.status === 'no_xpt' && !(r.hora_primeiro_mov && r.hora_primeiro_mov !== '-')).length;

  const summary = document.createElement('div');
  summary.style.cssText = 'display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;';
  summary.innerHTML = `
    <div class="mini-stat"><div class="val" style="color:var(--purple)">${routes.length}</div><div class="lbl">Total</div></div>
    <div class="mini-stat"><div class="val" style="color:var(--green)">${okCount}</div><div class="lbl">Em rota</div></div>
    <div class="mini-stat"><div class="val" style="color:var(--red)">${alertCount}</div><div class="lbl">Não carregou${_pastAlert ? ' ⚠️' : ''}</div></div>`;
  container.innerHTML = '';
  container.appendChild(summary);
  container.appendChild(grid);
}

// ─── SUMMARY OPERACIONAL ─────────────────────────────────────────
function computeOperacaoStats(data) {
  // Fonte de verdade: todas_dia do payload (gerado pelo monitor_rotas.py)
  // Inclui TODAS as rotas do dia (XPT principais + NEx + SES3/SVC + concluídas
  // + a_caminho/LH), excluindo apenas as marcadas como "de amanhã".
  // É o mesmo universo que a admin mostra como "Rotas totais".
  const raw = window._rawDados || {};
  const todasDiaRaw = (raw.todas_dia || raw.top_geral || []).filter(r => !r.e_de_amanha);

  // allLM continua sendo o agregado por status (XPT + SVC + NEx, sem a_caminho)
  // Usado pra cálculos por XPT/MLP específicos abaixo
  const xptOrder = _xptsForStation();
  let allLM = [];
  xptOrder.forEach(xid => {
    const xpt = data.xpts[xid];
    if (!xpt) return;
    const rotas = (xpt.hoje || xpt.todas || []).filter(r => r.status !== 'a_caminho');
    allLM.push(...rotas);
  });
  (data.svc?.todas||[]).filter(r => r.status !== 'a_caminho').forEach(r => allLM.push(r));
  Object.values(data.nex||{}).forEach(nex => {
    (nex.todas||[]).filter(r => r.status !== 'a_caminho').forEach(r => allLM.push(r));
  });

  // Totais GERAIS — alinhados com a admin (todas_dia)
  // Estratégia: se o campo status estiver presente e mapeado, usa ele.
  // Senão, usa heurística baseada em pendentes/entregues:
  //   - Em andamento: pendentes>0 E (entregues>0 OU falhas>0)  -> driver na rua
  //   - Concluída:    pendentes===0 E (entregues+falhas)>0     -> finalizada
  //   - No XPT:       sem qualquer movimento ainda
  const _statusFromHeuristic = (r) => {
    const ent = r.entregues || 0;
    const fal = r.falhas || 0;
    const pen = r.pendentes || 0;
    const tot = ent + fal + pen;
    if (tot === 0) return 'no_xpt';
    // "Em andamento" só se ainda tem pacotes pendentes E o driver não está
    // numa fase quase-finalizada. Rotas com pendentes < 5 e DS alto
    // provavelmente já estão sendo encerradas — alinha melhor com a admin.
    if (pen === 0 && (ent + fal) > 0) return 'concluida';
    if (pen > 0 && pen <= 5 && (ent + fal) > pen * 5) return 'concluida'; // quase fim
    return 'em_curso';
  };
  const _norm = (r) => {
    const s = (r.status||'').toLowerCase();
    const mapEm = ['em_curso','em_rota','started','in_progress'];
    const mapCon = ['concluida','concluído','finished','closed'];
    const mapNo = ['no_xpt','aguardando','waiting'];
    if (mapEm.includes(s)) return 'em_curso';
    if (mapCon.includes(s)) return 'concluida';
    if (mapNo.includes(s)) return 'no_xpt';
    return _statusFromHeuristic(r);
  };
  // Em andamento: usa r.em_curso direto do bot se vier. Senão fallback heurística.
  const _isAndamento = (r) => {
    if (typeof r.em_curso === 'boolean') return r.em_curso;
    return _norm(r) === 'em_curso';
  };
  const _isConcluida = (r) => _norm(r) === 'concluida';
  const _isNoXpt     = (r) => _norm(r) === 'no_xpt';
  // Pacotes por rota: AGORA o bot já manda r.pacotes excluindo sacas (bate com admin)
  // Fallback: entregues+falhas+pendentes - sacas
  const _pacotes = (r) => {
    if (r.pacotes != null) return r.pacotes;
    const t = (r.entregues||0) + (r.falhas||0) + (r.pendentes||0);
    return Math.max(0, t - (r.sacas||0));
  };
  const _sacas = (r) => r.sacas || 0;

  const entregues = todasDiaRaw.reduce((s,r) => s+(r.entregues||0), 0);
  const falhas = todasDiaRaw.reduce((s,r) => s+(r.falhas||0), 0);
  const pendentes = todasDiaRaw.reduce((s,r) => s+(r.pendentes||0), 0);
  // Total de pacotes: usa o resumo se existir, senão calcula
  // Estação ativa (para pegar os totais OFICIAIS da API por estação)
  const _stAtiva = (typeof _currentStation !== 'undefined') ? _currentStation : 'SES3';
  // Pacotes: a API não devolve total oficial no summary (vem 0), então somamos
  // os pacotes das rotas da estação — bate com o "Pacotes" da admin (só difere
  // por timing). Só cai no resumo/campo agregado se não houver rotas.
  const _pkgOficial = Number((raw.pacotes_oficial_por_station || {})[_stAtiva]);
  const _pkgRouteSum = todasDiaRaw.reduce((s,r) => s+_pacotes(r), 0);
  const totalPkgs = (_pkgOficial > 0) ? _pkgOficial :
                    (_pkgRouteSum > 0) ? _pkgRouteSum :
                    (raw.resumo?.total_pacotes) || (raw.total_pacotes) ||
                    (entregues + falhas + pendentes);

  // "Rotas LM" = total OFICIAL da API por estação (mesmo número da admin em
  // "Rotas totais"). Cai para a contagem interna só se o campo não existir.
  const _oficialPorStation = raw.total_oficial_por_station || {};
  const _totalOficial = Number(_oficialPorStation[_stAtiva]);
  const total = (_totalOficial > 0) ? _totalOficial : todasDiaRaw.length;
  const emAndamento = todasDiaRaw.filter(_isAndamento).length;
  const concluidas = todasDiaRaw.filter(_isConcluida).length;
  const noXpt = todasDiaRaw.filter(_isNoXpt).length;
  const ds = totalPkgs > 0 ? (entregues / totalPkgs * 100) : 0;

  // Share Extra: % de rotas Envios Extra sobre o TOTAL GERAL do dia.
  // Reusa todasDiaRaw — mesmo universo que a admin mostra como "Rotas totais".
  const totalDiaGeral = (_totalOficial > 0) ? _totalOficial : todasDiaRaw.length;
  const rotasExtra = todasDiaRaw.filter(r => {
    const t = (r.transportadora||'').toLowerCase();
    return t.includes('envios extra') || t.includes('envios e');
  }).length;
  const shareExtra = totalDiaGeral > 0 ? (rotasExtra / totalDiaGeral * 100) : 0;
  const orhcRoutes = allLM.filter(r => (r.orh_min||0) > 0 && (r.orh_min||0) <= ORH_CONTRATADO_MIN);
  const rotasComOrh = allLM.filter(r => (r.orh_min||0) > 0).length;
  const orhc = rotasComOrh > 0 ? orhcRoutes.reduce((s,r)=>s+(r.total||0),0) / rotasComOrh : null;

  // Per-XPT: rotas do dia (hoje), excluindo a_caminho
  const perXpt = {};
  xptOrder.forEach(xid => {
    const xpt = data.xpts[xid];
    if (!xpt) return;
    const rotas = (xpt.hoje||xpt.todas||[]).filter(r => r.status !== 'a_caminho');
    const pkg = rotas.reduce((s,r)=>s+(r.total||0),0);
    const ent = rotas.reduce((s,r)=>s+(r.entregues||0),0);
    const fal = rotas.reduce((s,r)=>s+(r.falhas||0),0);
    const pen = rotas.reduce((s,r)=>s+(r.pendentes||0),0);
    perXpt[xid] = { total: rotas.length, pkg, ent, fal, pen, ds: pkg>0 ? ent/pkg*100 : 0 };
  });

  return { total, emAndamento, concluidas, noXpt, totalPkgs, entregues, falhas, pendentes, ds, orhc, perXpt, shareExtra, rotasExtra, totalDiaGeral };
}

let _hhData = null;

function renderHoraHoraTab(data) {
  _hhData = data;
  // Populate carrier filter
  const carriers = new Set();
  Object.values(data.xpts).forEach(xpt => {
    (xpt.hoje||xpt.todas||[]).forEach(r => { if(r.transportadora) carriers.add(r.transportadora); });
  });
  const sel = document.getElementById('hh-carrier');
  if (sel && sel.options.length <= 1) {
    [...carriers].sort().forEach(c => {
      const o = document.createElement('option');
      o.value = c; o.textContent = c;
      sel.appendChild(o);
    });
  }
  renderHoraHoraTable();
}

function renderHoraHoraTable() {
  if (!_hhData) return;
  const xptFilter = document.getElementById('hh-xpt')?.value || 'todos';
  const carrierFilter = document.getElementById('hh-carrier')?.value || 'todos';

  // Collect routes
  let routes = [];
  const xptOrder = _xptsForStation();
  xptOrder.forEach(xid => {
    if (xptFilter !== 'todos' && xid !== xptFilter) return;
    const xpt = _hhData.xpts[xid];
    if (!xpt) return;
    (xpt.hoje||xpt.todas||[]).filter(r => {
      if (r.status === 'a_caminho') return false; // Exclui Line Haul de todos os XPTs
      if (carrierFilter !== 'todos' && r.transportadora !== carrierFilter) return false;
      return true;
    }).forEach(r => routes.push({...r, _xpt: xid}));
  });

  // Group by hour of hora_primeiro_mov
  const byHora = {};
  routes.forEach(r => {
    const h = r.hora_primeiro_mov && r.hora_primeiro_mov !== '-'
      ? r.hora_primeiro_mov.split(':')[0].padStart(2,'0')
      : '—';
    if (!byHora[h]) byHora[h] = [];
    byHora[h].push(r);
  });

  // Sort hours: '—' last
  const horas = Object.keys(byHora).sort((a,b) => {
    if (a==='—') return 1; if (b==='—') return -1; return a.localeCompare(b);
  });

  const totals = { rotas:0, pkg:0, ent:0, fal:0, pen:0, orh:[], stem:[] };
  const dsAlert = []; // XPTs com DS baixo

  const tbody = document.getElementById('tbody-horahora');
  if (!tbody) return;

  tbody.innerHTML = horas.map(h => {
    const grp = byHora[h];
    const rotas = grp.length;
    const pkg = grp.reduce((s,r)=>s+(r.total||0),0);
    const ent = grp.reduce((s,r)=>s+(r.entregues||0),0);
    const fal = grp.reduce((s,r)=>s+(r.falhas||0),0);
    const pen = grp.reduce((s,r)=>s+(r.pendentes||0),0);
    const ds = pkg>0 ? (ent/pkg*100) : 0;
    const orhs = grp.map(r=>r.orh_min||0).filter(v=>v>0);
    const stems = grp.map(r=>r.stem_out_min||0).filter(v=>v>0);
    const orghMed = orhs.length ? Math.round(orhs.reduce((a,b)=>a+b,0)/orhs.length) : 0;
    const stemMed = stems.length ? Math.round(stems.reduce((a,b)=>a+b,0)/stems.length) : 0;

    // Ofensores (routes with falhas > 3)
    const ofensores = grp.filter(r=>(r.falhas||0)>3).map(r=>`${r.rota}(${r.falhas}f)`).join(', ');

    totals.rotas+=rotas; totals.pkg+=pkg; totals.ent+=ent; totals.fal+=fal; totals.pen+=pen;
    if(orghMed) totals.orh.push(orghMed); if(stemMed) totals.stem.push(stemMed);

    const dsColor = ds >= 70 ? 'var(--green)' : ds >= 50 ? 'var(--yellow)' : 'var(--red)';
    const rowClass = h==='—' ? '' : '';

    return `<tr>
      <td style="font-weight:700;font-family:monospace;">${h !== '—' ? h+'h' : '⏳ Não iniciadas'}</td>
      <td style="text-align:center;">${rotas}</td>
      <td style="text-align:center;color:var(--text2);">${pkg.toLocaleString('pt-BR')}</td>
      <td style="text-align:center;color:var(--green);">${ent.toLocaleString('pt-BR')}</td>
      <td style="text-align:center;color:${fal>0?'var(--red)':'var(--text3)'};">${fal||'—'}</td>
      <td style="text-align:center;color:${pen>0?'var(--yellow)':'var(--text3)'};">${pen>0?pen.toLocaleString('pt-BR'):'—'}</td>
      <td style="text-align:center;font-weight:700;color:${dsColor};">${pkg>0?ds.toFixed(1)+'%':'—'}</td>
      <td style="text-align:center;color:${orghMed>ORH_CONTRATADO_MIN?'var(--red)':'var(--text)'};">${fmtMin(orghMed)}</td>
      <td style="text-align:center;">${fmtMin(stemMed)}</td>
      <td style="font-size:11px;color:var(--text3);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${ofensores}">${ofensores||'—'}</td>
    </tr>`;
  }).join('') + (routes.length > 0 ? `
    <tr style="background:var(--bg3);font-weight:700;border-top:2px solid var(--border2);">
      <td style="color:var(--text);">TOTAL</td>
      <td style="text-align:center;">${totals.rotas}</td>
      <td style="text-align:center;color:var(--accent);">${totals.pkg.toLocaleString('pt-BR')}</td>
      <td style="text-align:center;color:var(--green);">${totals.ent.toLocaleString('pt-BR')}</td>
      <td style="text-align:center;color:var(--red);">${totals.fal||'—'}</td>
      <td style="text-align:center;color:var(--yellow);">${totals.pen>0?totals.pen.toLocaleString('pt-BR'):'—'}</td>
      <td style="text-align:center;font-weight:800;color:${totals.pkg>0&&totals.ent/totals.pkg*100>=70?'var(--green)':'var(--yellow)'};">${totals.pkg>0?(totals.ent/totals.pkg*100).toFixed(1)+'%':'—'}</td>
      <td style="text-align:center;">${fmtMin(totals.orh.length?Math.round(totals.orh.reduce((a,b)=>a+b,0)/totals.orh.length):0)}</td>
      <td style="text-align:center;">${fmtMin(totals.stem.length?Math.round(totals.stem.reduce((a,b)=>a+b,0)/totals.stem.length):0)}</td>
      <td></td>
    </tr>` : '');

  // XPT Breakdown
  renderHoraHoraXptBreakdown(xptFilter, carrierFilter);
}

        return true;
      });

      const total = rotas.length;
      const pkg = rotas.reduce((s,r)=>s+(r.total||0),0);

      const conc = rotas.filter(r=>r.status==='concluida').length;
      const ds = pkg>0 ? ent/pkg*100 : 0;
      const orhcCount = rotas.filter(r=>(r.orh_min||0)>0&&(r.orh_min||0)<=ORH_CONTRATADO_MIN).length;
      const rotasComOrh = rotas.filter(r=>(r.orh_min||0)>0).length;
      const orhcPct = rotasComOrh>0 ? (orhcCount/rotasComOrh*100).toFixed(1)+'%' : '—';

              <span>${total} rotas LM</span>
              <span style="color:var(--purple);">ORHc: ${orhcPct}</span>
              ${inativas>0?`<span style="color:var(--red);">🅿️${inativas} inativas</span>`:''}

          <div class="section-body" style="padding:14px 20px;">

function fmtMin(min) {
  if (!min || min <= 0) return '—';
  const h = Math.floor(min / 60), m = min % 60;
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}` : m + 'min';
}

function _getSDRoutes(data) {
  const raw = window._rawDados || {};
  const out = [];
  const seen = new Set();
  const push = r => {
    if (!r) return;
    const og = String(r.origem || r.xpt || r.origem_id || '').toUpperCase();
    const rota = String(r.rota || r.nome_rota || '').toUpperCase();
    if (og !== 'SD' && !rota.endsWith('_SD')) return;
    const key = String(r.id_rota || r.id || r.route_id || r.rota || r.nome_rota || JSON.stringify(r));
    if (seen.has(key)) return;
    seen.add(key);
    out.push(r);
  };
  (raw.todas_dia || raw.top_geral || []).forEach(push);
  const sdExp = (raw.xpts_expedicao && raw.xpts_expedicao.SD) || (data && data.xpts && data.xpts.SD);
  if (sdExp) {
    ['todas','a_caminho','no_xpt','em_curso','concluidas'].forEach(k => (sdExp[k] || []).forEach(push));
  }
  return out;
}

function renderSDTab(data) {
  const rowsAll = _getSDRoutes(data);
  const raw = window._rawDados || {};
  const sdReport = raw.reporte_sd || data?._reporte_sd || {};
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  const totalRotas = rowsAll.length || sdReport.total_rotas || 0;
  const expedidas = rowsAll.filter(r => r.status === 'em_curso').length;
  const concluidas = rowsAll.filter(r => r.status === 'concluida').length;
  const pacotes = sdReport.total_pacotes || rowsAll.reduce((s,r)=>s+(r.total||0),0);
  const falhas = sdReport.total_falhas || rowsAll.reduce((s,r)=>s+(r.falhas||0),0);
  const ds = sdReport.delivery_success || (pacotes ? ((rowsAll.reduce((s,r)=>s+(r.entregues||0),0) / pacotes) * 100) : 0);

  set('sd-total', totalRotas);
  set('sd-expedidas', expedidas);
  set('sd-concluidas', concluidas);
  set('sd-pacotes', Number(pacotes || 0).toLocaleString('pt-BR'));
  set('sd-falhas', falhas);
  set('sd-ds', `${Number(ds || 0).toFixed(1).replace('.', ',')}%`);
  set('sd-status', raw.atualizado ? `Atualizado: ${raw.atualizado}` : '');

  const render = () => {
    const q = (document.getElementById('sd-search')?.value || '').trim().toLowerCase();
    const st = document.getElementById('sd-status-filter')?.value || '';
    const rows = rowsAll.filter(r => {
      if (st && r.status !== st) return false;

      return [r.rota, r.nome_rota, r.id, r.id_rota, r.motorista, r.placa, r.transportadora, r.veiculo]

  render();
}

const _expCharts = {};

function renderExpedicaoTab(data) {
  const pad2 = n => String(n).padStart(2,'0');
  _xptsForStation().forEach(xid => {
    const xpt = data.xpts[xid];
    if (!xpt) return;
    // Expedidas = rotas em_curso ou concluidas com hora_inicio (quando foram ativadas no LM)
    // Usa hora_inicio (initDate) como referência de expedição — capta o momento que a rota
    // foi liberada no XPT, independente de o motorista já ter movido o veículo.
    const expedidas = (xpt.hoje||xpt.todas||[]).filter(r =>
      (r.status === 'em_curso' || r.status === 'concluida') &&
      r.hora_inicio && r.hora_inicio !== '-'
    );
    if (!expedidas.length) return;

    // Usa hora_inicio para agrupar por hora de expedição
    const getHoraExp = r => r.hora_inicio !== '-' ? r.hora_inicio : (r.hora_primeiro_mov||'00:00');

    // Group by hour
    const porHora = {};
    expedidas.forEach(r => {
      const h = parseInt(getHoraExp(r).split(':')[0], 10);
      porHora[h] = (porHora[h]||0) + 1;
    });
    const horas = Object.keys(porHora).map(Number).sort((a,b)=>a-b);
    const horaMin = horas[0], horaMax = horas[horas.length-1];

    // Real first/last times (hora de expedição = hora_inicio)
    const times = expedidas.map(r => getHoraExp(r)).sort();
    const primeiraExp = times[0]||'—', ultimaExp = times[times.length-1]||'—';
    const totalExp = expedidas.length;
    const duracao = horaMax - horaMin + 1;
    const velMedia = (totalExp / duracao).toFixed(1);
    const pico = horas.reduce((mx,h) => porHora[h]>porHora[mx] ? h : mx, horas[0]);

    // Update KPIs
    const set = (id,v) => { const el=document.getElementById(id); if(el) el.textContent=v; };
    set('exp-ini-'+xid, primeiraExp);
    set('exp-fim-'+xid, ultimaExp);
    set('exp-tot-'+xid, totalExp);
    set('exp-vel-'+xid, velMedia+'/h');
    set('exp-pico-'+xid, pad2(pico)+'h ('+porHora[pico]+')');

    // Build full hour range
    const allHoras = [];
    for (let h=horaMin; h<=horaMax; h++) allHoras.push(h);

    if (_expCharts[xid]) { _expCharts[xid].destroy(); delete _expCharts[xid]; }
    const canvas = document.getElementById('chart-exp-'+xid);
    if (!canvas) return;

    _expCharts[xid] = new Chart(canvas.getContext('2d'), {
      type: 'bar',
      data: {
        labels: allHoras.map(h => pad2(h)+'h'),
        datasets: [{
          data: allHoras.map(h => porHora[h]||0),
          backgroundColor: allHoras.map(h => h===pico ? 'rgba(239,68,68,0.85)' : 'rgba(99,102,241,0.65)'),
          borderRadius: 5, borderSkipped: false
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor:'#1a1a2e', borderColor:'#35355a', borderWidth:1, padding:10,
            callbacks: {
              title: ctx => ctx[0].label,
              label: ctx => ` ${ctx.raw} rota${ctx.raw!==1?'s':''} expedida${ctx.raw!==1?'s':''}`
            }
          }
        },
        scales: {
          y: { beginAtZero:true, ticks:{color:'#606080',stepSize:1,precision:0}, grid:{color:'#1e1e32'} },
          x: { ticks:{color:'#606080'}, grid:{display:false} }
        }
      }
    });
  });
}

        <button class="orh-btn" data-orh="gt4h" onclick="setAndamentoOrhFilter('gt4h')"

        <button class="orh-btn" data-orh="gt6h" onclick="setAndamentoOrhFilter('gt6h')"

              onclick="this.checked?selectAllAndamento():clearAndamentoSelection()"
              title="Marcar/desmarcar todas">
          </th>

          <th style="text-align:center;">Entregues</th>
          <th style="text-align:center;">Falhas</th>

          <th style="text-align:center;">Stem Out</th>
          <th style="text-align:center;">OZH</th>
          <th style="text-align:center;">ORH</th>
          <th style="text-align:center;color:var(--purple);" title="Dentro do tempo contratado (8h48min)">ORHc</th>
          <th>Status / Alertas</th>

}

function buildAndamentoFilterFns() {
  return {
    todas: () => true,
    inativas: r => !!r.alerta_inatividade,
    stem_alto: r => (r.stem_out_min||0) > 180,
    mais_falhas: r => (r.falhas||0) > 0,
    // Falha sem tentativa: usa campo direto da API quando disponível; cai no proxy (comercial+falha) quando não tem
    sem_tentativa: r => (r.sem_tentativa_count > 0) || (!!r.alerta_comercial && (r.falhas||0) > 0),
    // Aptas encerrar: em_curso + 0 pendentes (motorista entregou tudo, rota ainda aberta no sistema)
    // O bookmarklet agora usa r.status da API: 'concluida' = oficialmente encerrada; 'em_curso' com pendentes=0 = apta
    aptas_encerrar: r => ((r.status === 'em_curso' && (r.pendentes||0) === 0 && (r.total||0) > 0)
                          || r.status === 'concluida'),
    mais_pendentes: r => (r.pendentes||0) > 10,
  };
}

function setAndamentoFilter(filter) {
  _andamentoFilter = filter;
  document.querySelectorAll('#andamento-filters .qfilter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === filter);
  });
  renderAndamentoTable();
}

function renderAndamentoTab(data) {
  _andamentoData = [];
  if (!buildAndamentoFilterFns()[_andamentoFilter]) _andamentoFilter = 'todas';
  _xptsForStation().forEach(xid => {
    const xpt = data.xpts[xid];
    if (!xpt) return;
    // Em andamento: apenas em_curso (concluidas = oficialmente encerradas pela API, fora do scope)
    (xpt.hoje||xpt.todas||[]).filter(r => r.status === 'em_curso').forEach(r => _andamentoData.push({...r, _xpt: xid}));
  });
  // SVC-direct MLP routes — pega rotas INDIVIDUAIS do todas_dia
  // (origem vazia = direto do SES3 = SVC). So mostra rotas OPERACIONAIS
  // (em_curso, no_xpt). Concluidas ficam FORA da aba Em Andamento — rota
  // ja encerrada nao precisa mais de monitoramento. Total exibido pode
  // ser menor que o "No origem: SC" do admin (que inclui concluidas) —
  // isso e proposital: aqui so mostramos o que ainda exige acao.
  const rawAll = (window._rawDados?.todas_dia || []);
  // Set de origens "proprias" — XPTs + NEX/DC da station ativa.
  // Rotas com essas origens nao entram na coleta SVC do Em Andamento.
  const xptComOrigemPropria = new Set([
    ..._xptsForStation(),
    // NEX SES3
    'BRNES124','BRNES73','BRNES464','BRDES73','BRDES6818',
    // NEX SES2
    'BRNES10','BRNES87','BRNES6769',
    // DC SES2
    'BRDES6805','BRDES6810','BRDES6768','BRDES6807','BRDES10',
  ]);
  rawAll
    .filter(r => !r.e_de_amanha)
    .filter(r => r.em_curso || r.status === 'em_curso' || r.status === 'no_xpt')
    .filter(r => {
      const og = (r.origem || '').trim();
      // SVC = sem origem (direto SES3) OU origem que NÃO está nos XPTs principais/NEx
      return !og || !xptComOrigemPropria.has(og);
    })
    .forEach(r => _andamentoData.push({...r, status: r.em_curso ? 'em_curso' : r.status, _xpt: 'SVC'}));
  _andamentoData.sort((a,b) => (b.falhas||0)-(a.falhas||0));

  // Compute filter counts
  const fns = buildAndamentoFilterFns();
  Object.entries(fns).forEach(([k,fn]) => {
    const el = document.getElementById('qc-'+k);
    if (el) el.textContent = _andamentoData.filter(fn).length;
  });

  // Also update "todas" count
  const elT = document.getElementById('qc-todas');
  if (elT) elT.textContent = _andamentoData.length;

  const search = document.getElementById('andamento-search');
  const xptSel = document.getElementById('andamento-xpt');
  const sortSel = document.getElementById('andamento-sort');
  if (search) search.addEventListener('input', renderAndamentoTable);
  if (xptSel) xptSel.addEventListener('change', renderAndamentoTable);
  if (sortSel) sortSel.addEventListener('change', renderAndamentoTable);

  document.querySelectorAll('#andamento-filters .qfilter-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.filter === _andamentoFilter);
  });

  // Marca o botão Extra ativo conforme o estado persistido
  document.querySelectorAll('#andamento-extra-toggle .extra-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.extra === _andamentoExtraFilter);
  });
  // Marca o botão ORH ativo conforme o estado persistido (com whitelist defensivo)
  if (!['todas','gt4h','gt6h','fora_ctt'].includes(_andamentoOrhFilter)) _andamentoOrhFilter = 'todas';
  document.querySelectorAll('#andamento-orh-toggle .orh-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.orh === _andamentoOrhFilter);
  });

  renderAndamentoTable();
}

function renderAndamentoTable() {
  const search = (document.getElementById('andamento-search')?.value||'').toLowerCase();
  const xptFilter = document.getElementById('andamento-xpt')?.value||'';
  const fns = buildAndamentoFilterFns();
  const mainFn = fns[_andamentoFilter] || fns.todas;

  let rows = _andamentoData.filter(r => {
    if (!mainFn(r)) return false;
    // Filtro Extra (toggle Tudo / Com Extra / Sem Extra)
    if (_andamentoExtraFilter === 'com_extra' && r.tipo_entrega !== 'me_extra') return false;
    if (_andamentoExtraFilter === 'sem_extra' && r.tipo_entrega === 'me_extra') return false;
    // Filtro ORH (limiar de severidade)
    if (_andamentoOrhFilter !== 'todas') {
      const minutosOrh = Number(r.orh_min || r.orh_minutos || 0);
      const limiar = _ORH_THRESHOLDS[_andamentoOrhFilter] || 0;
      if (!(minutosOrh > limiar)) return false;
    }
    if (xptFilter) {
      if (xptFilter.startsWith('SVC:')) {
        // Match case-insensitive + substring — pq a API retorna nomes longos
        // tipo "PARCEIRO SPOT SOLUCOES" e o dropdown tem "Parceiro Spot".
        // Antes era === literal, sempre falhava → 0 rotas.
        const mlpName = xptFilter.slice(4).toLowerCase().trim();
        const tcpReal = (r.transportadora || '').toLowerCase().trim();
        if (r._xpt !== 'SVC' || !tcpReal.includes(mlpName)) return false;
      } else {
        if (r._xpt !== xptFilter) return false;
      }
    }
    if (search) {
      if (![r.rota,r.motorista,r.transportadora,r.placa,r._xpt].join(' ').toLowerCase().includes(search)) return false;
    }
    return true;
  });

  // Ordenação por dropdown (prioridade sobre quick-filter)
  const sortDropdown = document.getElementById('andamento-sort')?.value || '';
  const dropSortMap = {
    entregues_desc: (a,b)=>(b.entregues||0)-(a.entregues||0),
    entregues_asc:  (a,b)=>(a.entregues||0)-(b.entregues||0),
    falhas_desc:    (a,b)=>(b.falhas||0)-(a.falhas||0),
    falhas_asc:     (a,b)=>(a.falhas||0)-(b.falhas||0),
    pendentes_desc: (a,b)=>(b.pendentes||0)-(a.pendentes||0),
    pendentes_asc:  (a,b)=>(a.pendentes||0)-(b.pendentes||0),
    stem_desc:      (a,b)=>(b.stem_out_min||0)-(a.stem_out_min||0),
    stem_asc:       (a,b)=>(a.stem_out_min||0)-(b.stem_out_min||0),
    ozh_desc:       (a,b)=>(b.ozh_min||0)-(a.ozh_min||0),
    ozh_asc:        (a,b)=>(a.ozh_min||0)-(b.ozh_min||0),
    orh_desc:       (a,b)=>(b.orh_min||0)-(a.orh_min||0),
    orh_asc:        (a,b)=>(a.orh_min||0)-(b.orh_min||0),
    orhc_fora:      (a,b)=>{
      const aFora = (a.orh_min||0) > ORH_CONTRATADO_MIN ? 1 : 0;
      const bFora = (b.orh_min||0) > ORH_CONTRATADO_MIN ? 1 : 0;
      if (aFora !== bFora) return bFora - aFora;
      return (b.orh_min||0) - (a.orh_min||0);
    },
  };

  const sortMap = {
    mais_falhas: (a,b)=>(b.falhas||0)-(a.falhas||0),
    mais_pendentes: (a,b)=>(b.pendentes||0)-(a.pendentes||0),
    stem_alto: (a,b)=>(b.stem_out_min||0)-(a.stem_out_min||0),
    inativas: (a,b)=>(b.orh_min||0)-(a.orh_min||0),
    aptas_encerrar: (a,b)=>(b.entregues||0)-(a.entregues||0),
    sem_tentativa: (a,b)=>(b.falhas||0)-(a.falhas||0),
  };

  if (dropSortMap[sortDropdown]) {
    rows.sort(dropSortMap[sortDropdown]);
  } else if (sortMap[_andamentoFilter]) {
    rows.sort(sortMap[_andamentoFilter]);
  }

  const countEl = document.getElementById('andamento-count');
  if (countEl) countEl.textContent = rows.length+' rota'+(rows.length!==1?'s':'');

  const tbody = document.getElementById('tbody-andamento');
  if (!tbody) return;

  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="12"><div class="empty"><div class="empty-icon">✅</div>Nenhuma rota com este filtro</div></td></tr>`;
    return;
  }

  tbody.innerHTML = rows.map(r => {
    const cfg = XPT_CONFIG[r._xpt]||{};
    const stemMin = (r.stem_out_min||0);
    // Thresholds visuais: >=3h = laranja (atenção). >=4h = vermelho (crítico).
    const stemAlto = stemMin > 180;     // >3h
    const stemCritico = stemMin >= 240; // >=4h
    const stemColorClass = stemCritico ? 'stem-red' : (stemAlto ? 'stem-orange' : '');
    const apta = r.status === 'em_curso' && (r.pendentes||0) === 0 && (r.total||0) > 0;
    const rowClass = r.alerta_inatividade ? 'row-alert' : stemAlto ? 'row-warn' : '';
    const isExtra = r.tipo_entrega === 'me_extra';
    const xptBadge = r._xpt === 'SVC' ? 'badge-laranja' : cfg.tipo === 'D0' ? 'badge-azul' : 'badge-roxo';

    const orhDentro = (r.orh_min||0) > 0 && (r.orh_min||0) <= ORH_CONTRATADO_MIN;
    const orhFora   = (r.orh_min||0) > ORH_CONTRATADO_MIN;
    const orhcBadge = r.orh_min > 0
      ? (orhDentro ? '<span style="color:var(--green);font-weight:700;">✓</span>' : '<span style="color:var(--red);font-weight:700;">✗</span>')
      : '—';

    const alertIcons = [
      r.alerta_inatividade ? '<span title="Veículo inativo">🅿️</span>' : '',
      r.alerta_atraso ? '<span title="Atraso na rota">⏰</span>' : '',
      r.alerta_comercial ? '<span title="Parada comercial pendente">🏪</span>' : '',
      stemAlto ? '<span title="Stem Out acima de 3h">⚠️</span>' : '',
      apta ? '<span title="Sem pendentes — apta p/ encerrar">✅</span>' : '',
    ].filter(Boolean).join(' ')||'';

    // Botão "Encerrar rota" → só pra rotas aptas com id_rota válido
    const _idApta = r.id_rota || r.idRota || r.route_id || (typeof r.id === 'number' || /^\d+$/.test(String(r.id||'')) ? r.id : null);
    const encerrarBtn = (apta && _idApta)
      ? ` <a href="https://envios.adminml.com/logistics/service-center/return-to-station?route_id=${_idApta}&sc=SES3"
            target="_blank" rel="noopener noreferrer"
            class="encerrar-btn"
            title="Abrir página de encerramento da rota (return-to-station)">🔚 Encerrar</a>`
      : '';

    // Badge tem prioridade: concluida (verde "Concluída") > apta_encerrar
    // (cinza "Apta Encerrar" + botao 🔚) > no_xpt (laranja "Aguardando") >
    // fallback "Em rota". Rotas concluidas SEMPRE mostram "Concluída" mesmo
    // se cairem na regra de apta — evita confundir usuario que viu a rota
    // como fechada no admin.
    const statusBadgeAndamento = r.status === 'concluida'
      ? `<span class="badge badge-verde" style="font-size:10px;">✅ Concluída</span>${encerrarBtn}`
      : apta
        ? `<span class="badge badge-cinza" style="font-size:10px;">✅ Apta Encerrar</span>${encerrarBtn}`
        : r.status === 'no_xpt'
          ? '<span class="badge badge-laranja" style="font-size:10px;">⏸ Aguardando</span>'
          : '<span class="badge badge-verde" style="font-size:10px;">▶ Em rota</span>';

    const _rKey = _ttToKey(r);
    const _rKeyAttr = String(_rKey).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    const _checked = _andamentoSelected.has(_rKey) ? 'checked' : '';
    return `<tr class="${rowClass}">
      <td style="text-align:center;padding:6px;">
        <input type="checkbox" class="rota-checkbox" data-key="${_rKeyAttr}" ${_checked}
          onclick="toggleAndamentoCheck(this, this.dataset.key)">
      </td>
      <td><span class="badge ${xptBadge}">${r._xpt}</span></td>
      <td>
        ${rotaIdLink(r)}
        ${isExtra?'<span class="badge badge-roxo" style="font-size:9px;margin-left:4px;">Extra</span>':''}
      </td>
      <td>
        <div style="font-size:11px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.transportadora||''}">${r.transportadora||'—'}</div>
        <div style="font-size:11px;color:var(--text2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:2px" title="${r.motorista||''}">${r.motorista||'—'}${ctWhatsBtnHTML(r)}</div>
      </td>
      <td style="color:#16a34a;font-weight:800;text-align:center;font-size:16px;">${r.entregues||0}</td>
      <td style="color:${(r.falhas||0)>0?'#dc2626':'#374151'};font-weight:800;text-align:center;font-size:16px;">${r.falhas||0}</td>
      <td style="color:${(r.pendentes||0)>10?'#d97706':(r.pendentes||0)===0?'#374151':'#111827'};text-align:center;font-size:16px;font-weight:800;">${r.pendentes||0}</td>
      <td class="time-val ${stemColorClass}" style="text-align:center;font-size:16px;font-weight:800;color:${stemCritico?'#b91c1c':stemAlto?'#ea580c':'#111827'};">${fmtMin(r.stem_out_min)}</td>
      <td class="time-val" style="text-align:center;font-size:16px;font-weight:800;color:#111827;">${fmtMin(r.ozh_min)}</td>
      <td class="time-val${orhFora?' time-alert':''}" style="text-align:center;font-size:16px;font-weight:800;color:${orhFora?'#b91c1c':'#111827'};">${fmtMin(r.orh_min)}</td>
      <td style="text-align:center;font-size:16px;">${orhcBadge}</td>
      <td style="font-size:13px;white-space:nowrap;">${statusBadgeAndamento} ${alertIcons}</td>
    </tr>`;
  }).join('');
  // Re-sincroniza a barra de bulk depois do render
  refreshAndamentoBulkBar();
}

// ─── MODO AMPLIAR ────────────────────────────────────────────────
function toggleAndamentoZoom() {
  const tbl = document.getElementById('table-andamento');
  const btn = document.getElementById('btn-zoom-andamento');
  if (!tbl || !btn) return;
  const isZoom = tbl.classList.toggle('zoom-mode');
  btn.textContent = isZoom ? '📸 Normal' : '📸 Ampliar';
  btn.style.background = isZoom ? 'var(--purple-bg)' : 'var(--bg)';
  btn.style.borderColor = isZoom ? 'var(--purple-border)' : 'var(--border2)';
  btn.style.color = isZoom ? 'var(--purple)' : 'var(--text)';
}

// ─── EXTRA FAROL ─────────────────────────────────────────────────
function renderExtraFarol(extras, extraidoEm) {
  const container = document.getElementById('farol-extra-body');
  if (!container) return;

  const now = new Date(extraidoEm);
  const alertThreshold = 10 * 60 + 30; // 10:30
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const pastAlert = nowMin >= alertThreshold;

  if (!extras.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">✅</div>Nenhuma rota Extra encontrada</div>';
    return;
  }

  const grid = document.createElement('div');
  grid.className = 'farol-grid';

  extras.forEach(r => {
    const temMovimento = r.hora_primeiro_mov && r.hora_primeiro_mov !== '-';
    const noXpt = r.status === 'no_xpt';

    let cardClass = 'farol-card';
    let statusLabel = '';
    let statusColor = '';

    if (temMovimento) {
      cardClass += ' ok';
      statusLabel = '✅ Em rota';
      statusColor = 'var(--green)';
    } else if (noXpt && pastAlert) {
      cardClass += ' alerta';
      statusLabel = '🚨 ALERTA — Não carregou';
      statusColor = 'var(--red)';
    } else if (noXpt) {
      cardClass += ' atencao';
      statusLabel = '⚠️ Aguardando carregamento';
      statusColor = 'var(--yellow)';
    } else {
      cardClass += ' ok';
      statusLabel = '▶ Em curso';
      statusColor = 'var(--green)';
    }

    const card = document.createElement('div');
    card.className = cardClass;
    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <div class="farol-rota">${rotaIdLink(r)}</div>
          <div class="farol-motorista" style="display:flex;align-items:center;gap:4px">${r.motorista}${ctWhatsBtnHTML(r)}</div>
        </div>
        <div style="font-size:11px;font-weight:700;color:${statusColor};text-align:right;max-width:140px;">${statusLabel}</div>
      </div>
      <div class="farol-info">
        <div class="farol-info-item">
          <label>Início previsto</label>
          <span>${r.hora_inicio || '—'}</span>
        </div>
        <div class="farol-info-item">
          <label>1º Movimento</label>
          <span style="color:${temMovimento ? 'var(--green)' : 'var(--red)'};">${r.hora_primeiro_mov || '—'}</span>
        </div>
        <div class="farol-info-item">
          <label>Placa</label>
          <span>${r.placa || '—'}</span>
        </div>
        <div class="farol-info-item">
          <label>Pacotes</label>
          <span>${r.entregues}/${r.total}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  const alertCount = extras.filter(r => r.status === 'no_xpt' && !(r.hora_primeiro_mov && r.hora_primeiro_mov !== '-')).length;
  const okCount = extras.filter(r => r.hora_primeiro_mov && r.hora_primeiro_mov !== '-').length;

  const summary = document.createElement('div');
  summary.style.cssText = 'display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;';
  summary.innerHTML = `
    <div class="mini-stat"><div class="val" style="color:var(--purple)">${extras.length}</div><div class="lbl">Total Extra</div></div>
    <div class="mini-stat"><div class="val" style="color:var(--green)">${okCount}</div><div class="lbl">Em rota</div></div>
    <div class="mini-stat"><div class="val" style="color:var(--red)">${alertCount}</div><div class="lbl">Não carregou${pastAlert ? ' ⚠️' : ''}</div></div>
    <div class="mini-stat" style="margin-left:auto;"><div class="lbl" style="font-size:12px;">Horário de referência: <strong>10:00</strong> | Alerta após: <strong>10:30</strong></div></div>
  `;
  container.appendChild(summary);
  container.appendChild(grid);
}

// ── Contador regressivo para próxima atualização ──────────────
setInterval(function() {
  const lbl = document.getElementById('next-refresh-lbl');
  if (!lbl || !_refreshTimer) return;
  // approximate: just show next update text based on last fetch
  const now = Date.now();
  lbl.textContent = '';  // simplified: just show badge state
}, 5000);

</script>

</body>
</html>
